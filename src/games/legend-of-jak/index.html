<style>
/* Layout: one arcade cabinet column. 16-bit screen on top, dialog box or touch stick underneath. Single dark arcade look by design. */
:root{
  --bg:#0d0718;
  --panel:#1b1030;
  --panel-edge:#3b2a63;
  --ink:#fff4e6;
  --dim:#a596c4;
  --carrot:#ff5c00;
  --pink:#ff4fd8;
  --cyan:#5fe8ff;
  --gold:#ffd23f;
  --font-pixel:'Press Start 2P', 'Courier New', monospace;
  --font-body:'VT323', 'Courier New', monospace;
  color-scheme: dark;
}
html,body{height:100%;overscroll-behavior:none}
/* a game, not a page: no text selection, no long-press callouts, no double-tap zoom */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button,.chip,.start,.dialog,.pad{touch-action:manipulation}
body[data-mode="game"],body[data-mode="boss"]{overflow:hidden;position:fixed;inset:0;width:100%}
body[data-mode="game"] #app,body[data-mode="boss"] #app,body[data-mode="game"] .controls,body[data-mode="boss"] .controls{touch-action:none}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);margin:0;-webkit-tap-highlight-color:transparent}
#app{box-sizing:border-box;max-width:860px;margin:0 auto;padding-inline:16px;padding-block:10px 14px;display:flex;flex-direction:column;gap:10px;min-height:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--font-pixel);font-size:10px;letter-spacing:.08em;color:var(--carrot);text-shadow:2px 2px 0 #3a1200}
.brand small{display:block;color:var(--dim);font-size:7px;margin-top:5px;letter-spacing:.12em}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--font-pixel);font-size:8px;letter-spacing:.06em;background:var(--panel);color:var(--ink);border:2px solid var(--panel-edge);padding:9px 10px;cursor:pointer;box-shadow:0 3px 0 #000}
.chip:hover{border-color:var(--cyan)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.chip:focus-visible,.start:focus-visible,.dialog:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{position:relative;width:min(100%, calc((100dvh - 250px) * 1.1428));min-width:min(100%,280px);aspect-ratio:256/224;max-width:100%;margin:0 auto;background:#000;border:4px solid var(--panel-edge);box-shadow:0 0 0 4px #000, 0 0 40px rgba(255,92,0,.25)}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:pointer}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:rgba(13,7,24,.86);padding:16px}
.overlay h2{font-family:var(--font-pixel);font-size:clamp(11px,3.4vw,18px);line-height:1.5;margin:0;color:var(--gold);text-wrap:balance;text-shadow:3px 3px 0 #3a1200}
.overlay p{font-size:clamp(18px,4.6vw,26px);margin:0;max-width:30ch;line-height:1.05}
.overlay .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.under{width:min(100%, calc((100dvh - 250px) * 1.1428));min-width:min(100%,280px);max-width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.dialog{position:relative;background:var(--panel);border:4px solid var(--ink);box-shadow:inset 0 0 0 3px #000, 0 0 0 3px #000;padding:12px 14px 22px;min-height:6.4em;font-size:clamp(20px,4.8vw,25px);line-height:1.1;cursor:pointer;user-select:none}
.who{font-family:var(--font-pixel);font-size:9px;letter-spacing:.08em;color:var(--cyan);min-height:9px;margin-bottom:8px}
.who:empty{display:none}
.next{position:absolute;right:12px;bottom:6px;font-family:var(--font-pixel);font-size:10px;color:var(--gold);animation:blink .9s steps(2) infinite}
.count{position:absolute;left:14px;bottom:7px;font-family:var(--font-pixel);font-size:7px;color:var(--dim)}
.start{font-family:var(--font-pixel);font-size:13px;letter-spacing:.1em;background:var(--carrot);color:#fff;border:4px solid #fff;box-shadow:0 0 0 3px #000,0 5px 0 3px #000;padding:14px 18px;cursor:pointer;margin-top:10px;animation:pulse 1.1s steps(2) infinite}
.start:active{transform:translateY(3px)}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{background:var(--pink)}}
.controls{display:flex;align-items:center;justify-content:space-between;gap:14px}
.hint{font-size:clamp(18px,4.4vw,22px);color:var(--dim);line-height:1.05;min-width:0}
.hint b{color:var(--gold);font-weight:normal}
.pad{flex:none;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle,#2a1a48 0 55%,#1b1030 56%);border:4px solid var(--panel-edge);position:relative;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--carrot);border:4px solid #fff;box-shadow:0 4px 0 #000}
footer{font-family:var(--font-pixel);font-size:7px;color:var(--dim);text-align:center;letter-spacing:.1em;line-height:1.8}
.chip:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 3px 0 #000}
.status{color:var(--dim);margin-top:4px}
/* immersive full screen: no page chrome, game fills the display */
body.fs{overflow:hidden;background:#000}
body.fs #app{position:fixed;inset:0;max-width:none!important;min-height:0;margin:0;gap:4px;padding:calc(env(safe-area-inset-top,0px) + 2px) calc(env(safe-area-inset-right,0px) + 4px) calc(env(safe-area-inset-bottom,0px) + 4px) calc(env(safe-area-inset-left,0px) + 4px);display:flex;flex-direction:column}
body.fs footer,body.fs .brand,body.fs .hint{display:none!important}
body.fs .topbar{justify-content:flex-end;flex-wrap:nowrap;flex:none}
body.fs .topbar .btns{gap:4px;flex-wrap:nowrap}
body.fs .topbar .chip{padding:5px 7px;font-size:7px;box-shadow:none;opacity:.85}
body.fs .screen{border-width:2px;box-shadow:none;min-width:0;max-width:none;flex:none}
body.fs .under{width:auto!important;max-width:none;min-width:0;flex:1 1 auto;min-height:0;overflow:auto}
body.fs .dialog{font-size:clamp(16px,3.8vw,22px);min-height:0}
body.fs.land #app{display:grid;grid-template-columns:auto minmax(220px,1fr);grid-template-rows:auto 1fr;align-items:start}
body.fs.land .topbar{grid-column:1 / span 2}
body.fs.land .screen{grid-column:1;grid-row:2;margin:0}
body.fs.land .under{grid-column:2;grid-row:2;height:100%}
body.fs.land .controls{flex-direction:column;justify-content:flex-end;height:100%}
/* portrait full screen while playing: the game fills the display edge to edge and the stick and buttons float over it */
body.fs.over #app{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);gap:0}
body.fs.over .screen{border:0;margin:0 auto}
body.fs.over .under{position:fixed;left:0;right:0;bottom:0;width:auto!important;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 10px);overflow:visible;z-index:6;pointer-events:none}
body.fs.over .under>*{pointer-events:auto}
body.fs.over .controls{background:transparent}
body.fs.over .pad{background:radial-gradient(circle,rgba(42,26,72,.55) 0 55%,rgba(27,16,48,.55) 56%);border-color:rgba(255,255,255,.35)}
body.fs.over .controls .start,body.fs.over .controls .chip{opacity:.92}
body.fs.over .topbar{padding:2px 4px}
#fsTip{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:60;font-family:var(--font-pixel);font-size:9px;line-height:1.6;background:var(--panel);border:3px solid var(--gold);padding:10px;color:var(--ink)}
#updBar{display:block;width:100%;margin:0 0 8px;font-size:10px;padding:10px 8px;background:#1d8fb8}
#laserBtn{background:#1d8fb8;margin-top:0}#laserBtn.charging{background:#2a3a4a;color:#8ab;animation:none}
#baconBtn{background:#8a2a1a;color:#ffe0c8;border-color:#e0806a}
#devBtn{background:#3a0d0d;border-color:#ff3b3b;color:#ff8a8a}
#devPanel{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 44px);transform:translateX(-50%);z-index:80;width:min(92vw,360px);background:#1a0808;border:3px solid #ff3b3b;box-shadow:0 0 0 3px #000;padding:10px;display:grid;gap:8px;font-family:var(--font-pixel);font-size:8px;color:#ffb0b0;line-height:1.6}
#devPanel .row{display:flex;flex-wrap:wrap;gap:6px}
#devPanel .chip{background:#3a0d0d;border-color:#ff6b6b}
.namein{display:block;font-family:var(--font-pixel);font-size:16px;letter-spacing:.08em;text-transform:uppercase;background:#000;color:var(--ink);border:3px solid var(--carrot);box-shadow:0 0 0 3px #000;padding:10px 12px;margin-top:10px;width:100%;max-width:300px;box-sizing:border-box}
.namein::placeholder{color:#6b5a8a}
.acctin{text-transform:none;font-size:12px;letter-spacing:.02em;max-width:340px}
.acctform{display:grid;gap:2px}
.acctmsg{color:#ff8fc8;min-height:1em}
.maprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.maprow .start{margin-top:0;font-size:11px;padding:11px 14px}
.shop{display:grid;gap:7px;margin-top:6px;font-size:.78em}
.shop-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shop-row .nm{min-width:0;line-height:1}
.shop-row .nm b{display:block;font-family:var(--font-pixel);font-size:8px;font-weight:normal;color:var(--gold);letter-spacing:.06em;margin-bottom:4px}
.pips{color:var(--carrot);letter-spacing:1px;font-family:'Courier New',monospace;font-size:.8em}
.shop-row .chip{flex:none}
body[data-mode="game"] #app{max-width:1272px}
body[data-mode="game"] footer{display:none}
body[data-mode="game"] .screen{min-width:0}
body[data-mode="game"] .controls,body[data-mode="boss"] .controls{justify-content:center}
body[data-mode="game"] .pad{width:108px;height:108px}
body[data-mode="game"] .knob{width:44px;height:44px;margin:-22px 0 0 -22px}
@media (prefers-reduced-motion: reduce){.next,.start{animation:none}}
</style>

<body>
<div id="app">
  <button class="start" id="updBar" type="button" hidden>NEW VERSION READY: TAP TO UPDATE</button>
  <div class="topbar">
    <div class="brand">DISCO CARROT<small>THE LEGEND OF JAK</small></div>
    <div class="btns">
      <button class="chip" id="skipBtn" type="button">SKIP TO GAME</button>
      <button class="chip" id="storyBtn" type="button" hidden>WATCH STORY</button>
      <button class="chip" id="pauseBtn" type="button" hidden>PAUSE</button>
      <button class="chip" id="mapBtn" type="button" hidden>TOUR MAP</button>
      <button class="chip" id="fsBtn" type="button">FULL SCREEN</button>
      <button class="chip" id="muteBtn" type="button">SOUND: ON</button>
      <button class="chip" id="devBtn" type="button" hidden>DEV</button>
    </div>
  </div>

  <div class="screen" id="screen">
    <canvas id="cv" width="256" height="224" aria-label="The Legend of Jak, 16-bit story and game"></canvas>
    <div class="overlay" id="overlay" hidden>
      <h2 id="ovTitle"></h2>
      <p id="ovText"></p>
      <div class="row" id="ovBtns"></div>
    </div>
  </div>

  <div class="under">
    <div class="dialog" id="dialog" tabindex="0" role="button" aria-live="polite">
      <div class="who" id="who"></div>
      <div id="dtext"></div>
      <div class="count" id="count"></div>
      <div class="next" id="next">&#9660;</div>
    </div>
    <div class="controls" id="controls" hidden>
      <div class="hint" id="hint"><b>Arrow keys</b> or <b>WASD</b> to drive Jak. Eat <b>disco carrots</b>, pick up <b>skiers and dancers</b>, dodge the <b>Grumps</b>.</div>
      <button class="chip" id="shopBtn" type="button" hidden>ENTER SHOP</button>
      <button class="start" id="bassBtn" type="button" hidden>BASS</button>
      <button class="start" id="laserBtn" type="button" hidden>LASER</button>
      <button class="chip" id="baconBtn" type="button" hidden>BACON</button>
      <div class="pad" id="pad"><div class="knob" id="knob"></div></div>
    </div>
  </div>
  <input type="file" id="sampleFile" accept="audio/*" hidden>
  <div id="devPanel" hidden></div>
  <footer>THIOKOL ENTERTAINMENT &middot; MISSOULA, MONTANA &middot; @DISCOCARROTSNOWCAT</footer>
</div>

<script>
// Jak soundtrack engine: 16-bit house and techno, all synthesized. makeJakMusic(audioContext, outputNode)
function makeJakMusic(ac,out){
  'use strict';
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  // signal chain: instruments -> bus -> warm lowpass -> glue compressor -> level -> out
  const bus=ac.createGain();
  const warm=ac.createBiquadFilter();warm.type='lowpass';warm.frequency.value=8500;warm.Q.value=0.4;
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=10;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.2;
  const level=ac.createGain();level.gain.value=1.4;
  bus.connect(warm);warm.connect(comp);comp.connect(level);level.connect(out);
  const duck=ac.createGain();duck.connect(bus); // melodic parts pump against the kick
  const echo=ac.createDelay(2),fb=ac.createGain(),ehp=ac.createBiquadFilter(),wet=ac.createGain();
  ehp.type='highpass';ehp.frequency.value=700;fb.gain.value=0.33;wet.gain.value=0.4;
  echo.connect(ehp);ehp.connect(fb);fb.connect(echo);ehp.connect(wet);wet.connect(bus);
  const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const pulse=w=>{const n=48,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*w);return ac.createPeriodicWave(re,im);};
  const P25=pulse(0.25),P12=pulse(0.125);

  function vco(type,f,t,stop,det){const o=ac.createOscillator();if(type==='p25')o.setPeriodicWave(P25);else if(type==='p12')o.setPeriodicWave(P12);else o.type=type;
    o.frequency.setValueAtTime(f,t);if(det)o.detune.value=det;o.start(t);o.stop(stop);return o;}
  function vca(t,v,dur,dest,attack=0.002){const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(dest);return g;}
  function nz(t,dur,ftype,freq,v,q=0.7,dest=bus){const s=ac.createBufferSource();s.buffer=nb;const f=ac.createBiquadFilter();f.type=ftype;f.frequency.value=freq;f.Q.value=q;
    s.connect(f);f.connect(vca(t,v,dur,dest,0.001));s.start(t,Math.random()*0.3);s.stop(t+dur+0.02);return f;}

  const I={
    kick(t,v){const o=vco('sine',155,t,t+0.42);o.frequency.exponentialRampToValueAtTime(47,t+0.11);o.connect(vca(t,v,0.38,bus,0.001));nz(t,0.012,'highpass',2600,v*0.25);
      duck.gain.cancelScheduledValues(t);duck.gain.setValueAtTime(0.28,t);duck.gain.linearRampToValueAtTime(1,t+0.22);},
    clap(t,v){[0,0.011,0.022].forEach(d=>nz(t+d,0.018,'bandpass',1400,v*0.7,0.9));nz(t+0.03,0.16,'bandpass',1250,v*0.45,0.8);},
    hat(t,v,open){nz(t,open?0.17:0.035,'highpass',open?7000:8200,v);},
    crash(t,v){nz(t,1.7,'highpass',3800,v);},
    riser(t,dur,v){const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=2.5;
      f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(7000,t+dur);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+dur);g.gain.linearRampToValueAtTime(0.0001,t+dur+0.03);
      s.connect(f);f.connect(g);g.connect(bus);s.start(t);s.stop(t+dur+0.05);},
    tom(t,v){const o=vco('sine',210,t,t+0.2);o.frequency.exponentialRampToValueAtTime(85,t+0.16);o.connect(vca(t,v,0.18,bus));},
    bass(t,m,dur,o){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=o.q||1;const c=o.cut||600;
      f.frequency.setValueAtTime(Math.min(16000,c*(o.acc?3.2:1.8)),t);f.frequency.exponentialRampToValueAtTime(Math.max(70,c*0.55),t+dur);
      vco(o.type||'square',mtof(m),t,t+dur+0.03).connect(f);f.connect(vca(t,o.v||0.25,dur,duck,0.004));},
    stab(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(3400,t);f.frequency.exponentialRampToValueAtTime(800,t+dur);
      const g=vca(t,v*1.6,dur,duck,0.003);f.connect(g);ms.forEach((m,j)=>vco('p25',mtof(m),t,t+dur+0.03,j%2?7:-7).connect(f));},
    pad(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1100;const g=ac.createGain();
      g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.35);g.gain.setValueAtTime(v,t+dur*0.75);g.gain.linearRampToValueAtTime(0.0001,t+dur);
      f.connect(g);g.connect(duck);ms.forEach((m,j)=>vco('sawtooth',mtof(m),t,t+dur+0.05,j%2?9:-9).connect(f));},
    lead(t,m,dur,v){const o=vco('p12',mtof(m),t,t+dur+0.05);const g=vca(t,v,dur,bus,0.004);o.connect(g);g.connect(echo);},
    bell(t,m,dur,v){const o=vco('triangle',mtof(m),t,t+dur+0.05),o2=vco('p25',mtof(m+12),t,t+dur*0.5);const g=vca(t,v,dur,bus,0.002);o.connect(g);o2.connect(vca(t,v*0.25,dur*0.5,g));g.connect(echo);},
    tri(t,m,dur,v){vco('triangle',mtof(m),t,t+dur+0.05).connect(vca(t,v,dur,bus,0.01));},
    snare(t,v){nz(t,0.16,'bandpass',1900,v*0.7,0.7);const o=vco('triangle',200,t,t+0.1);o.frequency.exponentialRampToValueAtTime(150,t+0.08);o.connect(vca(t,v*0.5,0.09,bus));},
    saw3(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=3600;const g=vca(t,v,dur,duck,0.004);f.connect(g);g.connect(echo);
      for(const m of ms)for(const d of [-14,0,14])vco('sawtooth',mtof(m),t,t+dur+0.03,d).connect(f);},
    wobble(t,m,dur,rate,v){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=9;f.frequency.value=650;

  const out=document.createElement('canvas');out.width=w*3;out.height=h*3;const oc=out.getContext('2d'),oi=oc.createImageData(w*3,h*3),o=new Uint32Array(oi.data.buffer);
  const P=(x,y)=>a[Math.max(0,Math.min(h-1,y))*w+Math.max(0,Math.min(w-1,x))];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const A=P(x-1,y-1),B=P(x,y-1),C=P(x+1,y-1),D=P(x-1,y),E=P(x,y),F=P(x+1,y),G2=P(x-1,y+1),H2=P(x,y+1),I=P(x+1,y+1);
    let e=[E,E,E,E,E,E,E,E,E];
    if(B!==H2&&D!==F){e[0]=D===B?D:E;e[1]=(D===B&&E!==C)||(B===F&&E!==A)?B:E;e[2]=B===F?F:E;e[3]=(D===B&&E!==G2)||(D===H2&&E!==A)?D:E;

let mode='splash',sceneIdx=0,pageIdx=0,sceneStart=0,pageStart=0,flags={},typedLen=0;
function pageObj(){const pg=SCENES[sceneIdx].pages[pageIdx];return typeof pg==='string'?{who:'',text:pg}:pg;}
function setPage(){
  const pg=pageObj();whoEl.textContent=pg.who||'';dtext.textContent='';typedLen=0;pageStart=performance.now();flags={};
  countEl.textContent=`${sceneIdx+1} / ${SCENES.length}`;
  nextEl.hidden=false;
}
function enterScene(i){
  sceneIdx=i;pageIdx=0;sceneStart=performance.now();
  const s=SCENES[i];if(s.song!==undefined)AudioK.setSong(s.song);
  setPage();
}
function startStory(){
  AudioK.init();mode='story';overlay.hidden=true;dialog.hidden=false;controls.hidden=true;skipBtn.hidden=false;storyBtn.hidden=true;mapBtn.hidden=true;
  enterScene(0);fitScreen();
}
function advance(){
  if(mode==='splash'){if(PL.last&&acctOf(PL.last)&&PL.list.some(p=>p.id===PL.last)){AudioK.init();AudioK.setSong('story');pickPlayer(PL.last);}else openPlayers();return;}
  if(mode!=='story')return;
  const pg=pageObj();
  if(typedLen<pg.text.length){typedLen=pg.text.length;dtext.textContent=pg.text;return;}
  if(pg.final)return;
  const s=SCENES[sceneIdx];
  if(pageIdx<s.pages.length-1){pageIdx++;setPage();}
  else if(sceneIdx<SCENES.length-1)enterScene(sceneIdx+1);
}
function updateTypewriter(now){
  const pg=pageObj();const want=Math.min(pg.text.length,Math.floor((now-pageStart)/28));
  if(want>typedLen){
    if(Math.floor(want/3)>Math.floor(typedLen/3)&&pg.text[want-1]!==' ')AudioK.sfx.blip();
    typedLen=want;dtext.textContent=pg.text.slice(0,typedLen);
  }
  if(pg.final&&typedLen>=pg.text.length&&!dtext.querySelector('.start')){
    const b=document.createElement('button');b.className='start';b.type='button';b.textContent='PRESS START';
    b.addEventListener('click',e=>{e.stopPropagation();openMap();});
    dtext.appendChild(document.createElement('br'));dtext.appendChild(b);nextEl.hidden=true;b.focus({preventScroll:true});
  }
}
function drawPaused(now){ctx.globalAlpha=0.55;R(0,0,W,H,'#0b0620');ctx.globalAlpha=1;txt('PAUSED',W/2,H/2-12,PAL.Y,16,'center');txt(coarse?'TAP RESUME':'P OR ESC TO RESUME',W/2,H/2+10,'#c9b8ff',8,'center',null);}
function drawSplash(t){
  SCENES[0].draw(t);
  ctx.globalAlpha=0.55;R(0,148,W,30,'#000');ctx.globalAlpha=1;
  if(Math.floor(t/500)%2)txt('TAP TO BEGIN',128,158,'#fff',8,'center');
}

const PS={mode:'list'};
function playerGold(id){const sv=lsGet(SAVE_PREFIX+id)||{};return RESORTS.filter(r=>!r.boss&&sv.cleared&&sv.cleared[r.id]).length;}
function openPlayers(){AudioK.init();AudioK.setSong('story');mode='players';overlay.hidden=true;dialog.hidden=false;controls.hidden=true;skipBtn.hidden=true;storyBtn.hidden=true;mapBtn.hidden=true;
  PS.mode=PL.list.length?'list':'new';fitScreen();playersUI();}
function pickPlayer(id,fresh){PL.cur=id;PL.last=id;savePlayers();applySave(lsGet(SAVE_PREFIX+id));AudioK.sfx.recruit();

function fillPoly(pts,col){let minY=Infinity,maxY=-Infinity;for(const p of pts){if(p[1]<minY)minY=p[1];if(p[1]>maxY)maxY=p[1];}
  ctx.fillStyle=col;

    for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];if((a[1]<=yc&&b[1]>yc)||(b[1]<=yc&&a[1]>yc))xs.push(a[0]+(yc-a[1])/(b[1]-a[1])*(b[0]-a[0]));}
    xs.sort((p,q)=>p-q);for(let k=0;k+1<xs.length;k+=2){const x0=Math.round(xs[k]),x1=Math.round(xs[k+1]);if(x1>x0)ctx.fillRect(x0,y,x1-x0,1);}}}
function pline(x0,y0,x1,y1,col){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);ctx.fillStyle=col;

const API=location.protocol.startsWith('http')&&/(^|\.)discocarrot\.com$|\.netlify\.app$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)?'/api/jak':null;
const CLOUD={timer:null,pending:false,note:''};
function acctOf(id){const p=PL.list.find(q=>q.id===id);return p&&p.acct&&p.acct.token?p.acct:null;}
async function api(path,o={}){const ac=window.AbortController?new AbortController():null,to=setTimeout(()=>ac&&ac.abort(),9000);
  try{const r=await fetch(API+path,{method:o.method||'GET',headers:{'content-type':'application/json',...(o.token?{authorization:'Bearer '+o.token}:{})},body:o.body?JSON.stringify(o.body):undefined,keepalive:!!o.keepalive,cache:'no-store',signal:ac?ac.signal:undefined});
    let j=null;try{j=await r.json();}catch(e){}if(!r.ok){const e=new Error((j&&j.error)||'Something went wrong.');e.status=r.status;e.body=j;throw e;}return j;}
  catch(e){if(!e.status){const n=new Error("Couldn't reach discocarrot.com. Check your connection and try again.");n.status=0;throw n;}throw e;}finally{clearTimeout(to);}}
function cloudPush(now){const id=PL.cur,a=acctOf(id);if(!API||!a)return;CLOUD.pending=true;clearTimeout(CLOUD.timer);
  const go=()=>{if(!CLOUD.pending||PL.cur!==id)return;CLOUD.pending=false;
    api('/save',{method:'PUT',token:a.token,body:{save:P,t:P.t||Date.now()},keepalive:true}).then(()=>{CLOUD.note='';})
      .catch(e=>{if(e.status===401){a.token=null;savePlayers();CLOUD.note='Signed out. Sign in again to keep saving online.';}else if(e.status===409){CLOUD.note='';}else{CLOUD.pending=true;CLOUD.note='Saved on this device. Will save online when the connection is back.';}});};
  if(now)go();else CLOUD.timer=setTimeout(go,2500);}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&CLOUD.pending)cloudPush(true);});
window.addEventListener('pagehide',()=>{if(CLOUD.pending)cloudPush(true);});
function uniqueName(n){n=cleanName(n)||'PLAYER';const taken=x=>PL.list.some(p=>p.name===x);if(!taken(n))return n;let k=2;while(taken((n.slice(0,8)+' '+k).trim()))k++;return (n.slice(0,8)+' '+k).trim();}
// sign in or sign up; attachTo = an existing local player whose progress goes into the new account
async function acctSubmit(kind,email,pw,name,attachTo){
  const body={email,password:pw,name};if(attachTo&&kind==='signup'&&attachTo===PL.cur){P.t=P.t||Date.now();body.save=P;body.t=P.t;}
  const res=await api('/'+kind,{method:'POST',body});
  let p=attachTo?PL.list.find(q=>q.id===attachTo):PL.list.find(q=>q.acct&&q.acct.email===res.email);
  if(!p){if(PL.list.length>=8)PL.list=PL.list.filter(q=>q.acct||q.id===PL.last).slice(-7);p={id:'a'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),name:uniqueName(res.name)};PL.list.push(p);}
  p.acct={email:res.email,token:res.token};
  const local=lsGet(SAVE_PREFIX+p.id);if(res.save&&(+res.t||0)>((local&&+local.t)||0))lsSet(SAVE_PREFIX+p.id,{...res.save,t:+res.t});
  savePlayers();return p;}

  dtext.appendChild(mk('div','',kind==='login'?'Pick up your tour right where you left off, on any phone or computer.':attachTo?`Save ${curName()}'s tour to an account so it follows you to any device.`:'Make an account so your tour follows you to any device.'));
  const form=mk('form','acctform');form.noValidate=true;form.addEventListener('click',e=>e.stopPropagation());
  const field=(type,ph,ac,cls)=>{const i=mk('input',cls||'namein acctin');i.type=type;i.placeholder=ph;i.autocomplete=ac;i.spellcheck=false;i.setAttribute('aria-label',ph);i.setAttribute('autocapitalize','none');i.addEventListener('keydown',e=>e.stopPropagation());return i;};
  const em=field('email','EMAIL','email'),pw=field('password',kind==='login'?'PASSWORD':'PASSWORD (8+ CHARACTERS)',kind==='login'?'current-password':'new-password');
  let nm=null;if(kind==='signup'&&!attachTo){nm=field('text','PLAYER NAME','nickname','namein');nm.maxLength=10;nm.setAttribute('autocapitalize','characters');}
  const msg=mk('div','acctmsg',''),row=mk('div','maprow'),go=btn(kind==='login'?'SIGN IN':'CREATE ACCOUNT','start',()=>{});go.type='submit';
  row.append(go,btn(kind==='login'?'NEW ACCOUNT':'I HAVE ONE','chip',()=>acctForm(kind==='login'?'signup':'login',attachTo,back)),btn('BACK','chip',back));
  form.append(...(nm?[nm]:[]),em,pw,msg,row);dtext.appendChild(form);
  async function submit(){const e=em.value.trim(),p=pw.value;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){msg.textContent="That email doesn't look right.";em.focus();return;}
    if(p.length<(kind==='login'?1:8)){msg.textContent=kind==='login'?'Type your password.':'Use a password with at least 8 characters.';pw.focus();return;}
    go.disabled=true;msg.style.color='#a596c4';msg.textContent=kind==='login'?'Signing in...':'Creating your account...';
    try{const pl=await acctSubmit(kind,e,p,nm?nm.value:curName(),attachTo);AudioK.sfx.recruit();
      if(attachTo){CLOUD.note='';whoEl.textContent='SAVED ONLINE';dtext.innerHTML='';dtext.appendChild(mk('div','',`${curName()}'s tour is saved to ${pl.acct.email}. Sign in with it on any device to keep going.`));const r2=mk('div','maprow');r2.appendChild(btn('BACK','start',back));dtext.appendChild(r2);r2.querySelector('button').focus({preventScroll:true});}
      else pickPlayer(pl.id,true);}
    catch(err){go.disabled=false;msg.style.color='';msg.textContent=err.message;}}
  form.addEventListener('submit',ev=>{ev.preventDefault();submit();});

function signOut(){const p=PL.list.find(q=>q.id===PL.cur);if(!p||!p.acct)return;const tok=p.acct.token;cloudPush(true);
  if(API&&tok)setTimeout(()=>api('/logout',{method:'POST',token:tok}).catch(()=>{}),400);p.acct=null;savePlayers();AudioK.sfx.blip();}
function curName(){const p=PL.list.find(q=>q.id===PL.cur);return p?p.name:'';}
function unlocked(i){const r=RESORTS[i];if(!r||r.soon)return false;if(DEV.on)return true;return i===0||!!P.cleared[r.id]||!!P.cleared[RESORTS[i-1].id];}
function goldCount(){return RESORTS.filter(r=>!r.boss&&P.cleared[r.id]).length;}
const LEVEL_COUNT=RESORTS.filter(r=>!r.boss).length;
function stopNo(ri){return RESORTS.slice(0,ri+1).filter(r=>!r.boss).length;}
function nodePos(k){return k===0?HQ:RESORTS[k-1];}
function segPts(k){const A=nodePos(k),B=nodePos(k+1);return [[A.x,A.y],...(RESORTS[k].via||[]),[B.x,B.y]];}
function polyAt(pts,f){let tot=0;const L=[];for(let i=0;i<pts.length-1;i++){const d=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);L.push(d);tot+=d;}
  let want=f*tot;for(let i=0;i<L.length;i++){if(want<=L[i]||i===L.length-1){const t=L[i]?Math.min(1,want/L[i]):1;return {x:pts[i][0]+(pts[i+1][0]-pts[i][0])*t,y:pts[i][1]+(pts[i+1][1]-pts[i][1])*t,dx:pts[i+1][0]-pts[i][0]};}want-=L[i];}
  return {x:pts[0][0],y:pts[0][1],dx:1};}
function mk(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function btn(label,cls,fn,disabled){const b=mk('button',cls,label);b.type='button';if(disabled)b.disabled=true;b.addEventListener('click',e=>{e.stopPropagation();fn();});return b;}

// ---------- party sample (stays in this browser) ----------
const SAMPLE={buf:null,name:'',blob:null,err:''};
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('jak-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('clips');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
async function idbSet(val){try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction('clips','readwrite');val?tx.objectStore('clips').put(val,'party'):tx.objectStore('clips').delete('party');tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}catch(e){}}
async function idbGet(){try{const db=await idb();return await new Promise((res,rej)=>{const r=db.transaction('clips').objectStore('clips').get('party');r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);});}catch(e){return null;}}
idbGet().then(v=>{if(v&&v.blob){SAMPLE.blob=v.blob;SAMPLE.name=v.name||'clip';if(mode==='shop')shopInfo();}});
async function ensureSample(){
  if(SAMPLE.buf||!SAMPLE.blob)return SAMPLE.buf;
  try{SAMPLE.buf=await AudioK.decode(await SAMPLE.blob.arrayBuffer());}catch(e){SAMPLE.err='That file would not play. Try an MP3, WAV or M4A.';SAMPLE.blob=null;}
  return SAMPLE.buf;
}
function playPartySample(){if(SAMPLE.buf)AudioK.playSample(SAMPLE.buf);else if(SAMPLE.blob)ensureSample().then(b=>{if(b&&mode==='game'&&G.party>0)AudioK.playSample(b);});}
sampleFile.addEventListener('change',async()=>{
  const f=sampleFile.files&&sampleFile.files[0];sampleFile.value='';if(!f)return;
  SAMPLE.err='';
  if(f.size>15*1024*1024){SAMPLE.err='That file is over 15 MB. Trim it to a short clip first.';refreshShopUI();return;}
  try{const buf=await AudioK.decode(await f.arrayBuffer());SAMPLE.buf=buf;SAMPLE.blob=f;SAMPLE.name=f.name;idbSet({blob:f,name:f.name});AudioK.playSample(buf,4);}
  catch(e){SAMPLE.err='That file would not play. Try an MP3, WAV or M4A.';}

function clearSample(){SAMPLE.buf=null;SAMPLE.blob=null;SAMPLE.name='';SAMPLE.err='';idbSet(null);refreshShopUI();}

function rigPos(now){
  if(M.anim){const a=M.anim,n=a.path.length-1;

    else{txt('PARTIES',4,by+3,'#fff',8,'left',null);for(let k=0;k<3;k++){const x=62+k*10;R(x,by+3,7,7,k<G.parties?PAL.Y:'#3a2a5a');if(k<G.parties)R(x+1,by+4,2,2,'#fff');}
      if(D.snowing){const sp=G.snowpack,hot=sp>=80&&Math.floor(now/250)%2;txt('SNOWPACK',W-48,by+3,hot?'#ff6b6b':'#9fd8ff',8,'right',null);R(W-44,by+3,40,7,'#2a3a5a');R(W-43,by+4,38*sp/100,5,sp>=80?(hot?'#ff3b3b':'#ffffff'):'#9fd8ff');}
      else txt('5 CARROTS = PARTY',W-4,by+3,'#a596c4',8,'right',null);}}
  if(G.banner){const b=G.banner;const h=b.lines.length*14+10,y=Math.round(H*0.32);ctx.globalAlpha=0.82;R(0,y,W,h,PAL.K);ctx.globalAlpha=1;R(0,y,W,1,b.col);R(0,y+h-1,W,1,b.col);
    b.lines.forEach((l,i)=>txt(l,W/2,y+6+i*14,i===0?b.col:'#fff',8,'center'));}
  if(G.intro>0){ctx.save();ctx.translate(Math.round((W-256)/2),Math.round((H-HUDB-224)/2));
    ctx.globalAlpha=0.9;R(8,22,240,192,PAL.K);ctx.globalAlpha=1;R(8,22,240,1,PAL.O);R(8,213,240,1,PAL.O);
    txt(RS.name,128,30,PAL.Y,8,'center');txt(G.driver.name+' + '+G.dj.name,128,40,'#5fe8ff',8,'center',null);
    const nRows=3+(fuel?1:0)+(D.powder?1:0)+(D.steep?1:0),gap=nRows>4?16:nRows>3?19:22;let y=52;
    drawCarrot(30,y,now,false);txt('EAT DISCO CARROTS',50,y+6,'#fff',8);y+=gap;

    if(D.steep){for(let k=0;k<4;k++){R(33-k,y+4+k,1+k*2,1,'#111');R(33-k,y+10-k,1+k*2,1,'#111');}txt('BLACK RUNS PULL YOU DOWN',50,y+6,'#fff',8);y+=gap;}

    else{txt('CAT TRACKS = FAST LANE',128,y+6,'#ff9a4d',8,'center');

    if(Math.floor(now/400)%2){R(46,198,164,13,PAL.O);txt(coarse?'TAP TO START':'PRESS SPACE TO START',128,201,'#fff',8,'center',null);}

}
// ---------- loop ----------
let lastT=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  try{
  if(mode==='splash')drawSplash(now);
  else if(mode==='players')drawPlayers(now);
  else if(mode==='story'){const s=SCENES[sceneIdx];const t=now-sceneStart,pt=now-pageStart;if(s.tick)s.tick(t,pageIdx,pt,flags);s.draw(t,pageIdx,pt);updateTypewriter(now);}
  else if(mode==='map'){updateMap(now);drawMap(now);}
  else if(mode==='preview')drawPreview(now);
  else if(mode==='crew')drawCrew(now);
  else if(mode==='results')drawResults(now);
  else if(mode==='shop')drawShop(now);
  else if(mode==='slots'){updateSlots(now);drawSlots(now);}
  else if(mode==='boss'||mode==='bossEnd'){if(mode==='boss'&&!paused)updateBoss(dt,now);drawBoss(now);if(paused)drawPaused(now);}
  else if(mode==='game'){if(!paused)updateGame(dt,now);drawGame(now);if(paused)drawPaused(now);}
  {const pb=(mode==='game'||mode==='boss');if(pauseBtn.hidden===pb)pauseBtn.hidden=!pb;}
  }catch(err){if(!frame.warned){frame.warned=1;console.error(err);}}
  requestAnimationFrame(frame);
}

// ---------- input ----------
// The page must never scroll, zoom or select text under a thumb that is driving Jak.
const playing=()=>mode==='game'||mode==='boss';
const editable=t=>!!(t&&t.closest&&t.closest('input,textarea,select'));
document.addEventListener('touchmove',e=>{if(editable(e.target))return;
  if(playing()){e.preventDefault();return;}
  if(document.body.classList.contains('fs')&&!(e.target.closest&&e.target.closest('.under,#devPanel')))e.preventDefault();},{passive:false});
document.addEventListener('selectstart',e=>{if(!editable(e.target))e.preventDefault();});
document.addEventListener('contextmenu',e=>{if(!editable(e.target))e.preventDefault();});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>{if(!editable(e.target))e.preventDefault();},{passive:false});
const KEYMAP={ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',w:'w',a:'a',s:'s',d:'d',W:'w',A:'a',S:'s',D:'d'};
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  if(e.target&&e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
  if((mode==='game'||mode==='boss')&&(e.key==='p'||e.key==='P'||e.key==='Escape')){e.preventDefault();paused?resumePause():pauseGame();return;}
  if(paused){if(e.key==='Enter'||e.key===' '){e.preventDefault();resumePause();}return;}
  if(mode==='boss'){if(KEYMAP[e.key]){keys[KEYMAP[e.key]]=true;e.preventDefault();if(BS.intro>0)BS.intro=0;}
    if(e.key===' '||e.key==='b'||e.key==='B'){e.preventDefault();bossBass();}
    if(e.key==='l'||e.key==='L'||e.key==='Enter'){e.preventDefault();if(BS.intro>0)BS.intro=0;else bossAutoLaser();}
    if(e.key==='h'||e.key==='H'){e.preventDefault();eatBacon();}
    if(e.key==='m'||e.key==='M')muteBtn.click();return;}
  if(mode==='slots'){if(e.key===' '||e.key==='Enter'){if(e.target&&e.target.tagName==='BUTTON')return;e.preventDefault();slotSpin();}else if(e.key==='Escape')leaveSlots();return;}
  if(mode==='preview'||mode==='crew'||mode==='results'){const k=e.key;
    if(k==='m'||k==='M'){muteBtn.click();return;}if(e.repeat)return;
    if(mode==='preview'&&(k===' '||k==='Enter')){if(e.target&&e.target.tagName==='BUTTON')return;e.preventDefault();quickStart(PV.ri);}
    else if(mode==='crew'){if(['ArrowUp','ArrowDown','w','W','s','S'].includes(k)){e.preventDefault();CS.focus=1-CS.focus;AudioK.sfx.blip();}
      else if(['ArrowLeft','a','A'].includes(k)){e.preventDefault();crewCycle(CS.focus?'j':'d',-1);}
      else if(['ArrowRight','d','D'].includes(k)){e.preventDefault();crewCycle(CS.focus?'j':'d',1);}
      else if(k===' '||k==='Enter'){e.preventDefault();crewStart();}}
    else if(mode==='results'&&(k===' '||k==='Enter')){e.preventDefault();const b=dtext.querySelector('.start');if(b)b.click();}
    return;}
  if(mode==='map'){
    const k=e.key;
    if(e.key==='m'||e.key==='M'){muteBtn.click();return;}
    if(e.repeat)return;
    if(['ArrowLeft','ArrowUp','a','A','w','W'].includes(k)){e.preventDefault();mapMove(-1);}
    else if(['ArrowRight','ArrowDown','d','D','s','S'].includes(k)){e.preventDefault();mapMove(1);}
    else if(k===' '||k==='Enter'){e.preventDefault();mapPlay();}
    return;
  }
  if(mode==='shop'){if(e.key==='Escape'){e.preventDefault();leaveShop();}return;}
  if(mode==='game'&&(e.key==='e'||e.key==='E')&&G.atShop){e.preventDefault();openShop();return;}
  if(mode==='game'&&(e.key==='l'||e.key==='L')){e.preventDefault();fireLaser();return;}
  if(mode==='game'&&(e.key==='b'||e.key==='B'||e.key==='h'||e.key==='H')){e.preventDefault();eatBacon();return;}
  if(KEYMAP[e.key]){keys[KEYMAP[e.key]]=true;if(mode==='game'){e.preventDefault();if(G.intro>0)G.intro=0;}}
  if(e.key===' '||e.key==='Enter'){e.preventDefault();if(mode==='game'&&G.intro>0)G.intro=0;else if(mode==='story'&&pageObj().final&&typedLen>=pageObj().text.length)openMap();else advance();}
  if(e.key==='m'||e.key==='M')muteBtn.click();
});
window.addEventListener('keyup',e=>{if(KEYMAP[e.key])keys[KEYMAP[e.key]]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
dialog.addEventListener('click',advance);
function stickDown(el,fixed){return e=>{
  if(paused){if(el===cv){resumePause();e.preventDefault();}return;}
  if(mode==='boss'&&el===cv){bossLaserAt(e);e.preventDefault();return;}
  if(mode==='boss'&&el===pad){joy.active=true;joy.id=e.pointerId;joy.fixed=true;try{el.setPointerCapture(e.pointerId);}catch(_){}const r=el.getBoundingClientRect();joy.ox=r.left+r.width/2;joy.oy=r.top+r.height/2;stickMove(e);e.preventDefault();return;}
  if(mode!=='game'){if(el===cv){if(mode==='map')mapTap(e);else if(mode==='preview')quickStart(PV.ri);else if(mode==='crew'){const r=cv.getBoundingClientRect();const left=(e.clientX-r.left)<r.width/2;CS.focus=left?0:1;crewCycle(left?'d':'j',1);}else if(mode==='story'||mode==='splash')advance();}return;}
  if(G.intro>0){G.intro=0;}
  joy.active=true;joy.id=e.pointerId;joy.fixed=fixed;try{el.setPointerCapture(e.pointerId);}catch(_){}
  const r=el.getBoundingClientRect();if(fixed){joy.ox=r.left+r.width/2;joy.oy=r.top+r.height/2;}else{joy.ox=e.clientX;joy.oy=e.clientY;}
  stickMove(e);e.preventDefault();};}
function stickMove(e){if(!joy.active||e.pointerId!==joy.id)return;let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const m=Math.hypot(dx,dy),RR=40;if(m>RR){dx=dx/m*RR;dy=dy/m*RR;}joy.x=dx/RR;joy.y=dy/RR;if(joy.fixed)knob.style.transform=`translate(${dx}px,${dy}px)`;}
function stickUp(e){if(e.pointerId!==joy.id)return;joy.active=false;joy.x=joy.y=0;knob.style.transform='';}
[[cv,false],[pad,true]].forEach(([el,fixed])=>{el.addEventListener('pointerdown',stickDown(el,fixed));el.addEventListener('pointermove',stickMove);el.addEventListener('pointerup',stickUp);el.addEventListener('pointercancel',stickUp);});
// a thumb that lands beside the pad (but not on a button) still steers, from wherever it lands
controls.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.target.closest('.pad'))return;if(!playing()||paused)return;
  if(mode==='game'&&G.intro>0)G.intro=0;if(mode==='boss'&&BS.intro>0){BS.intro=0;}
  joy.active=true;joy.id=e.pointerId;joy.fixed=false;try{controls.setPointerCapture(e.pointerId);}catch(_){}joy.ox=e.clientX;joy.oy=e.clientY;stickMove(e);e.preventDefault();});
controls.addEventListener('pointermove',stickMove);controls.addEventListener('pointerup',stickUp);controls.addEventListener('pointercancel',stickUp);
skipBtn.addEventListener('click',()=>{openMap();});
mapBtn.addEventListener('click',()=>{openMap(G.ri);});
storyBtn.addEventListener('click',()=>{startStory();});
shopBtn.addEventListener('click',e=>{e.stopPropagation();openShop();});
bassBtn.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();bossBass();});
laserBtn.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();if(mode==='game')fireLaser();
  else if(mode==='boss'){if(BS.intro>0){BS.intro=0;return;}bossAutoLaser();clearInterval(laserBtn._hold);laserBtn._hold=setInterval(()=>{if(mode!=='boss')return clearInterval(laserBtn._hold);bossAutoLaser();},300);}});
['pointerup','pointercancel','pointerleave'].forEach(ev=>laserBtn.addEventListener(ev,()=>clearInterval(laserBtn._hold)));
function bossAutoLaser(){if(paused||BS.over)return;const b=BS.b;bossLaser(b.x,b.y-24);}
baconBtn.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();eatBacon();});
pauseBtn.addEventListener('click',e=>{e.stopPropagation();paused?resumePause():pauseGame();});
muteBtn.addEventListener('click',()=>{AudioK.init();const m=AudioK.toggle();muteBtn.textContent=m?'SOUND: OFF':'SOUND: ON';});

// update check: the website build stamps GAME_VERSION and ships version.json beside the game.
// If a newer build is live while someone has the game open, offer a one-tap reload (saves live in this browser, so nothing is lost).
const GAME_VERSION='20261013153705';
function checkUpdate(){if(GAME_VERSION==='dev'||!window.fetch||location.protocol.indexOf('http')!==0)return;
  fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{if(v&&v.version&&v.version!==GAME_VERSION)$('updBar').hidden=false;}).catch(()=>{});}
$('updBar').addEventListener('click',e=>{e.stopPropagation();if(mode==='game'&&G&&!G.won)saveP();location.reload();});
checkUpdate();setInterval(()=>{if(mode!=='game'&&mode!=='boss')checkUpdate();},120000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate();});

// full screen: real fullscreen where the browser allows it, otherwise a page-filling mode (iPhone Safari)
const fsBtn=$('fsBtn');
function fsOn(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function pseudoFS(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'EXIT FULL':'FULL SCREEN';fitScreen();setTimeout(fitScreen,80);setTimeout(fitScreen,400);if(on)window.scrollTo(0,0);}
const standalone=window.matchMedia&&window.matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches||navigator.standalone;
const iOS=/iP(hone|od|ad)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function fsTip(){if(standalone||!iOS||document.getElementById('fsTip'))return;
  const d=document.createElement('div');d.id='fsTip';d.innerHTML='<b style="color:#ffd23f">WHOLE SCREEN ON IPHONE</b><br>Safari never lets a web page hide its own address bar. For the entire screen: tap <b>Share</b>, then <b>Add to Home Screen</b>, and open Jak from your home screen. Sign in with your account there and your tour comes with you.<br><span style="color:#5fe8ff">TAP TO CLOSE</span>';
  d.addEventListener('click',()=>d.remove());document.body.appendChild(d);setTimeout(()=>d.remove(),16000);}
function toggleFS(){if(fsOn()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}
  if(document.body.classList.contains('fs')){pseudoFS(false);return;}
  const el=document.documentElement,req=el.requestFullscreen||el.webkitRequestFullscreen;
  const fallback=()=>{ // inside the website's frame on iPhone: open the game on its own page first
    try{if(window.top!==window.self&&window.top.location.origin===location.origin){window.top.location.href=location.pathname+'?fs=1';return;}}catch(e){}
    pseudoFS(true);fsTip();};
  if(req){try{const p=req.call(el,{navigationUI:'hide'});if(p&&p.then)p.then(()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('any').catch(()=>{});}catch(e){}}).catch(fallback);}catch(e){fallback();}}else fallback();}
if(standalone||/[?&]fs=1/.test(location.search)){pseudoFS(true);if(/[?&]fs=1/.test(location.search))setTimeout(fsTip,600);}
function fsChanged(){pseudoFS(fsOn());}
document.addEventListener('fullscreenchange',fsChanged);document.addEventListener('webkitfullscreenchange',fsChanged);
fsBtn.addEventListener('click',e=>{e.stopPropagation();toggleFS();});

// ---------- developer cheats (testing only) ----------
const devBtn=$('devBtn'),devPanel=$('devPanel');
function devRefresh(){devBtn.hidden=!DEV.on;if(!DEV.on)devPanel.hidden=true;}
function devSet(on){DEV.on=on;try{on?localStorage.setItem('jak-dev','1'):localStorage.removeItem('jak-dev');}catch(e){}devRefresh();if(mode==='map')mapInfo();}
function devWin(){devPanel.hidden=true;if(paused)resumePause();
  if(mode==='game'){if(G.won||G.over)return;G.intro=0;G.gold={x:G.jak.x,y:G.jak.y};winResort();}
  else if(mode==='boss'){if(BS.over)return;BS.intro=0;BS.cfg.next=null;bossDamage(99999,'laser');}}
function devSkip(){devPanel.hidden=true;if(paused)endPause();const ri=mode==='boss'?BS.ri:(mode==='game'||mode==='results'||mode==='shop')?G.ri:(M.sel>=0?M.sel:0);
  P.cleared[RESORTS[ri].id]=true;saveP();openMap(Math.min(RESORTS.length-1,ri+1));}
function devPanelOpen(){devPanel.innerHTML='';devPanel.appendChild(mk('div','','DEV CHEATS: every stop on the map is playable while this is on.'));
  const a=mk('div','row'),b=mk('div','row');
  if(playing())a.appendChild(btn('WIN THIS LEVEL','chip',devWin));
  a.appendChild(btn('SKIP TO NEXT STOP','chip',devSkip));
  a.appendChild(btn('UNLOCK WHOLE TOUR','chip',()=>{RESORTS.forEach(x=>P.cleared[x.id]=true);saveP();devPanel.hidden=true;openMap();}));
  b.append(btn('+500 CARROTS','chip',()=>{P.bank+=500;saveP();refreshShopUI();devPanelOpen();}),
    btn('MAX UPGRADES','chip',()=>{UPGRADES.forEach(u=>P.up[u.id]=u.costs.length);P.bacon=3;saveP();if(mode==='game')resumeGame();refreshShopUI();devPanelOpen();}),
    btn('DEV OFF','chip',()=>devSet(false)),btn('CLOSE','chip',()=>{devPanel.hidden=true;}));
  devPanel.append(a,b,mk('div','',`CARROTS ${P.bank} / MODE ${mode.toUpperCase()}`));devPanel.hidden=false;}
devBtn.addEventListener('click',e=>{e.stopPropagation();devPanel.hidden?devPanelOpen():(devPanel.hidden=true);});
{let taps=0,tt=0;document.querySelector('.brand').addEventListener('click',()=>{const n=performance.now();taps=n-tt<700?taps+1:1;tt=n;if(taps>=5){taps=0;devSet(!DEV.on);if(DEV.on)devPanelOpen();}});}
devRefresh();
if(DEV.on)window.__jak={get mode(){return mode;},P,G,BS,M,RESORTS,WORLDS,BOSSES,UPGRADES,openMap,openBoss,startGame,openPreview,openCrew,openShop,pickPlayer,addPlayer,fitScreen,devWin,unlocked,keys,joy,
  set W(v){W=v;},get W(){return W;},get H(){return H;}};

// splash state
whoEl.textContent='';dtext.textContent='Sound on! Tap here or the screen to begin, then pick your player.';countEl.textContent='';
const go=()=>requestAnimationFrame(frame);
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('8px "Press Start 2P"'),document.fonts.load('20px VT323')]).then(go,go);}else go();
})();
