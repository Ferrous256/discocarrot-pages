<script>
// Jak soundtrack engine: 16-bit house and techno, all synthesized. makeJakMusic(audioContext, outputNode)
function makeJakMusic(ac,out){
  'use strict';
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  // signal chain: instruments -> bus -> warm lowpass -> glue compressor -> level -> out
  const bus=ac.createGain();
  const warm=ac.createBiquadFilter();warm.type='lowpass';warm.frequency.value=8500;warm.Q.value=0.4;
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=10;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.2;
  const level=ac.createGain();level.gain.value=1.4;
  bus.connect(warm);warm.connect(comp);comp.connect(level);level.connect(out);
  const duck=ac.createGain();duck.connect(bus); // melodic parts pump against the kick
  const echo=ac.createDelay(2),fb=ac.createGain(),ehp=ac.createBiquadFilter(),wet=ac.createGain();
  ehp.type='highpass';ehp.frequency.value=700;fb.gain.value=0.33;wet.gain.value=0.4;
  echo.connect(ehp);ehp.connect(fb);fb.connect(echo);ehp.connect(wet);wet.connect(bus);
  const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const pulse=w=>{const n=48,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*w);return ac.createPeriodicWave(re,im);};
  const P25=pulse(0.25),P12=pulse(0.125);

const screenEl=$('screen'),underEl=document.querySelector('.under'),topbarEl=document.querySelector('.topbar');

const TALL={map:640,preview:560,heist:640};
function fitScreen(){
  document.body.dataset.mode=mode;
  let w=256,h=224;
  const fs=document.body.classList.contains('fs');
  HUDB=0;CTLB=0;
  if(fs){const land=window.innerWidth>window.innerHeight,vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;document.body.classList.toggle('land',land);
    const act=mode==='game'||mode==='boss',over=act&&!land;document.body.classList.toggle('over',over);
    // keep the floating controls above the browser's own toolbar
    // and centre the stick row about two thirds of the way down the visible screen
    if(over){const tb=window.visualViewport?Math.max(0,Math.round(window.innerHeight-vh-(window.visualViewport.offsetTop||0))):0;
      underEl.style.bottom=Math.round(tb+Math.max(10,vh*0.33-(controls.hidden?0:controls.offsetHeight)/2))+'px';}
    else{underEl.style.bottom='';PADDROP=0;document.body.style.setProperty('--padDrop','0px');}
    const top=topbarEl.offsetHeight+6,side=land?(act?2*Math.round(Math.min(178,Math.max(134,window.innerWidth*0.17))):Math.min(340,Math.max(220,window.innerWidth*0.3))):0;
    const below=land||over?0:Math.min(vh*0.42,Math.max(120,TALL[mode]&&!dialog.hidden?dialog.scrollHeight+4:underEl.scrollHeight))+6;
    const availW=window.innerWidth-side-(over?0:12),availH=vh-top-below-(over?0:8);
    if(mode==='game'||(mode==='boss'&&!land)){const a=availW/availH;if(a<1){w=256;h=Math.max(224,Math.min(640,Math.round(256/a)));}else if(mode==='game'){h=224;w=Math.max(256,Math.min(560,Math.round(224*a)));}}
    else if(TALL[mode]&&!land){const a=availW/availH;if(a<1)h=Math.max(224,Math.min(TALL[mode],Math.round(256/a)));}
    const sc=Math.min(availW/w,availH/h),px=Math.floor(w*sc)+'px';
    screenEl.style.width=px;screenEl.style.aspectRatio=`${w}/${h}`;underEl.style.width='';
    // the stick floats over the slope now, so only keep the bottom HUD clear of the phone's home bar
    if(over){const sr=screenEl.getBoundingClientRect(),sb=parseFloat(getComputedStyle(document.documentElement).paddingBottom)||0;HUDB=Math.max(0,Math.ceil((Math.min(sr.bottom,vh)-(vh-sb))/sc));
      // centre stick only: drop it low on the screen, just above the bottom HUD bar, so it stays out of Jak's way (left and right positions are untouched)
      {const ps=document.body.style;let drop=0;if(!controls.hidden){const pr=padEl.getBoundingClientRect(),base=pr.bottom-(STICK==='center'?PADDROP:0),target=Math.min(sr.top+(H-14-HUDB)*sc,vh)-8;drop=Math.max(0,Math.round(target-base));}PADDROP=drop;ps.setProperty('--padDrop',drop+'px');}
      if(!controls.hidden){const cr=controls.getBoundingClientRect();CTLB=Math.max(0,Math.ceil((Math.min(sr.bottom,vh)-cr.top+8)/sc));}}
    if(w!==W||h!==H){W=w;H=h;cv.width=w;cv.height=h;ctx.imageSmoothingEnabled=false;}return;}
  document.body.classList.remove('land');underEl.style.bottom='';
  if(TALL[mode]&&window.innerHeight>window.innerWidth*1.15){
    const cs=getComputedStyle(document.documentElement),pd=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
    const availW=Math.min(window.innerWidth-32,828),availH=Math.max(200,window.innerHeight-pd-topbarEl.offsetHeight-underEl.offsetHeight-44);
    const a=availW/availH;if(a<1)h=Math.max(224,Math.min(TALL[mode],Math.round(256/a)));
    const sc=Math.min(availW/w,availH/h),px=Math.floor(w*sc)+'px';
    screenEl.style.width=px;screenEl.style.aspectRatio=`${w}/${h}`;underEl.style.width=px;
  }
  else if(mode==='game'){
    const cs=getComputedStyle(document.documentElement),pad=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
    const availW=Math.min(window.innerWidth-32,1240),availH=Math.max(220,window.innerHeight-pad-topbarEl.offsetHeight-(controls.hidden?0:controls.offsetHeight)-44);
    const a=availW/availH;
    if(a<1){w=256;h=Math.max(224,Math.min(520,Math.round(256/a)));}else{h=224;w=Math.max(256,Math.min(448,Math.round(224*a)));}

  }else{screenEl.style.width='';screenEl.style.aspectRatio='';underEl.style.width='';}
  if(w!==W||h!==H){W=w;H=h;cv.width=w;cv.height=h;ctx.imageSmoothingEnabled=false;}
}

let mode='splash',sceneIdx=0,pageIdx=0,sceneStart=0,pageStart=0,flags={},typedLen=0,STORY=SCENES;
function pageObj(){const pg=STORY[sceneIdx].pages[pageIdx];return typeof pg==='string'?{who:'',text:pg}:pg;}
function setPage(){
  const pg=pageObj();whoEl.textContent=pg.who||'';dtext.textContent='';typedLen=0;pageStart=performance.now();flags={};
  countEl.textContent=`${sceneIdx+1} / ${STORY.length}`;
  nextEl.hidden=false;
}
function enterScene(i){
  sceneIdx=i;pageIdx=0;sceneStart=performance.now();
  const s=STORY[i];if(s.song!==undefined)AudioK.setSong(s.song);
  setPage();
}
function startStory(){
  AudioK.init();STORY=SCENES;mode='story';overlay.hidden=true;dialog.hidden=false;controls.hidden=true;skipBtn.hidden=false;storyBtn.hidden=true;mapBtn.hidden=true;
  enterScene(0);fitScreen();
}
function advance(){
  if(mode==='splash'){if(PL.last&&acctOf(PL.last)&&PL.list.some(p=>p.id===PL.last)){AudioK.init();AudioK.setSong('story');pickPlayer(PL.last);}else openPlayers();return;}
  if(mode!=='story')return;
  const pg=pageObj();
  if(typedLen<pg.text.length){typedLen=pg.text.length;dtext.textContent=pg.text;return;}
  if(pg.final)return;
  const s=STORY[sceneIdx];
  if(pageIdx<s.pages.length-1){pageIdx++;setPage();}
  else if(sceneIdx<STORY.length-1)enterScene(sceneIdx+1);
}
function updateTypewriter(now){
  const pg=pageObj();const want=Math.min(pg.text.length,Math.floor((now-pageStart)/28));
  if(want>typedLen){
    if(Math.floor(want/3)>Math.floor(typedLen/3)&&pg.text[want-1]!==' ')AudioK.sfx.blip();
    typedLen=want;dtext.textContent=pg.text.slice(0,typedLen);
  }
  if(pg.final&&typedLen>=pg.text.length&&!dtext.querySelector('.start')){
    const b=document.createElement('button');b.className='start';b.type='button';b.textContent=pg.btn||'PRESS START';
    b.addEventListener('click',e=>{e.stopPropagation();storyFinish();});
    dtext.appendChild(document.createElement('br'));dtext.appendChild(b);nextEl.hidden=true;b.focus({preventScroll:true});
  }
}

}

  else{AudioK.sfx.over();PS.msg='That code did not work.';}playersUI();}
function playerGold(id){const sv=lsGet(SAVE_PREFIX+id)||{};return RESORTS.filter(r=>!r.boss&&sv.cleared&&sv.cleared[r.id]).length;}
function openPlayers(){AudioK.init();AudioK.setSong('story');mode='players';overlay.hidden=true;dialog.hidden=false;controls.hidden=true;skipBtn.hidden=true;storyBtn.hidden=true;mapBtn.hidden=true;
  PS.mode=PL.list.length?'list':'new';fitScreen();playersUI();}
function pickPlayer(id,fresh){PL.cur=id;PL.last=id;savePlayers();applySave(lsGet(SAVE_PREFIX+id));AudioK.sfx.recruit();
  const a=acctOf(id),go=()=>{if(PL.cur!==id)return;if(P.seen){if(P.seenHeist)openMap();else openHeist();}else startStory();};
  if(!API||!a||fresh)return go();
  whoEl.textContent='LOADING YOUR TOUR';dtext.innerHTML='';dtext.appendChild(mk('div','',`Getting ${curName()}'s tour from your account...`));
  api('/save',{token:a.token}).then(res=>{if(res&&res.save&&(+res.t||0)>(P.t||0)){applySave(res.save);P.t=+res.t;lsSet(SAVE_PREFIX+id,P);}else if((P.t||0)>((res&&+res.t)||0))cloudPush(true);})
    .catch(e=>{if(e.status===401){a.token=null;savePlayers();CLOUD.note='Signed out. Sign in again to keep saving online.';}}).finally(go);}
function cleanName(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9 .!\-]/g,'').replace(/\s+/g,' ').trim().slice(0,10);}
function addPlayer(raw){let name=cleanName(raw)||`PLAYER ${PL.list.length+1}`;
  const taken=n=>PL.list.some(p=>p.name===n);if(taken(name)){let k=2;while(taken((name.slice(0,8)+' '+k).trim()))k++;name=(name.slice(0,8)+' '+k).trim();}
  const id='p'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);PL.list.push({id,name});savePlayers();pickPlayer(id);}

// ---------- pixel polygons (crisp scanline fill + Bresenham lines) ----------
function fillPoly(pts,col){let minY=Infinity,maxY=-Infinity;for(const p of pts){if(p[1]<minY)minY=p[1];if(p[1]>maxY)maxY=p[1];}
  ctx.fillStyle=col;
  for(let y=Math.floor(minY);y<=Math.ceil(maxY);y++){const yc=y+0.5,xs=[];
    for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];if((a[1]<=yc&&b[1]>yc)||(b[1]<=yc&&a[1]>yc))xs.push(a[0]+(yc-a[1])/(b[1]-a[1])*(b[0]-a[0]));}
    xs.sort((p,q)=>p-q);for(let k=0;k+1<xs.length;k+=2){const x0=Math.round(xs[k]),x1=Math.round(xs[k+1]);if(x1>x0)ctx.fillRect(x0,y,x1-x0,1);}}}
function pline(x0,y0,x1,y1,col){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);ctx.fillStyle=col;
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(let n=0;n<600;n++){ctx.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}

function isSkiWorld(D){return !!D&&!D.city&&!D.ocean&&!D.theme&&!D.space&&!D.moon&&!D.float&&!!(D.lifts&&D.lifts.length);}
function rideLift(L){return L&&!L.tunnel&&L.a.y>L.b.y;} // a = bottom station, b = top
function skiPickLift(c){let best=-1,bs=1e9;G.lifts.forEach((L,k)=>{if(!rideLift(L))return;const tx=L.a.x,ty=L.a.y;
    const sc=(ty>=c.y-20?Math.abs(tx-c.x)+(ty-c.y)*0.25:1e5+Math.abs(ty-c.y))+rnd(0,70);if(sc<bs){bs=sc;best=k;}});return best;}

// put a skier on a random chair of a random lift, away from Jak (keeps the lifts busy). Returns false if no chair is free.
function skiSeat(c,now){const ks=[];G.lifts.forEach((L,k)=>{if(rideLift(L)&&!L.tbar||rideLift(L)&&Math.random()<0.5)ks.push(k);});if(!ks.length)return false;
  for(let n=0;n<8;n++){const k=ks[Math.floor(Math.random()*ks.length)],L=G.lifts[k],ph=(now*LIFT_V)%LIFT_GAP,nch=Math.floor((L.len-ph)/LIFT_GAP);if(nch<1)continue;
    const s=ph+Math.floor(Math.random()*nch)*LIFT_GAP,t0=now-s/LIFT_V,f=s/L.len,x=L.a.x+(L.b.x-L.a.x)*f,y=L.a.y+(L.b.y-L.a.y)*f;

// steer a skier toward (tx,ty): downhill only unless up is allowed (the flat base area by a lift), around the trees
function skiSteer(c,tx,ty,spd,up,dt,now){let ang=Math.atan2(ty-c.y,tx-c.x);
  if(!up){if(ang<=-Math.PI/2||ang>Math.PI-0.2)ang=Math.PI-0.2;else if(ang<0.2)ang=0.2;ang+=Math.sin(now/650+c.ph)*0.45;}

  for(const o of [0,0.35,0.7,1.05,1.4,1.75]){for(const sg of o?[side,-side]:[1]){const a=ang+o*sg,vx=Math.cos(a),vy=Math.sin(a);if(!up&&vy<0.1)continue;
      if(walkable(c.x+vx*3,c.y+vy*3,3,2)&&walkable(c.x+vx*8,c.y+vy*8,3,2)){if(moveAgent(c,vx*spd,vy*spd,dt)){c.vx=vx*spd;c.vy=vy*spd;c.stk=0;if(o>1)c.side=sg;return true;}}}}

function skiStep(c,j,d,lureR,dt,now){

  c.lured=d<lureR&&c.noJoin<=0&&!j.ride;
  if(c.st==='wait'){const L=G.lifts[c.L];
    if(!L||c.lured&&j.y>=c.y-24){c.st='ski';c.L=-1;}
    else{const q=G.crowd.filter(o=>o.st==='wait'&&o.L===c.L).sort((a,b)=>a.qT-b.qT),i=q.indexOf(c);
      const sx=L.a.x+(i===0?3:(i%2?-6:12)),sy=L.a.y+(i===0?6:8+Math.ceil(i/2)*8),dd=Math.hypot(sx-c.x,sy-c.y);
      if(dd>1){const v=Math.min(16,dd/dt);c.x+=(sx-c.x)/dd*v*dt;c.y+=(sy-c.y)/dd*v*dt;}
      c.vx=0;c.vy=0;

  if(c.stk>2.5&&offscreen()){if(!skiSeat(c,now)){const R0=G.lifts[c.gl];if(rideLift(R0))skiUnload(c,R0);else Object.assign(c,freeSpot(160));}c.stk=0;}
  return false;}
function rnd(a,b){return a+Math.random()*(b-a);}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function freeSpot(minFromJak=70){
  for(let k=0;k<80;k++){const c=G.open[Math.floor(Math.random()*G.open.length)];
    if(G.jak&&Math.hypot(c.x-G.jak.x,c.y-G.jak.y)<minFromJak)continue;
    if(G.lifts.some(l=>Math.hypot(c.x-l.a.x,c.y-l.a.y)<24))continue;
    if(!walkable(c.x,c.y))continue;
    return {x:c.x,y:c.y};}
  const c=G.open[Math.floor(Math.random()*G.open.length)];return {x:c.x,y:c.y};
}
function inDark(x,y){if(!G.darkMap||!G.D||!G.D.blackout)return false;const c=Math.floor(x/CELL),r=Math.floor(y/CELL);if(c<0||r<0||c>=G.cols||r>=G.rows)return false;return G.darkMap[r*G.cols+c]>0.6;}

  setBanner(['...RUMBLE...','THE MOUNTAIN IS MOVING'],'#c8d4f0',1.8);AudioK.sfx.thunder();}
function updAvalanche(dt){const a=G.av,j=G.jak;a.t+=dt;
  if(a.t<a.warn){G.shake=Math.max(G.shake,0.06+0.3*(a.t/a.warn));
    if(a.said===0&&a.t>1.4){a.said=1;AudioK.sfx.growl();}
    if(a.said===1&&a.t>2.0){a.said=2;AudioK.sfx.thunder();setBanner(['AVALANCHE!',a.far?'HOLD ON TO YOUR ANTLERS!':'HERE IT COMES!'],'#ffffff',2.2);}
    if(Math.random()<dt*14)a.chunks.push({x:rnd(0,W),y:-6,vy:rnd(60,140),s:rnd(2,5)});}
  else if(!a.hit){G.shake=Math.max(G.shake,0.4);const p=(a.t-a.warn)/a.wall;a.wy=-80+p*p*(H+160);if(Math.random()<dt*10)AudioK.sfx.splat();
    if(a.wy>=H/2-12){a.hit=true;a.hitT=a.t;
      if(a.far){a.ride=true;a.rt=0;a.from={x:j.x,y:j.y};AudioK.sfx.thunder();AudioK.sfx.hurt();}
      else{floatText(j.x,j.y-40,'WHEW! IT MISSED YOU','#ffffff');}}}
  else if(a.ride){a.rt+=dt;const D=G.D,f=Math.min(1,a.rt/3.2),e=f<0.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
    j.x=a.from.x+(D.start[0]-a.from.x)*e;j.y=a.from.y+(D.start[1]-a.from.y)*e;j.inv=1.5;G.shake=0.35;
    if(Math.random()<dt*30)burst(j.x+rnd(-20,20),j.y-rnd(0,20),3,['#fff','#e8f2ff','#cfe0ff']);
    if(f>=1){a.ride=false;a.landT=a.t;j.ride=null;G.trail.length=0;G.followers.forEach(fo=>{fo.x=j.x+rnd(-20,20);fo.y=j.y+rnd(-10,10);});
      burst(j.x,j.y-10,30,['#fff','#e8f2ff','#cfe0ff']);floatText(j.x,j.y-40,'SWEPT TO THE BASE!','#ffffff');setBanner(['SWEPT TO THE BASE!','SHAKE IT OFF AND CLIMB BACK UP'],'#ffffff',2.4);}}
  for(let i=a.chunks.length-1;i>=0;i--){const c=a.chunks[i];c.y+=c.vy*dt;if(c.y>H)a.chunks.splice(i,1);}

function hitJak(g){

  if(G.flameT>0){j.inv=0.5;g.cool=3;if(G.grumps.includes(g)){g.stun=3;g.yell=1.6;g.say='hot';G.score+=100;floatText(g.x,g.y-24,'TOO HOT! +100','#ffb040');AudioK.sfx.splat();}return;}G.hearts--;G.hits++;j.inv=1.8;G.shake=0.35;AudioK.sfx.hurt();g.yell=1.6;g.say='loud';g.cool=3;
  for(let k=0;k<G.mods.crewLoss&&G.followers.length;k++){const f=G.followers.pop();f.noJoin=2;const a=Math.random()*Math.PI*2;f.vx=Math.cos(a)*60;f.vy=Math.sin(a)*60;f.t=0.6;G.crowd.push(f);}

    showOverlay('THE GRUMPS WON...<br>THIS TIME.',`Score ${G.score}. You banked ${G.runCarrots} carrots for the Workshop.`,[['PLAY AGAIN',()=>startGame(G.ri)],['TOUR MAP',()=>openMap(G.ri)]]);}
}
function winResort(){
  const r=G.R;G.score+=2500;burst(G.gold.x,G.gold.y-6,40,[PAL.Y,'#fff','#ffc21a']);G.gold=null;G.goldCaught=true;G.won=true;AudioK.sfx.gold();
  P.cleared[r.id]=true;P.bank+=10;G.newRec=null;if(REC_BY_ID[r.id]&&!P.records[r.id]){P.records[r.id]=Date.now();G.newRec=r.id;}recordBest();openResults();
}
function showOverlay(title,text,btns){
  ovTitle.innerHTML=title;ovText.textContent=text;ovBtns.innerHTML='';
  btns.forEach(([label,fn],k)=>{const b=document.createElement('button');b.type='button';b.className=k===0?'start':'chip';b.textContent=label;b.addEventListener('click',e=>{e.stopPropagation();fn();});ovBtns.appendChild(b);});
  overlay.hidden=false;const first=ovBtns.querySelector('button');if(first)first.focus({preventScroll:true});
}
function updateFuel(dt,j){
  if(!G.dark){
    G.fuel-=dt*(G.party>0?2.4:1.5)*(1-0.18*(P.up.tank||0))*G.mods.fuel*G.cfg.burn;
    if(G.fuel<=0){G.fuel=0;G.dark=true;AudioK.setSong(null);AudioK.sfx.sputter();G.shake=0.3;if(G.party>0){G.party=0;G.joy=0;}G.grumps.forEach(g=>g.yell=0);
      setBanner(['GENERATOR DOWN!','GRAB A GAS CAN'],'#ff3b3b',2.4);G.dropT=1.2;}
    else if(G.fuel<25){G.lowBeep-=dt;if(G.lowBeep<=0){G.lowBeep=2;AudioK.sfx.low();}if(!G.lowWarned){G.lowWarned=true;setBanner(['LOW FUEL!'],'#ff3b3b',1.4);}}
  }else{
    G.dropT-=dt;
    if(G.dropT<=0){G.dropT=1.3;if(G.followers.length){const f=G.followers.pop();f.noJoin=3;const a=Math.random()*Math.PI*2;f.vx=Math.cos(a)*40;f.vy=Math.sin(a)*40;f.t=0.8;G.crowd.push(f);floatText(f.x,f.y-22,'BORED!','#c9b8ff');}}
  }
  for(let i=0;i<G.cans.length;i++){const c=G.cans[i];if(dist(c,j)<16){
    G.fuel=Math.min(100,G.fuel+60);G.score+=25;G.cansGot++;AudioK.sfx.refuel();burst(c.x,c.y-6,10,['#e0262f','#fff',PAL.Y]);floatText(c.x,c.y-20,'FUEL!','#ff6b6b');
    G.cans[i]=ringSpot(G.cfg.near+20,G.cfg.far+40);if(G.fuel>=25)G.lowWarned=false;
    if(G.dark){G.dark=false;AudioK.setSong(G.song||G.R.song);setBanner(['POWER BACK ON!'],PAL.N,1.6);}}}
}
function moveAgent(a,vx,vy,dt){const nx=a.x+vx*dt,ny=a.y+vy*dt;if(walkable(nx,ny,3,2)){a.x=nx;a.y=ny;return true;}
  if(walkable(nx,a.y,3,2)){a.x=nx;return true;}if(walkable(a.x,ny,3,2)){a.y=ny;return true;}return false;}

// ---------- loop ----------
let lastT=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  try{
  if(mode==='splash')drawSplash(now);
  else if(mode==='players')drawPlayers(now);
  else if(mode==='story'){const s=STORY[sceneIdx];const t=now-sceneStart,pt=now-pageStart;if(s.tick)s.tick(t,pageIdx,pt,flags);s.draw(t,pageIdx,pt);updateTypewriter(now);}
  else if(mode==='map'){updateMap(now);drawMap(now);}
  else if(mode==='heist')drawHeist(now);
  else if(mode==='crate')drawCrate(now);
  else if(mode==='games')drawGames(now);
  else if(mode==='minigame'){}
  else if(mode==='preview')drawPreview(now);
  else if(mode==='launch')drawLaunch(now);
  else if(mode==='crew')drawCrew(now);
  else if(mode==='results')drawResults(now);
  else if(mode==='shop'||mode==='hqshop')drawShop(now);
  else if(mode==='slots'){updateSlots(now);drawSlots(now);}
  else if(mode==='boss'||mode==='bossEnd'){if(mode==='boss'&&!paused)updateBoss(dt,now);drawBoss(now);if(paused)drawPaused(now);}
  else if(mode==='game'){if(!paused)updateGame(dt,now);drawGame(now);if(paused)drawPaused(now);}
  {const pb=(mode==='game'||mode==='boss');if(pauseBtn.hidden===pb)pauseBtn.hidden=!pb;const cb=mode==='map';if(crateBtn.hidden===cb)crateBtn.hidden=!cb;const gb=DEV.on&&!pb&&mode!=='games'&&mode!=='minigame';if(gamesBtn.hidden===gb)gamesBtn.hidden=!gb;}
  }catch(err){if(!frame.warned){frame.warned=1;console.error(err);}}
  requestAnimationFrame(frame);
}
