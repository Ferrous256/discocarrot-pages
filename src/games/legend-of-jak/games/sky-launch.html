<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sky Launch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0d0718">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Same arcade cabinet look as The Legend of Jak and Ski Down: 16-bit screen on top, menu or touch controls underneath. */
:root{
  --bg:#0d0718;--panel:#1b1030;--panel-edge:#3b2a63;--ink:#fff4e6;--dim:#a596c4;
  --carrot:#ff5c00;--pink:#ff4fd8;--cyan:#5fe8ff;--gold:#ffd23f;
  --font-pixel:'Press Start 2P','Courier New',monospace;--font-body:'VT323','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body[data-mode="play"]{overflow:hidden;position:fixed;inset:0;width:100%;background:#000}
button,.chip,.start{touch-action:manipulation}
[hidden]{display:none!important}
#app{box-sizing:border-box;max-width:860px;margin:0 auto;padding-block:8px 12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:10px;min-height:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-family:var(--font-pixel);font-size:10px;letter-spacing:.08em;color:var(--carrot);text-shadow:2px 2px 0 #3a1200}
.brand small{display:block;color:var(--dim);font-size:7px;margin-top:5px;letter-spacing:.12em}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:var(--font-pixel);font-size:8px;letter-spacing:.06em;background:var(--panel);color:var(--ink);border:2px solid var(--panel-edge);padding:9px 10px;cursor:pointer;box-shadow:0 3px 0 #000}
.chip:hover{border-color:var(--cyan)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.chip.on{border-color:var(--gold);color:var(--gold)}
.chip:focus-visible,.start:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{position:relative;width:min(100%, calc((100dvh - 240px) * 1.1428));min-width:min(100%,280px);aspect-ratio:256/224;max-width:100%;margin:0 auto;background:#000;border:4px solid var(--panel-edge);box-shadow:0 0 0 4px #000,0 0 40px rgba(255,92,0,.25);box-sizing:border-box}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:pointer}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:rgba(13,7,24,.86);padding:16px}
.overlay h2{font-family:var(--font-pixel);font-size:clamp(11px,3.4vw,18px);line-height:1.5;margin:0;color:var(--gold);text-shadow:3px 3px 0 #3a1200}
.overlay p{font-size:clamp(18px,4.6vw,24px);margin:0}
.under{width:min(100%, calc((100dvh - 240px) * 1.1428));min-width:min(100%,280px);max-width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border:4px solid var(--ink);box-shadow:inset 0 0 0 3px #000,0 0 0 3px #000;padding:12px 14px 14px;display:grid;gap:10px}
.lbl{font-family:var(--font-pixel);font-size:8px;color:var(--dim);letter-spacing:.08em}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.status{font-size:clamp(18px,4.4vw,22px);color:var(--dim);line-height:1.05}
.status b{color:var(--gold);font-weight:normal}
.start{font-family:var(--font-pixel);font-size:13px;letter-spacing:.1em;background:var(--carrot);color:#fff;border:4px solid #fff;box-shadow:0 0 0 3px #000,0 5px 0 3px #000;padding:14px 18px;cursor:pointer;animation:pulse 1.1s steps(2) infinite}
.start:active{transform:translateY(3px)}
.start.quiet{animation:none;background:var(--panel);font-size:10px;padding:11px 12px}
@keyframes pulse{50%{background:var(--pink)}}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:12px;min-height:120px;touch-action:none}
.controls .pad{grid-column:2;grid-row:1}
.controls #trickBtn{grid-column:3;grid-row:1;justify-self:end}
body[data-stick="left"] .controls .pad{grid-column:1;justify-self:start}
body[data-stick="right"] .controls .pad{grid-column:3;justify-self:end}
body[data-stick="right"] .controls #trickBtn{grid-column:1;justify-self:start}
/* a run fills the whole screen: the slope runs edge to edge, the stick and TRICK float over the snow */
body[data-mode="play"] #app{position:fixed;inset:0;max-width:none;margin:0;min-height:0;gap:0;padding:env(safe-area-inset-top,0px) 0 0;display:flex;flex-direction:column;align-items:center}
body[data-mode="play"] .topbar{align-self:stretch;flex:none;justify-content:flex-end;padding:4px max(8px, env(safe-area-inset-right, 0px)) 4px max(8px, env(safe-area-inset-left, 0px))}
body[data-mode="play"] .brand{display:none}
body[data-mode="play"] .topbar .btns{gap:6px;flex-wrap:nowrap}
body[data-mode="play"] .topbar .chip{padding:6px 8px;font-size:7px;box-shadow:none;opacity:.9}
body[data-mode="play"] .screen{flex:none;border:0;box-shadow:none;min-width:0;max-width:none;margin:0}
body[data-mode="play"] .under{position:fixed;left:0;right:0;bottom:0;width:auto;max-width:none;min-width:0;margin:0;z-index:5;pointer-events:none;
  padding:0 max(18px, calc(env(safe-area-inset-right, 0px) + 12px)) max(18px, calc(env(safe-area-inset-bottom, 0px) + 10px)) max(18px, calc(env(safe-area-inset-left, 0px) + 12px))}
body[data-mode="play"] .controls{pointer-events:auto;background:transparent}
body[data-mode="play"] .pad{background:radial-gradient(circle,rgba(42,26,72,.5) 0 55%,rgba(27,16,48,.5) 56%);border-color:rgba(255,255,255,.55)}
body[data-mode="play"] #trickBtn{opacity:.92}
/* sideways phone: slope in the middle at full height, stick and TRICK in the side gutters */
body[data-mode="play"].land .under{top:calc(env(safe-area-inset-top,0px) + 34px);justify-content:center;padding-bottom:max(10px, env(safe-area-inset-bottom, 0px))}
body[data-mode="play"].land .controls{width:100%}
body[data-mode="play"].land:not([data-stick="right"]) .controls .pad{grid-column:1;justify-self:start}
#fsMsg{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 48px);transform:translateX(-50%);z-index:40;width:min(86vw,320px);background:var(--panel);border:3px solid var(--gold);padding:10px;font-family:var(--font-pixel);font-size:8px;line-height:1.7;color:var(--ink);text-align:center}
#trickBtn{width:104px;height:104px;border-radius:50%;padding:0;font-size:10px;background:#1d8fb8;animation:none}
#trickBtn.air{background:var(--carrot);animation:pulse .5s steps(2) infinite}
.pad{flex:none;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,#2a1a48 0 55%,#1b1030 56%);border:4px solid var(--panel-edge);position:relative;touch-action:none}
.pad-tag{position:absolute;font-family:var(--font-pixel);font-size:6px;letter-spacing:.02em;pointer-events:none;text-shadow:1px 1px 0 #000}
.pad-tag.brk{left:4px;bottom:16px;color:#ffd23f}.pad-tag.slow{left:50%;bottom:5px;transform:translateX(-50%);color:#ff8a8a}.pad-tag.dive{right:5px;bottom:16px;color:#5fe8ff}
.knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--carrot);border:4px solid #fff;box-shadow:0 4px 0 #000}
.hint{font-size:clamp(17px,4.2vw,21px);color:var(--dim);line-height:1.05;text-align:center}
.hint b{color:var(--gold);font-weight:normal}
.tally{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:clamp(19px,4.8vw,24px);line-height:1.05}
.tally .v{text-align:right;color:var(--ink)}
.tally .k{color:var(--dim)}
.tally .tot{color:var(--gold);font-family:var(--font-pixel);font-size:11px;padding-top:8px;border-top:2px dashed var(--panel-edge);margin-top:4px}
footer{font-family:var(--font-pixel);font-size:7px;color:var(--dim);text-align:center;letter-spacing:.1em;line-height:1.8}
body[data-mode="play"] footer{display:none}
@media (prefers-reduced-motion: reduce){.start,#trickBtn.air{animation:none}}
</style>
<div id="app">
  <div class="topbar">
    <div class="brand">DISCO CARROT<small>SKY LAUNCH &middot; JAK MINI GAME</small></div>
    <div class="btns">
      <button class="chip" id="pauseBtn" type="button" hidden>PAUSE</button>
      <button class="chip" id="quitBtn" type="button" hidden>QUIT FLIGHT</button>
      <button class="chip" id="fsBtn" type="button" hidden>FULL SCREEN</button>
      <button class="chip" id="muteBtn" type="button">SOUND: ON</button>
    </div>
  </div>

  <div class="screen" id="screen">
    <canvas id="cv" width="256" height="224" aria-label="Sky Launch, a 16-bit paragliding and speed flying mini game"></canvas>
    <div class="overlay" id="overlay" hidden>
      <h2 id="ovTitle">PAUSED</h2>
      <p id="ovText">Tap to keep flying</p>
    </div>
  </div>

  <div class="under">
    <div class="panel" id="menu">
      <div class="lbl">RIDER</div>
      <div class="row" id="crewRow"></div>
      <div class="lbl">WING</div>
      <div class="row" id="wingRow"></div>
      <div class="lbl">SITE</div>
      <div class="row" id="runRow"></div>
      <div class="lbl">NIGHT FLIGHTS</div>
      <div class="row" id="nightRow"></div>
      <div class="status" id="menuStatus"></div>
      <div class="row" id="stickRow"><span class="lbl">STICK</span></div>
      <div class="row"><button class="start" id="goBtn" type="button">SEND IT</button></div>
    </div>

    <div class="controls" id="controls" hidden>
      <button class="start" id="trickBtn" type="button">INFLATE</button>
      <div class="pad" id="pad"><span class="pad-tag brk">BRAKE</span><span class="pad-tag slow">SLOW</span><span class="pad-tag dive">DIVE</span><div class="knob" id="knob"></div></div>
    </div>
    <div class="hint" id="hint" hidden></div>

    <div class="panel" id="results" hidden>
      <div class="tally" id="tally"></div>
      <div class="row" id="resBtns"></div>
    </div>
  </div>
  <footer>THIOKOL ENTERTAINMENT &middot; MISSOULA, MONTANA &middot; MINI GAME SANDBOX</footer>
</div>

<script>
// Jak soundtrack engine: 16-bit house and techno, all synthesized. makeJakMusic(audioContext, outputNode)
function makeJakMusic(ac,out){
  'use strict';
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  // signal chain: instruments -> bus -> warm lowpass -> glue compressor -> level -> out
  const bus=ac.createGain();
  const warm=ac.createBiquadFilter();warm.type='lowpass';warm.frequency.value=8500;warm.Q.value=0.4;
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=10;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.2;
  const level=ac.createGain();level.gain.value=1.4;
  bus.connect(warm);warm.connect(comp);comp.connect(level);level.connect(out);
  const duck=ac.createGain();duck.connect(bus); // melodic parts pump against the kick
  const echo=ac.createDelay(2),fb=ac.createGain(),ehp=ac.createBiquadFilter(),wet=ac.createGain();
  ehp.type='highpass';ehp.frequency.value=700;fb.gain.value=0.33;wet.gain.value=0.4;
  echo.connect(ehp);ehp.connect(fb);fb.connect(echo);ehp.connect(wet);wet.connect(bus);
  const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const pulse=w=>{const n=48,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*w);return ac.createPeriodicWave(re,im);};
  const P25=pulse(0.25),P12=pulse(0.125);

  function vco(type,f,t,stop,det){const o=ac.createOscillator();if(type==='p25')o.setPeriodicWave(P25);else if(type==='p12')o.setPeriodicWave(P12);else o.type=type;
    o.frequency.setValueAtTime(f,t);if(det)o.detune.value=det;o.start(t);o.stop(stop);return o;}
  function vca(t,v,dur,dest,attack=0.002){const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(dest);return g;}
  function nz(t,dur,ftype,freq,v,q=0.7,dest=bus){const s=ac.createBufferSource();s.buffer=nb;const f=ac.createBiquadFilter();f.type=ftype;f.frequency.value=freq;f.Q.value=q;
    s.connect(f);f.connect(vca(t,v,dur,dest,0.001));s.start(t,Math.random()*0.3);s.stop(t+dur+0.02);return f;}

  const I={
    kick(t,v){const o=vco('sine',155,t,t+0.42);o.frequency.exponentialRampToValueAtTime(47,t+0.11);o.connect(vca(t,v,0.38,bus,0.001));nz(t,0.012,'highpass',2600,v*0.25);
      duck.gain.cancelScheduledValues(t);duck.gain.setValueAtTime(0.28,t);duck.gain.linearRampToValueAtTime(1,t+0.22);},
    clap(t,v){[0,0.011,0.022].forEach(d=>nz(t+d,0.018,'bandpass',1400,v*0.7,0.9));nz(t+0.03,0.16,'bandpass',1250,v*0.45,0.8);},
    hat(t,v,open){nz(t,open?0.17:0.035,'highpass',open?7000:8200,v);},
    crash(t,v){nz(t,1.7,'highpass',3800,v);},
    riser(t,dur,v){const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=2.5;
      f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(7000,t+dur);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+dur);g.gain.linearRampToValueAtTime(0.0001,t+dur+0.03);
      s.connect(f);f.connect(g);g.connect(bus);s.start(t);s.stop(t+dur+0.05);},
    tom(t,v){const o=vco('sine',210,t,t+0.2);o.frequency.exponentialRampToValueAtTime(85,t+0.16);o.connect(vca(t,v,0.18,bus));},
    bass(t,m,dur,o){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=o.q||1;const c=o.cut||600;
      f.frequency.setValueAtTime(Math.min(16000,c*(o.acc?3.2:1.8)),t);f.frequency.exponentialRampToValueAtTime(Math.max(70,c*0.55),t+dur);
      vco(o.type||'square',mtof(m),t,t+dur+0.03).connect(f);f.connect(vca(t,o.v||0.25,dur,duck,0.004));},
    stab(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(3400,t);f.frequency.exponentialRampToValueAtTime(800,t+dur);
      const g=vca(t,v*1.6,dur,duck,0.003);f.connect(g);ms.forEach((m,j)=>vco('p25',mtof(m),t,t+dur+0.03,j%2?7:-7).connect(f));},
    pad(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1100;const g=ac.createGain();
      g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.35);g.gain.setValueAtTime(v,t+dur*0.75);g.gain.linearRampToValueAtTime(0.0001,t+dur);
      f.connect(g);g.connect(duck);ms.forEach((m,j)=>vco('sawtooth',mtof(m),t,t+dur+0.05,j%2?9:-9).connect(f));},
    lead(t,m,dur,v){const o=vco('p12',mtof(m),t,t+dur+0.05);const g=vca(t,v,dur,bus,0.004);o.connect(g);g.connect(echo);},
    bell(t,m,dur,v){const o=vco('triangle',mtof(m),t,t+dur+0.05),o2=vco('p25',mtof(m+12),t,t+dur*0.5);const g=vca(t,v,dur,bus,0.002);o.connect(g);o2.connect(vca(t,v*0.25,dur*0.5,g));g.connect(echo);},
    tri(t,m,dur,v){vco('triangle',mtof(m),t,t+dur+0.05).connect(vca(t,v,dur,bus,0.01));},
    snare(t,v){nz(t,0.16,'bandpass',1900,v*0.7,0.7);const o=vco('triangle',200,t,t+0.1);o.frequency.exponentialRampToValueAtTime(150,t+0.08);o.connect(vca(t,v*0.5,0.09,bus));},
    saw3(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=3600;const g=vca(t,v,dur,duck,0.004);f.connect(g);g.connect(echo);
      for(const m of ms)for(const d of [-14,0,14])vco('sawtooth',mtof(m),t,t+dur+0.03,d).connect(f);},
    wobble(t,m,dur,rate,v){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=9;f.frequency.value=650;
      const lfo=vco('sine',rate,t,t+dur+0.05),lg=ac.createGain();lg.gain.value=560;lfo.connect(lg);lg.connect(f.frequency);
      vco('sawtooth',mtof(m),t,t+dur+0.03).connect(f);vco('square',mtof(m-12),t,t+dur+0.03,5).connect(f);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.setValueAtTime(v,t+dur-0.03);g.gain.linearRampToValueAtTime(0.0001,t+dur);f.connect(g);g.connect(duck);
      vco('sine',mtof(m-12),t,t+dur+0.03).connect(vca(t,v*0.9,dur,duck,0.01));},
    reese(t,m,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=2;f.frequency.value=520;
      vco('sawtooth',mtof(m),t,t+dur+0.03,-18).connect(f);vco('sawtooth',mtof(m),t,t+dur+0.03,18).connect(f);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.02);g.gain.setValueAtTime(v,t+dur*0.85);g.gain.linearRampToValueAtTime(0.0001,t+dur);f.connect(g);g.connect(duck);
      vco('sine',mtof(m-12),t,t+dur+0.03).connect(vca(t,v*0.8,dur,duck,0.01));},
    // house piano: bright hammer on top of a soft body
    piano(t,ms,dur,v){const g=vca(t,v,dur,duck,0.002);const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(5200,t);f.frequency.exponentialRampToValueAtTime(1400,t+dur);f.connect(g);
      ms.forEach((m,j)=>{vco('triangle',mtof(m),t,t+dur+0.03,j%2?4:-4).connect(f);vco('p25',mtof(m+12),t,t+0.09).connect(vca(t,0.5,0.08,f));});},
    // electric piano for garage and liquid: sine plus a little bell, slow tremolo
    keys(t,ms,dur,v){const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(duck);
      const tr=vco('sine',5,t,t+dur+0.05),tg=ac.createGain();tg.gain.value=v*0.35;tr.connect(tg);tg.connect(g.gain);
      ms.forEach(m=>{vco('sine',mtof(m),t,t+dur+0.03).connect(g);vco('triangle',mtof(m+12),t,t+0.25).connect(vca(t,0.25,0.22,g));});},
    sub(t,m,dur,v){const o=vco('sine',mtof(m),t,t+dur+0.03);const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.setValueAtTime(v,t+dur*0.8);g.gain.linearRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(duck);},
    cowbell(t,v){const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=800;f.Q.value=3;const g=vca(t,v,0.16,bus,0.001);f.connect(g);vco('square',540,t,t+0.2).connect(f);vco('square',800,t,t+0.2).connect(f);},
    rim(t,v){nz(t,0.02,'bandpass',3200,v,4);vco('triangle',1700,t,t+0.03).connect(vca(t,v*0.5,0.025,bus));},

function populate(Wd,r){
  const s=Wd.site,wing=Wd.wing,gy=x=>gyW(Wd,x),bodyEnd=s.valley-120;
  const nearCliff=x=>Wd.cliffs.some(c=>x>c.x0-30&&x<c.x1+40);
  // trees: clumps on tree sections, scattered low down, a forest on the far hill
  for(const sec of Wd.sections){if(!sec.trees)continue;for(let x=sec.x0+20;x<sec.x1-10;x+=70+r()*110){if(snowSpot(Wd,x,0.9)&&!nearCliff(x))Wd.trees.push({x:Math.round(x)});}}
  if(!s.training)for(let x=Wd.lipX+300;x<bodyEnd;x+=40+r()*90){if(gy(x)>s.vert*0.55&&r()<0.12&&snowSpot(Wd,x,0.9)&&!nearCliff(x))Wd.trees.push({x:Math.round(x)});}
  if(!s.training){for(let x=Wd.hill0-20;x<Wd.XMAX;x+=10+r()*12)Wd.trees.push({x:Math.round(x)});
  for(let x=s.valley+40;x<Wd.lz-240;x+=60+r()*120)if(r()<0.15)Wd.trees.push({x:Math.round(x)});}
  // chairlifts: towers, a cable and chairs on long snowy stretches
  for(let k=0,tries=0;k<s.lifts&&tries<40;tries++){
    const a=Wd.lipX+400+r()*(bodyEnd-Wd.lipX-1100),len=420+r()*340,b=a+len;
    if(b>bodyEnd-80)continue;let ok=true;for(let x=a-20;x<b+20;x+=8)if(stW(Wd,x)!==0){ok=false;break;}
    if(!ok||Wd.lifts.some(l=>!(b<l.a-80||a>l.b+80)))continue;
    const towers=[];for(let x=a;x<=b+1;x+=len/Math.round(len/150))towers.push({x:Math.round(x),y:gy(x)-60});
    Wd.lifts.push({a:towers[0].x,b:towers[towers.length-1].x,towers});k++;
    Wd.trees=Wd.trees.filter(t=>t.x<a-14||t.x>b+14);}
  // fans on benches, Grumps on gentle snow
  const spots=[];for(let x=Wd.lipX+260;x<bodyEnd-40;x+=24){if(snowSpot(Wd,x,0.34)&&!Wd.trees.some(t=>Math.abs(t.x-x)<16)&&!Wd.lifts.some(l=>x>l.a-10&&x<l.b+10))spots.push(x);}
  const take=()=>{if(!spots.length)return null;const i=Math.floor(r()*spots.length),x=spots[i];spots.splice(Math.max(0,i-2),5);return x;};
  for(let k=0;k<s.fans;k++){const x=take();if(x==null)break;const n=1+Math.floor(r()*3);Wd.fans.push({x,n,cols:Array.from({length:n},()=>FAN_COLS[Math.floor(r()*FAN_COLS.length)]),ph:r()*6});}
  for(let k=0;k<s.grumps;k++){const x=take();if(x==null)break;Wd.grumps.push({x,yellT:0});}
  // air: thermals off sunny slopes, sink between them, rough air behind cliffs
  const tx=[];for(let k=0;k<s.therm;k++){let x,tries=0;do{x=Wd.lipX+260+r()*(bodyEnd-Wd.lipX-200);tries++;}while(tries<30&&tx.some(t=>Math.abs(t-x)<520));tx.push(x);}
  tx.sort((a,b)=>a-b);
  let big=0;tx.forEach((x,k)=>{const str=s.tstr*(0.8+r()*0.35);Wd.thermals.push({x,w:90+r()*50,str,per:26+r()*16,ph:r()*6,birds:r()<0.7});if(str>Wd.thermals[big].str)big=k;});
  Wd.thermals.push({x:s.valley+200+r()*200,w:80,str:s.tstr*0.55,per:30,ph:r()*6,birds:false}); // a weak valley thermal
  for(let k=0;k<s.sinks;k++){let x,tries=0;do{x=Wd.lipX+400+r()*(bodyEnd-Wd.lipX-600);tries++;}while(tries<30&&Wd.thermals.some(t=>Math.abs(t.x-x)<t.w));Wd.sinks.push({x,w:90+r()*60,str:10+r()*12*s.turb});}
  if(!s.training)Wd.cliffs.forEach(c=>{if(c.drop>70)Wd.turbs.push({x0:c.x1-10,x1:c.x1+90+c.drop*0.6,agl:120+c.drop*0.4,str:s.turb});});
  // carrots: lines that suit the chosen wing
  const add=(x,y)=>{if(y<gy(x)-10)Wd.carrots.push({x:Math.round(x),y:Math.round(y)});};
  if(wing.id==='para'){
    const gl=wing.trimS/wing.trimV;
    for(let k=0;k<5;k++)add(Wd.lipX+120+k*34,Wd.lipY+20+(120+k*34)*gl+Math.sin(k)*6);           // off the launch
    Wd.thermals.forEach((t,k)=>{if(t.x>s.valley)return;const top=s.cb+40,bot=Math.min(gy(t.x)-80,Wd.lipY+(t.x-Wd.lipX)*gl+60);
      for(let yy=bot;yy>top+30;yy-=56)add(t.x+Math.sin(yy/30)*14,yy);});                      // stacked up the thermals
    for(let x=Wd.lipX+700;x<bodyEnd;x+=600+r()*500){for(let k=0;k<4;k++)add(x+k*26,gy(x+k*26)-22);} // a few low lines for divers
    for(let k=0;k<5;k++)add(Wd.lz-260+k*30,s.vert-40-k*14);                                    // the final glide in
    const T0=Wd.thermals[big];Wd.gold={x:Math.round(T0.x),y:Math.round(s.cb+22)};
  }else{
    for(let x=Wd.lipX+160;x<bodyEnd-40;x+=26){const st=stW(Wd,x);if(st!==0||Wd.trees.some(t=>Math.abs(t.x-x)<18))continue;
      const ph=Math.sin(x/260+Wd.seed%11);if(ph>0.35)add(x,gy(x)-16-ph*10);}
    Wd.lifts.forEach(l=>{for(let x=l.a+60;x<l.b-30;x+=60)add(x,gy(x)-84);});                    // just over the cable
    for(let k=0;k<5;k++)add(Wd.lz-200+k*30,s.vert-14);
    let best=Wd.cliffs[0];Wd.cliffs.forEach(c=>{if(c.drop>best.drop)best=c;});
    const gx=best.x1+40;Wd.gold={x:Math.round(gx),y:Math.round(Math.min(best.top+(gx-best.x0)*0.3+10,gy(gx)-18))};   // a dive off the biggest cliff
  }
  Wd.carrots.push({x:Wd.gold.x,y:Wd.gold.y,gold:true});
  // keep carrots out of trees and off the cable
  Wd.carrots=Wd.carrots.filter(c=>c.gold||!Wd.trees.some(t=>Math.abs(t.x-c.x)<10&&c.y>gy(t.x)-34));
}
// a chairlift cable's height at x (null when there is no cable here)
function cableAt(l,x){if(x<l.a||x>l.b)return null;const T=l.towers;for(let i=0;i<T.length-1;i++){const a=T[i],b=T[i+1];if(x>=a.x&&x<=b.x){const u=(x-a.x)/(b.x-a.x);return a.y+(b.y-a.y)*u+7*4*u*(1-u);}}return null;}

// ---------- input: where the stick points sets the wing's pitch; one button for launch, tricks and turns ----------
// bottom-left = brakes, straight down = slow down (deep brake, the flare), bottom-right = dive forward; up or center = hands up
const keys={};const joy={active:false,id:null,x:0,y:0,ox:0,oy:0,fixed:false};
const btn={down:false,t:0,turning:false,src:null};
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(mode==='play'&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
  keys[k]=true;if(e.repeat)return;
  if(mode==='play'){if(k===' '||k==='j'||k==='k'||k==='x'){if(paused)togglePause();else press('key');}else if(k==='p'||k==='Escape')togglePause();else if(paused)togglePause();}
  else if(mode==='menu'){if(k==='Enter'&&document.activeElement===document.body)startRun();
    else if(k==='ArrowLeft'||k==='ArrowRight'){const i=CREW.findIndex(c=>c.id===sel.crew),n=(i+(k==='ArrowLeft'?-1:1)+CREW.length)%CREW.length;sel.crew=CREW[n].id;sfx.tick();renderMenu();}}
  else if(mode==='results'&&k==='Enter'&&document.activeElement===document.body)(EMBED?exitToHost:startRun)();});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false;if(k===' '||k==='j'||k==='k'||k==='x')release('key');});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;release(btn.src);});
// returns -1 (full brakes) .. +1 (full dive). The stick's direction picks the setting, how far you push it picks how much.
const D2R=Math.PI/180;
function pitchFor(th){ // th: angle from straight down, negative toward the left, positive toward the right
  const a=th/D2R,pts=[[-180,0],[-110,-0.6],[-35,-0.6],[0,-1],[12,-1],[40,1],[110,1],[180,0]];
  for(let i=0;i<pts.length-1;i++){const [a0,v0]=pts[i],[a1,v1]=pts[i+1];if(a>=a0&&a<=a1)return v0+(v1-v0)*(a-a0)/(a1-a0);}return 0;}
function readCtrl(){
  const L=keys.ArrowLeft||keys.a,Rt=keys.ArrowRight||keys.d,D=keys.ArrowDown||keys.s;
  if(D)return -1;if(L)return -0.6;if(Rt)return 1;
  if(!joy.active)return 0;
  const m=Math.min(1,Math.hypot(joy.x,joy.y));if(m<0.2)return 0;
  return clamp(pitchFor(Math.atan2(joy.x,joy.y))*clamp((m-0.2)/0.6,0,1),-1,1);
}
function stickDown(el,fixed){return e=>{
  if(mode==='menu'&&el===cv){menuTap(e);return;}
  if(mode!=='play')return;
  if(paused){togglePause();e.preventDefault();return;}
  joy.active=true;joy.id=e.pointerId;joy.fixed=fixed;try{el.setPointerCapture(e.pointerId);}catch(_){}
  const r=el.getBoundingClientRect();if(fixed){joy.ox=r.left+r.width/2;joy.oy=r.top+r.height/2;}else{joy.ox=e.clientX;joy.oy=e.clientY;}
  stickMove(e);e.preventDefault();};}
function stickMove(e){if(!joy.active||e.pointerId!==joy.id)return;let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const m=Math.hypot(dx,dy),RR=40;if(m>RR){dx=dx/m*RR;dy=dy/m*RR;}joy.x=dx/RR;joy.y=dy/RR;if(joy.fixed)knob.style.transform=`translate(${dx}px,${dy}px)`;}
function stickUp(e){if(e.pointerId!==joy.id)return;joy.active=false;joy.x=joy.y=0;knob.style.transform='';}
[[cv,false],[pad,true]].forEach(([el,fixed])=>{el.addEventListener('pointerdown',stickDown(el,fixed));el.addEventListener('pointermove',stickMove);el.addEventListener('pointerup',stickUp);el.addEventListener('pointercancel',stickUp);});
actBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();try{actBtn.setPointerCapture(e.pointerId);}catch(_){}press('ptr');});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>actBtn.addEventListener(ev,()=>release('ptr')));
overlay.addEventListener('pointerdown',e=>{if(paused){e.preventDefault();togglePause();}});
pauseBtn.addEventListener('click',()=>togglePause());
quitBtn.addEventListener('click',()=>{if(mode==='play')toMenu();});
muteBtn.addEventListener('click',()=>{AudioK.init();muteBtn.textContent=AudioK.toggle()?'SOUND: OFF':'SOUND: ON';});
$('goBtn').addEventListener('click',()=>startRun());

// ---------- screen fitting: tall in portrait, wide in landscape ----------
const screenEl=$('screen'),topbarEl=document.querySelector('.topbar'),fsBtn=$('fsBtn');
function fitScreen(){
  let w=256,h=224;
  const play=mode==='play',vv=window.visualViewport,vw=window.innerWidth,vh=(vv&&vv.height)||window.innerHeight;
  const land=play&&vw>vh*1.05;document.body.classList.toggle('land',land);
  if(play){
    const cs=getComputedStyle($('app')),padT=parseFloat(cs.paddingTop)||0;
    const availW=vw,availH=Math.max(200,vh-padT-topbarEl.offsetHeight);
    if(land)w=Math.max(256,Math.min(480,Math.round(224*availW/availH/2)*2));
    else h=Math.max(224,Math.min(600,Math.round(256*availH/availW)));
    const sc=Math.min(availW/w,availH/h);
    screenEl.style.width=Math.floor(w*sc)+'px';screenEl.style.aspectRatio=`${w}/${h}`;
  }else{screenEl.style.width='';screenEl.style.aspectRatio='';}
  if(w!==W||h!==H){W=w;H=h;cv.width=w;cv.height=h;ctx.imageSmoothingEnabled=false;}
  CTLY=9999;if(play&&!land&&!controlsEl.hidden){const sr=screenEl.getBoundingClientRect(),cr=controlsEl.getBoundingClientRect();if(sr.height>0)CTLY=Math.round((cr.top-sr.top)/(sr.height/H));}
}
addEventListener('resize',fitScreen);
if(window.visualViewport)visualViewport.addEventListener('resize',fitScreen);
addEventListener('orientationchange',()=>setTimeout(fitScreen,250));
const fsEl=document.documentElement,fsReq=fsEl.requestFullscreen||fsEl.webkitRequestFullscreen;
const fsSupported=!!fsReq&&(document.fullscreenEnabled!==false&&document.webkitFullscreenEnabled!==false);
function fsOn(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function fsNote(msg){const old=$('fsMsg');if(old)old.remove();const d=document.createElement('div');d.id='fsMsg';d.textContent=msg;d.addEventListener('click',()=>d.remove());document.body.appendChild(d);setTimeout(()=>d.remove(),4000);}
function toggleFS(){
  if(fsOn()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}
  const no=()=>{fsNote('THIS BROWSER WON\'T HIDE ITS BARS HERE. THE FLIGHT STILL FILLS THE SCREEN.');fsBtn.hidden=true;};
  try{const pr=fsReq.call(fsEl,{navigationUI:'hide'});if(pr&&pr.catch)pr.catch(no);}catch(e){no();}
}
function fsChanged(){fsBtn.textContent=fsOn()?'EXIT FULL':'FULL SCREEN';fitScreen();setTimeout(fitScreen,120);}
document.addEventListener('fullscreenchange',fsChanged);document.addEventListener('webkitfullscreenchange',fsChanged);
fsBtn.addEventListener('click',e=>{e.stopPropagation();toggleFS();});

// ---------- game state ----------

function setMode(m){mode=m;document.body.dataset.mode=m;
  menuEl.hidden=m!=='menu';controlsEl.hidden=m!=='play';hintEl.hidden=true;resultsEl.hidden=m!=='results';
  pauseBtn.hidden=quitBtn.hidden=m!=='play';if(EMBED)quitBtn.hidden=true;fsBtn.hidden=!(fsSupported&&m==='play');
  fitScreen();requestAnimationFrame(fitScreen);if(m==='play')window.scrollTo(0,0);}
function toMenu(){paused=false;overlay.hidden=true;G=null;setMode('menu');AudioK.setHype(false);AudioK.setWind(0);AudioK.setSong('map');renderMenu();}
function togglePause(){if(mode!=='play'||!G||G.phase==='done')return;paused=!paused;overlay.hidden=!paused;AudioK.setWind(paused?0:G.windLvl||0);if(!paused)last=performance.now();}

const START_X=164; // where the rider clicks in, on the launch ramp
function startRun(opts={}){
  AudioK.init();
  const crew=CREW_BY[opts.crew]?opts.crew:sel.crew,wing=WINGS[opts.wing]||WINGS[sel.wing];
  const site=typeof opts.site==='object'&&opts.site?Object.assign({},SITES[0],opts.site):(SITE_BY[opts.site]||SITE_BY[sel.site]);
  sel.crew=crew;sel.wing=wing.id;if(SITE_BY[site.id])sel.site=site.id;
  const seed=opts.seed!=null?opts.seed:Math.floor(Math.random()*1e9);
  const maxH=opts.hearts||(crew==='unk'?4:3);
  const Wd=buildWorld(site,wing,seed);
  G={site,wing,crew,seed,Wd,phase:'intro',introT:0,x:START_X,y:gyW(Wd,START_X),vx:0,vy:0,
    hearts:maxH,maxH,carrots:0,gold:false,fans:0,fanCols:[],tpts:0,tricks:0,bestCombo:0,ppts:0,prox:0,proxT:0,ride:0,
    cloudbase:false,landPts:0,landName:'',butter:false,crashes:0,maxAlt:0,time:0,air:0,
    roll:0,pitch:0,swoopT:0,spin:0,spinN:0,spirals:0,wo:null,woChain:0,woGap:9,collapse:0,stallT:0,stall:0,turb:0,
    launch:{st:'ready',a:-1.72,t:0,v:0,lock:false},wingA:-1.72,ctrl:0,
    parts:[],floats:[],lost:[],track:[],banner:null,shake:0,downT:0,inv:0,doneT:0,camX:0,camY:0,camInit:false,
    recruitR:crew==='bk'?30:18,scare:crew==='ritz'?1:2,trickX:(crew==='zoo'?1.5:1)*wing.trickX,
    vario:0,varioT:0,windLvl:0,lbl:'',sunset:false,result:null};
  joy.active=false;joy.x=joy.y=0;knob.style.transform='';btn.down=false;btn.turning=false;paused=false;overlay.hidden=true;
  hintEl.innerHTML=coarse?'Stick <b>down-left</b> = brakes, <b>straight down</b> = slow down, <b>down-right</b> = dive. Pull back out of a dive to swoop up. Tap <b>TRICK</b> for a wingover, hold it to turn 360s (hold + dive to spiral).'
    :'<b>Left</b> = brakes, <b>down</b> = slow down, <b>right</b> = dive (then left to swoop up). <b>SPACE</b> taps a wingover, hold it to turn 360s (hold + dive to spiral).';
  setMode('play');AudioK.setHype(false);AudioK.setSong(site.song);
}

function setBanner(text,sub,col=PAL.Y,dur=1.6){G.banner={text,sub,col,t:dur,d:dur};}
function floatText(x,y,text,col='#fff'){G.floats.push({x,y,text,col,t:1.2});}
function puff(x,y,n,col,spd=90){for(let i=0;i<n;i++)G.parts.push({x,y,vx:(Math.random()-0.5)*spd,vy:-Math.random()*60-10,life:0.5+Math.random()*0.5,col:col||(i%2?'#ffffff':'#c8d6ee'),g:160});}
const gy=x=>gyW(G.Wd,x);
function agl(){return gy(G.x)-G.y;}

// ---------- the button ----------
function press(src){
  if(mode!=='play'||paused||!G)return;
  btn.src=src;
  const ph=G.phase;
  if(ph==='intro'){if(G.introT<INTRO-0.05)G.introT=INTRO-0.05;return;}
  if(ph==='launch'){launchTap();return;}
  if(ph==='air'){btn.down=true;btn.t=0;btn.turning=false;return;}
  if(ph==='ground'){popUp();return;}
}
function release(src){
  if(!btn.down||(src&&btn.src&&src!==btn.src))return;
  btn.down=false;
  if(G&&G.phase==='air'&&!btn.turning)wingover();
  btn.turning=false;
}
function wingover(){
  if(G.collapse>0||G.stall>0)return;
  if(G.wo){G.woQueued=true;return;}
  const chain=G.woGap<0.55?G.woChain+1:1;G.woChain=chain;
  G.wo={t:0,dur:0.85,dir:chain%2?1:-1};sfx.flap();
}
function popUp(){
  if(G.vx<G.wing.takeoffV*0.38){floatText(G.x,G.y-40,'TOO SLOW TO POP','#a596c4');return;}
  bankRide();G.phase='air';G.vy=-40;G.y-=2;sfx.jump();puff(G.x,G.y,6);
}

// ---------- launch: tap to pull the wing up, tap again to check it overhead ----------
function launchTap(){
  const L=G.launch;
  if(L.st==='ready'){L.st='inflate';L.t=0;sfx.inflate();setBanner('INFLATE!','TAP AGAIN WHEN IT\'S OVERHEAD','#5fe8ff',1.2);return;}
  if(L.st==='inflate'){const a=Math.abs(G.wingA);L.lock=true;L.st='up';
    if(a<0.2){G.tpts+=100;setBanner('CLEAN LAUNCH!','+100','#3ad06a',1.2);sfx.trick();L.q='clean';}
    else if(a<0.5){floatText(G.x,G.y-50,'GOOD','#ffffff');L.q='ok';}
    else{floatText(G.x,G.y-50,'SCRAPPY!','#ff9a4d');L.q='scrappy';}
    return;}
}
const INTRO=4.2;
function updLaunch(dt){
  const L=G.launch,w=G.wing,ramp=x=>x>150&&x<G.Wd.lipX;
  if(L.st==='ready'){G.wingA=-1.72;return;}
  if(L.st==='frontal'){L.t+=dt;G.vx=Math.max(0,G.vx-160*dt);G.x+=G.vx*dt;G.y=gy(G.x);
    G.wingA=Math.min(2.2,G.wingA+dt*3);
    if(L.t>1.4){G.x=START_X;G.y=gy(G.x);G.vx=0;L.st='ready';L.t=0;G.wingA=-1.72;setBanner('TRY AGAIN','TAP INFLATE','#ffffff',1.2);}return;}
  L.t+=dt;
  // the wing swings up from the snow behind; without a check it keeps going and folds in front
  if(!L.lock){G.wingA+=dt*1.72/w.inflateT*(G.wingA<-0.35?1.15:0.42); // it slows as it comes overhead
    if(G.wingA>0.85){L.st='frontal';L.t=0;sfx.collapse();G.shake=0.2;setBanner('FRONTAL!','TAP AGAIN WHEN IT\'S OVERHEAD','#ff6b6b',1.4);return;}}
  else G.wingA+=(0-G.wingA)*Math.min(1,dt*8);
  // ski down the ramp, the wing pulls a little once it is up
  const acc=ramp(G.x)?72:20;G.vx+=acc*dt*(G.wingA>-0.6?1.15:1);G.x+=G.vx*dt;G.y=gy(G.x);
  if(Math.random()<dt*25)G.parts.push({x:G.x-6,y:G.y,vx:-20-Math.random()*20,vy:-20-Math.random()*25,life:0.35,col:'#ffffff',g:120});
  if(L.lock&&Math.abs(G.wingA)<0.25&&G.vx>=w.takeoffV){
    G.phase='air';G.vy=-12;G.air=0;G.y-=1;sfx.jump();puff(G.x,G.y,8);AudioK.setHype(false);
    if(L.q==='scrappy'){G.collapse=0.3;G.vy=0;}
    if(L.q!=='clean')setBanner('AIRBORNE!',G.site.name,PAL.O,1.2);
  }else if(G.x>=G.Wd.lipX-2){ // went off the lip before the wing was flying
    G.phase='air';G.wingA=0;L.lock=true;G.vy=20;G.collapse=0.5;hurt('UGLY LAUNCH!');
  }
}

// ---------- crashes ----------
function hurt(msg){ // lose a heart but keep flying (a bad launch, a wire tick)
  if(G.inv>0)return;G.hearts--;G.crashes++;G.inv=1.4;G.shake=0.4;sfx.hurt();
  setBanner(msg,G.hearts>0?`${G.hearts} HEART${G.hearts===1?'':'S'} LEFT`:'OUT OF HEARTS','#ff6b6b',1.4);
  if(G.hearts<=0)wipe();
}
function crash(msg,force){
  if(G.phase==='down'||G.phase==='over'||G.phase==='done'||(G.inv>0&&!force))return;
  bankProx();bankRide();
  G.hearts--;G.crashes++;G.phase='down';G.downT=1.4;G.shake=0.5;G.vx=0;G.vy=0;G.wo=null;G.collapse=0;btn.down=false;btn.turning=false;
  sfx.hurt();puff(G.x,G.y,16);
  if(G.fans>0){const n=Math.ceil(G.fans/4);loseFans(n);}
  setBanner(msg,G.hearts>0?`${G.hearts} HEART${G.hearts===1?'':'S'} LEFT`:'OUT OF HEARTS','#ff6b6b',1.5);
  if(G.hearts<=0)G.wiped=true;
}
function wipe(){G.phase='over';G.overT=0;G.vx=0;G.vy=0;sfx.over();AudioK.setSong(null);AudioK.setWind(0);setBanner('WIPEOUT!','SKI PATROL IS ON THE WAY','#ff6b6b',2.4);}
function loseFans(n){n=Math.min(n,G.fans);for(let i=0;i<n;i++){G.fans--;const col=G.fanCols.pop()||'#fff';G.lost.push({x:G.x+(Math.random()-0.5)*20,y:G.y-8,vx:(Math.random()<0.5?-1:1)*(30+Math.random()*30),col,life:1.3});}
  if(n>0){sfx.lose();floatText(G.x,G.y-46,`-${n} FANS`,'#ff6b6b');}return n;}
function respawn(){
  const Wd=G.Wd;let x=G.x+10;
  for(let k=0;k<400;k++,x+=6){const st=stW(Wd,x);if((st===0||st===2)&&Math.abs(slopeW(Wd,x,8))<0.9&&stW(Wd,x+14)!==1&&!Wd.trees.some(t=>t.x>x-20&&t.x<x+110)&&!Wd.lifts.some(l=>x>l.a-30&&x<l.b+30))break;}
  G.x=x;G.y=gy(x);G.phase='ground';G.vx=G.wing.takeoffV*0.7;G.vy=0;G.inv=1.6;G.wingA=0;G.roll=0;G.spin=0;
  setBanner('RELAUNCH!','',PAL.O,1.0);sfx.inflate();
}

// ---------- scoring helpers ----------
function bankProx(){if(G.prox>=5){const p=Math.round(G.prox);G.ppts+=p;floatText(G.x,G.y-48,`PROXIMITY +${p}`,'#5fe8ff');if(p>=60)sfx.trick();}G.prox=0;G.proxT=0;}
function bankRide(){if(G.ride>=5){const p=Math.round(G.ride);G.ppts+=p;floatText(G.x,G.y-48,`SPEED RIDE +${p}`,'#ffd23f');}G.ride=0;}

// ---------- the air ----------
function liftAt(x,y){
  const Wd=G.Wd,s=G.site;let v=0;
  const day=G.time<s.day?1:clamp(1-(G.time-s.day)/15,0,1);
  if(day>0)for(const t of Wd.thermals){const dx=(x-t.x)/(t.w/2);if(Math.abs(dx)>=1)continue;
    const cyc=clamp(0.55+0.75*Math.sin(G.time*2*Math.PI/t.per+t.ph),0,1);
    const top=s.cb,taper=clamp((y-top)/70,0,1),bot=clamp((gy(t.x)-y)/30,0,1);
    v+=t.str*(1-dx*dx)*cyc*taper*bot*day;}
  for(const k of Wd.sinks){const dx=(x-k.x)/(k.w/2);if(Math.abs(dx)<1)v-=k.str*(1-dx*dx);}
  return v; // positive = rising air
}
function thermalCycle(t){return clamp(0.55+0.75*Math.sin(G.time*2*Math.PI/t.per+t.ph),0,1)*(G.time<G.site.day?1:clamp(1-(G.time-G.site.day)/15,0,1));}
function polar(c){ // target airspeed and sink for a pitch setting: -1 slow right down, -0.6 brakes, 0 hands up, +1 full dive
  const w=G.wing;
  if(c<-0.6)return{v:lerp(w.brakeV,w.slowV,(-c-0.6)/0.4),s:lerp(w.brakeS,w.slowS,(-c-0.6)/0.4)};
  if(c<0)return{v:lerp(w.trimV,w.brakeV,-c/0.6),s:lerp(w.trimS,w.brakeS,-c/0.6)};
  const u=c*c*(3-2*c); // eases in so a light push is a gentle nose-down and a full push is a real dive
  return{v:lerp(w.trimV,w.diveV,u),s:lerp(w.trimS,w.diveS,u)};}
function sinkAt(v){const w=G.wing;if(v<w.brakeV)return w.brakeS+(w.brakeV-v)*0.7;if(v<w.trimV)return lerp(w.brakeS,w.trimS,(v-w.brakeV)/(w.trimV-w.brakeV));return lerp(w.trimS,w.barS,clamp((v-w.trimV)/(w.barV-w.trimV),0,1.5));}

function updAir(dt,c){
  const w=G.wing,s=G.site;G.air+=dt;
  // hold the button to turn: gentle 360s, or with the speed bar a steep spiral
  if(btn.down){btn.t+=dt;if(btn.t>0.2&&!G.wo&&G.collapse<=0)btn.turning=true;}
  const turning=btn.turning&&G.collapse<=0&&G.stall<=0;
  const spiral=turning&&c>0.4&&btn.t>0.7;
  let tv,ts;
  if(G.collapse>0){G.collapse-=dt*(c<-0.5?2.2:1);tv=w.trimV*0.8;ts=w.trimS+36;}
  else if(G.stall>0){G.stall-=dt;tv=w.brakeV*0.5;ts=w.trimS+48;}
  else if(turning){tv=spiral?w.turnV*0.6:w.turnV;ts=spiral?lerp(w.turnS,w.spiralS,clamp((btn.t-0.7)/1.2,0,1)):w.turnS;}
  else{const p=polar(c);tv=p.v;ts=p.s;if(c<-0.5&&agl()<24&&G.vx>w.brakeV*0.8){ts*=0.25;tv=w.brakeV*0.7;}}
  // full brakes held too long stalls the wing
  if(c<-0.85&&!turning&&G.collapse<=0&&agl()>30){G.stallT+=dt;if(G.stallT>w.stallT*2&&G.stall<=0){G.stall=1.0;G.stallT=0;sfx.collapse();setBanner('STALL!','LET THE STICK GO','#ff6b6b',1.2);}}
  else G.stallT=Math.max(0,G.stallT-dt*2);
  // wingover: a big swing side to side, costs a little height
  if(G.wo){const o=G.wo;o.t+=dt;ts+=14;if(o.t>=o.dur){const pts=Math.round(60*G.woChain*G.trickX);G.tpts+=pts;G.tricks++;G.bestCombo=Math.max(G.bestCombo,pts);
      floatText(G.x,G.y-50,G.woChain>1?`WINGOVER x${G.woChain} +${pts}`:`WINGOVER +${pts}`,G.woChain>1?'#ffd23f':'#5fe8ff');if(G.woChain>2)sfx.party();else sfx.trick();
      G.wo=null;G.woGap=0;if(G.woQueued){G.woQueued=false;wingover();}}}
  else G.woGap+=dt;
  // turbulence behind cliffs: flying on the speed bar in rough air can fold the wing
  G.turb=0;for(const z of G.Wd.turbs){if(G.x>z.x0&&G.x<z.x1&&agl()<z.agl){G.turb=z.str;break;}}
  if(G.turb>0){G.vy+=(Math.random()-0.5)*90*G.turb*dt*4;if(Math.random()<dt*3)G.shake=Math.max(G.shake,0.06);
    if(c>0.75&&G.collapse<=0&&G.stall<=0&&Math.random()<dt*0.35*G.turb){G.collapse=1.3;sfx.collapse();G.shake=0.3;setBanner('COLLAPSE!','PULL THE STICK DOWN','#ff6b6b',1.4);}}
  const lift=liftAt(G.x,G.y-12);
  const v0=G.vx;
  G.vx+=(tv-G.vx)*Math.min(1,dt*(turning?2.5:c>0.1?2.2:c<-0.1?2.4:1.6));
  G.vy+=(ts-lift-G.vy)*Math.min(1,dt*(c>0.1?3.2:2.6));
  const shed=v0-G.vx; // airspeed lost this frame
  if(shed>0&&v0>w.trimV*1.04&&!turning&&G.collapse<=0&&G.stall<=0){G.vy-=shed*(c<-0.2?2.8:1.2);G.vy=Math.max(G.vy,-w.trimV*1.3);
    if(c<-0.2&&G.vy<-w.trimS*2&&!G.swoopT){G.swoopT=1;floatText(G.x,G.y-50,'SWOOP!','#3ad06a');sfx.flap();}}
  if(G.vy>0)G.swoopT=0;
  // the whole wing and pilot pitch with the stick
  G.pitch+=((turning||G.collapse>0||G.stall>0?0:c)-G.pitch)*Math.min(1,dt*4);
  // the far side of the valley has a stiff headwind
  const hw=G.x-(G.Wd.lz+200);if(hw>0){G.vx=Math.min(G.vx,w.trimV*clamp(1-hw/240,0,1));G.headwind=true;}else G.headwind=false; // stops you dead before the pond and trees
  G.x+=G.vx*dt;G.y+=G.vy*dt;
  // spin and roll for the drawing, and points for spirals
  if(turning){const rate=spiral?2*Math.PI/0.9:2*Math.PI/(G.wing.id==='speed'?1.3:2.4);const before=Math.floor(G.spin/(2*Math.PI));G.spin+=rate*dt;
    if(Math.floor(G.spin/(2*Math.PI))>before){G.spinN++;
      if(spiral||G.wing.id==='speed'){const pts=Math.round((spiral?60:40)*G.trickX);G.tpts+=pts;G.spirals++;floatText(G.x,G.y-50,spiral?`SPIRAL +${pts}`:`360 +${pts}`,'#ff9a4d');sfx.tick();}
      else if(lift>w.turnS)floatText(G.x,G.y-50,'CLIMBING','#3ad06a');}}
  else{G.spin=0;G.spinN=0;}
  G.roll+=((G.wo?Math.sin(G.wo.t/G.wo.dur*Math.PI*2)*1.0*G.wo.dir:turning?(spiral?0.75:0.35):G.collapse>0?Math.sin(T/80)*0.3:G.turb>0?Math.sin(T/90)*0.12*G.turb+G.pitch*0.4:G.pitch*0.4)-G.roll)*Math.min(1,dt*7);
  // proximity: fast and close to the snow
  const h=agl();
  if(h<46&&h>0&&G.vx>w.trimV*0.75&&G.collapse<=0){G.prox+=(46-h)/46*G.vx*dt*0.22*w.proxX*G.trickX;G.proxT=0.6;}
  else if(G.proxT>0){G.proxT-=dt;if(G.proxT<=0)bankProx();}
  // highest point and cloudbase
  G.maxAlt=Math.max(G.maxAlt,s.vert-G.y);
  if(!G.cloudbase&&G.y<s.cb+34){G.cloudbase=true;G.tpts+=200;setBanner('CLOUDBASE!','+200','#ffffff',1.6);sfx.gold();}
  if(G.y<s.cb+6){G.vy=Math.max(G.vy,12);} // into the cloud: it spits you out
  // vario beeps when climbing
  G.vario=-G.vy;G.varioT-=dt;
  if(G.vario>2.5&&G.varioT<=0){sfx.vario(G.vario);G.varioT=clamp(0.55-G.vario*0.012,0.12,0.5);}
}

// touching the ground: soft on snow and you ski it, hard or on rock you crash
function touch(){
  const Wd=G.Wd,st=stW(Wd,G.x),s=slopeW(Wd,G.x),rel=G.vy-G.vx*s;
  if(st===3){splash();return;}
  if(!Wd.training&&G.x>Wd.hill0-30&&st!==3){crash('INTO THE TREES!',true);endAfterCrash('TREE LANDING');return;}
  if(st===1){crash('ROCKS!',true);return;}
  if(rel>G.wing.touchTol||G.collapse>0.4||G.stall>0.3){crash(rel>G.wing.touchTol*1.8?'SLAMMED IN!':'HARD LANDING!',true);if(st===2)endAfterCrash('CRASH LANDING');return;}
  bankProx();
  G.y=gy(G.x);G.phase='ground';G.wo=null;btn.turning=false;G.spin=0;G.roll=0;G.lastTouch={rel,x:G.x};
  if(st===2){G.butter=rel<6&&G.ctrl<-0.4;puff(G.x,G.y,8);sfx.land();if(G.butter)floatText(G.x,G.y-44,'BUTTER!','#ffd23f');}
  else{sfx.land();puff(G.x,G.y,6);if(G.air>1.5)floatText(G.x,G.y-44,'TOUCH DOWN','#ffffff');}
  G.air=0;
}
function endAfterCrash(name){G.endAfterCrash=name;}
function splash(){G.phase='splash';G.vx*=0.3;G.vy=0;G.y=gy(G.x)+3;sfx.splash();bankProx();
  for(let i=0;i<24;i++)G.parts.push({x:G.x,y:G.y,vx:(Math.random()-0.5)*120,vy:-60-Math.random()*90,life:0.8,col:i%2?'#bfe9ff':'#ffffff',g:200});
  G.landName='POND LANDING';G.landPts=0;setBanner('SPLASH!','POND LANDING','#5fe8ff',2.0);G.doneT=0;}

function updGround(dt,c){
  const Wd=G.Wd,w=G.wing,s=slopeW(Wd,G.x),st=stW(Wd,G.x);
  const brake=c<0?1+2.2*-c:1-0.25*c;
  const ax=200*s/(1+s*s)-(w.drag[0]*G.vx+w.drag[1]*G.vx*G.vx)*brake-(st===2?14:0);
  G.vx=Math.max(0,G.vx+ax*dt);G.x+=G.vx*dt;G.y=gy(G.x);
  if(Math.random()<dt*G.vx*0.3)G.parts.push({x:G.x-6,y:G.y,vx:-G.vx*0.3-Math.random()*20,vy:-25-Math.random()*30,life:0.35,col:'#ffffff',g:120});
  G.track.push({x:G.x,y:G.y});if(G.track.length>600)G.track.splice(0,100);
  if(st===0&&G.vx>w.takeoffV*0.6)G.ride+=G.vx*dt*0.12*w.proxX*G.trickX;
  // stuff in the way on the snow
  if(G.inv<=0){for(const t of Wd.trees)if(Math.abs(t.x-G.x)<6){crash('TREED!');return;}
    if(st===1){crash('ROCKS!');return;}}
  if(st===3){splash();return;}
  if(!Wd.training&&G.x>Wd.hill0-30){crash('INTO THE TREES!',true);endAfterCrash('TREE LANDING');return;}
  // the snow drops away faster than the wing sinks: you're flying again
  const ahead=(gy(G.x+14)-G.y)/14,glide=sinkAt(G.vx)/Math.max(1,G.vx);
  if(G.vx>w.takeoffV*0.75&&ahead>glide+0.05){bankRide();G.phase='air';G.vy=G.vx*glide;G.air=0;return;}
  if(st===2&&G.vx<8){landed();return;}
  if(st===0&&G.vx<4){G.vx=w.takeoffV*0.42;floatText(G.x,G.y-40,'SKATE IT','#a596c4');}
}
function landed(){
  bankRide();
  const Wd=G.Wd,d=G.x-Wd.lz,ad=Math.abs(d);
  let pts,name;
  if(ad<14){pts=500;name='BULLSEYE!';}else if(ad<40){pts=300;name='ON TARGET';}else if(ad<90){pts=150;name='IN THE LZ';}
  else{pts=50;name=d<0?'LANDED SHORT':'OVERSHOT';}
  if(G.butter)pts+=100;
  G.landPts=pts;G.landName=name;G.phase='party';G.doneT=0;G.vx=0;
  sfx.party();AudioK.setHype(true);setBanner(name,`+${pts}${G.butter?' WITH BUTTER':''}`,ad<40?PAL.Y:'#ffffff',2.2);
}

// ---------- update ----------
function update(dt){
  T+=dt*1000;
  if(mode==='menu'||!G)return;
  G.parts=G.parts.filter(p=>(p.life-=dt)>0);G.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||160)*dt;});
  G.floats=G.floats.filter(f=>(f.t-=dt)>0);
  G.lost=G.lost.filter(f=>(f.life-=dt)>0);G.lost.forEach(f=>{f.x+=f.vx*dt;f.y+=50*dt;});
  if(G.banner&&(G.banner.t-=dt)<=0)G.banner=null;
  if(G.shake>0)G.shake-=dt;
  G.Wd.grumps.forEach(g=>{if(g.yellT>0)g.yellT-=dt;});
  if(mode!=='play'||paused)return;
  const c=readCtrl();G.ctrl=c;
  const ph=G.phase;
  if(ph==='intro'){const e0=G.introT;G.introT+=dt;const e1=G.introT;
    if(e0<0.1&&e1>=0.1)sfx.honk();if(e0<1.0&&e1>=1.0)sfx.door();if(e0<2.6&&e1>=2.6)sfx.click();if(e0<3.2&&e1>=3.2)sfx.inflate();
    if(G.introT>=INTRO){G.phase='launch';}
  }else if(ph==='launch')updLaunch(dt);
  else if(ph==='air'){G.time+=dt;updAir(dt,c);
    // what the pilot can hit
    const Wd=G.Wd;
    if(G.y>=gy(G.x)-0.5)touch();
    else if(G.inv<=0){
      for(const t of Wd.trees){if(Math.abs(t.x-G.x)<7&&G.y>gy(t.x)-25){crash('TREED!');break;}}
      for(const l of Wd.lifts){const cy=cableAt(l,G.x);if(cy!=null&&G.y>cy-2&&G.y-18-w8().lineL-3<cy){crash('WIRE STRIKE!');break;}
        for(const tw of l.towers)if(Math.abs(tw.x-G.x)<3&&G.y>tw.y)crash('LIFT TOWER!');}
    }
  }else if(ph==='ground'){G.time+=dt;updGround(dt,c);}
  else if(ph==='down'){G.downT-=dt;if(G.downT<=0){if(G.wiped)wipe();else if(G.endAfterCrash){G.landName=G.endAfterCrash;G.landPts=0;G.phase='party';G.doneT=0;}else respawn();}}
  if(G.inv>0&&G.phase!=='down')G.inv-=dt;
  if(G.phase==='party'||G.phase==='splash'){G.doneT+=dt;if(G.phase==='party')G.vx=0;if(G.doneT>3.2)finishRun(false);}
  if(G.phase==='over'){G.overT+=dt;if(G.overT>3)finishRun(true);}
  // pickups, fans and Grumps
  if(G.phase==='air'||G.phase==='ground')pickups(dt);
  // wind noise follows airspeed
  const wl=(G.phase==='air'||G.phase==='ground')?clamp(G.vx/170,0.05,1)*(G.phase==='air'?1:0.7):0;
  if(Math.abs(wl-G.windLvl)>0.03){G.windLvl=wl;AudioK.setWind(wl);}
  // label on the big button
  const lbl=G.phase==='launch'?(G.launch.st==='ready'?'INFLATE':G.launch.st==='inflate'?'LAUNCH':'GO'):G.phase==='ground'?'POP':'TRICK';
  if(lbl!==G.lbl){G.lbl=lbl;actBtn.textContent=lbl;}
  actBtn.classList.toggle('air',G.phase==='launch'&&G.launch.st==='inflate'&&Math.abs(G.wingA)<0.35);
}
function w8(){return G.wing;}
function pickups(dt){
  const Wd=G.Wd,cy=G.y-14;
  for(const k of Wd.carrots){if(k.dead)continue;if(Math.abs(k.x-G.x)<11&&Math.abs(k.y-cy)<14){k.dead=1;
    if(k.gold){G.gold=true;G.carrots+=10;sfx.gold();setBanner('GOLDEN CARROT!','+10 CARROTS','#ffd23f',1.8);puff(k.x,k.y,16,'#ffd23f');}

// ---------- results and the handoff back to the main game ----------
function finishRun(wiped){
  if(G.phase==='done')return;

  const k=(s.vert/1000)*(w.id==='speed'?1.1:1);

  const result={type:'skylaunch:result',crew:G.crew,wing:w.id,site:s.id,seed:G.seed,score,rank,carrots:G.carrots,gold:G.gold,fans,
    trickPoints:G.tpts,tricks:G.tricks,proximityPoints:Math.round(G.ppts),landing:G.landName,landingPoints:land,cloudbase:G.cloudbase,
    maxAltitudeFt:Math.round(G.maxAlt*2),airtime:Math.round(G.time*10)/10,hearts,crashes:G.crashes,wipeout:wiped,shopPoints:G.carrots+fans};
  const bk=s.id+':'+w.id+':'+G.crew,b=bests(),isBest=!b[bk]||score>b[bk];if(isBest&&score>0){b[bk]=score;ls.set('skylaunch-best',JSON.stringify(b));}
  G.result=result;G.drawAs=G.phase==='over'?'over':G.phase==='splash'?'splash':'party';G.phase='done';G.isBest=isBest&&score>0;
  setMode('results');AudioK.setSong(wiped?'map':'house');AudioK.setHype(false);AudioK.setWind(0);
  const row=(k2,v,cls='')=>`<div class="k ${cls}">${k2}</div><div class="v ${cls}">${v}</div>`;
  $('tally').innerHTML=
    row(`Carrots ${G.carrots}${G.gold?' (golden!)':''} x10`,G.carrots*10)+
    row(`Tricks ${G.tricks+G.spirals}${G.cloudbase?' + cloudbase':''}`,G.tpts)+
    row(w.id==='speed'?'Proximity + speed riding':'Proximity flying',Math.round(G.ppts))+
    row(`Fans ${fans} x50`,fans*50)+
    row(wiped?'Landing (wiped out)':`Landing: ${G.landName.replace('!','').toLowerCase()}${G.butter&&land>0?' + butter':''}`,land)+
    row(`Hearts left ${hearts} x100`,hearts*100)+
    row(`TOTAL${G.isBest?' NEW BEST':''}`,score,'tot');
  const rb=$('resBtns');rb.innerHTML='';
  if(EMBED)rb.appendChild(mkBtn('start','BACK TO JAK',exitToHost));
  else{rb.appendChild(mkBtn('start','FLY AGAIN',()=>startRun()));rb.appendChild(mkBtn('start quiet','CHANGE SETUP',toMenu));}
  try{if(typeof SkyLaunch.onFinish==='function')SkyLaunch.onFinish(result);}catch(e){}
  try{if(window.parent&&window.parent!==window)window.parent.postMessage(result,'*');}catch(e){}
}

// ---------- drawing: the wing ----------
const WING_C={};
function wingCanvas(crew,wid,under,folded){
  const key=crew+wid+(under?1:0)+(folded?1:0);if(WING_C[key])return WING_C[key];
  const w=WINGS[wid],col=WINGCOL[crew]||WINGCOL.bk,cw=w.span+4,ch=w.depth+w.thick+6;
  const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');
  const half=(w.span-1)/2;
  for(let i=0;i<w.span;i++){const u=(i-half)/half,au=Math.abs(u);
    if(folded&&u<-0.15)continue;                                    // one side tucked under
    const top=Math.round(w.depth*u*u)+2,th=Math.max(2,Math.round(w.thick*(1-0.45*u*u)));
    let base=au>0.72?col[2]:au<0.24?col[1]:col[0];if(under)base=mix(base.length===7?base:'#ffffff','#140b22',0.4);
    x.fillStyle=base;x.fillRect(i+2,top,1,th);
    x.fillStyle=under?'rgba(0,0,0,0.25)':'rgba(255,255,255,0.45)';x.fillRect(i+2,top,1,1);
    x.fillStyle='rgba(20,11,34,0.35)';x.fillRect(i+2,top+th-1,1,1);
    if(i%4===0){x.fillStyle='rgba(20,11,34,0.22)';x.fillRect(i+2,top+1,1,th-1);}}
  if(folded){x.fillStyle=mix(col[0],'#140b22',0.3);for(let i=0;i<6;i++)x.fillRect(2+Math.round(half*0.85)-i,w.depth+2+i%3,2,3);}
  outlineCanvas(c);return WING_C[key]=c;
}
// the pilot hangs under the wing; (x,y) are the feet in screen space
function drawPilot(x,y,o){
  const w=G?G.wing:WINGS[sel.wing],crew=o.crew;
  const roll=o.roll||0,spin=o.spin||0,wingA=o.wingA||0,sx=Math.cos(spin),under=sx<0,fold=o.fold;

    const cx=x+wx*cr-wy*sr,cy=y-18+wx*sr+wy*cr;LEDS.push({x:cx,y:cy,col:'#ff4fd8',mid:true});}

  ctx.save();if(Math.abs(sx)<0.999)ctx.scale(Math.max(0.3,Math.abs(sx)),1);

  const skiA=o.skiA||0,col=CREW_BY[crew].ski.ski;ctx.save();ctx.translate(0,18);ctx.rotate(skiA-roll);

  ctx.restore();ctx.restore();
  ctx.restore();

const TSCALE=Math.max(1,Math.min(8,Math.round(+params.get('timescale')||1))); // test hook: run the clock faster
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-(last||now))/1000));last=now;
  try{for(let i=0;i<TSCALE;i++)update(dt);
    ctx.imageSmoothingEnabled=false;
    if(mode==='menu')drawMenu();else if(mode==='results')drawResults();else if(G)drawGame();
  }catch(e){console.error(e);window.__err=(window.__err||0)+1;window.__lastErr=String(e&&e.stack||e);}
  requestAnimationFrame(frame);
}
