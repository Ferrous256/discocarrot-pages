<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Surf Sesh</title>
<meta name="theme-color" content="#0d0718">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* One arcade screen that fills the display: the surf is drawn on the canvas, menus float over it. */
:root{
  --bg:#0d0718;--panel:#1b1030;--panel-edge:#3b2a63;--ink:#fff4e6;--dim:#a596c4;
  --carrot:#ff5c00;--pink:#ff4fd8;--cyan:#5fe8ff;--gold:#ffd23f;
  --font-pixel:'Press Start 2P','Courier New',monospace;--font-body:'VT323','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;position:fixed;inset:0;width:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{touch-action:manipulation}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:env(safe-area-inset-top,0px)}
.topbar{align-self:stretch;flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px max(8px, env(safe-area-inset-right, 0px)) 4px max(8px, env(safe-area-inset-left, 0px))}
.brand{font-family:var(--font-pixel);font-size:8px;letter-spacing:.08em;color:var(--carrot);text-shadow:2px 2px 0 #3a1200;white-space:nowrap}
.btns{display:flex;gap:6px;flex-wrap:nowrap}
.chip{font-family:var(--font-pixel);font-size:7px;letter-spacing:.06em;background:var(--panel);color:var(--ink);border:2px solid var(--panel-edge);padding:6px 8px;cursor:pointer}
.chip:hover{border-color:var(--cyan)}
.chip.on{border-color:var(--gold);color:var(--gold)}
.chip:focus-visible,.start:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{position:relative;flex:none;background:#000;max-width:100%;margin-block:auto}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:pointer}
.panel{position:absolute;left:4%;right:4%;bottom:3%;max-height:68%;overflow:auto;background:var(--panel);border:4px solid var(--ink);box-shadow:inset 0 0 0 3px #000,0 0 0 3px #000;padding:12px;display:grid;gap:10px}
.lbl{font-family:var(--font-pixel);font-size:8px;color:var(--dim);letter-spacing:.08em}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.status{font-size:clamp(17px,4.4vw,22px);color:var(--dim);line-height:1.05}
.status b{color:var(--gold);font-weight:normal}
.start{font-family:var(--font-pixel);font-size:12px;letter-spacing:.1em;background:var(--carrot);color:#fff;border:4px solid #fff;box-shadow:0 0 0 3px #000,0 5px 0 3px #000;padding:12px 16px;cursor:pointer;animation:pulse 1.1s steps(2) infinite}
.start:active{transform:translateY(3px)}
.start.quiet{animation:none;background:var(--panel);font-size:9px;padding:10px 12px}
@keyframes pulse{50%{background:var(--pink)}}
.tally{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:clamp(18px,4.6vw,23px);line-height:1.05}
.tally .v{text-align:right}
.tally .k{color:var(--dim)}
.tally .tot{color:var(--gold);font-family:var(--font-pixel);font-size:10px;padding-top:8px;border-top:2px dashed var(--panel-edge);margin-top:4px}
#fsMsg{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 44px);transform:translateX(-50%);z-index:40;width:min(86vw,320px);background:var(--panel);border:3px solid var(--gold);padding:10px;font-family:var(--font-pixel);font-size:8px;line-height:1.7;color:var(--ink);text-align:center}
/* the stick and TRICK float over the water during a session, like the other mini games */
.controls{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;column-gap:12px;pointer-events:none;
  padding:0 max(18px, calc(env(safe-area-inset-right, 0px) + 12px)) max(18px, calc(env(safe-area-inset-bottom, 0px) + 12px)) max(18px, calc(env(safe-area-inset-left, 0px) + 12px))}
.controls>*{pointer-events:auto}
.controls .pad{grid-column:2;grid-row:1}
.controls #trickBtn{grid-column:3;grid-row:1;justify-self:end}
body[data-stick="left"] .controls .pad{grid-column:1;justify-self:start}
body[data-stick="right"] .controls .pad{grid-column:3;justify-self:end}
body[data-stick="right"] .controls #trickBtn{grid-column:1;justify-self:start}
#trickBtn{width:96px;height:96px;border-radius:50%;padding:0;font-size:11px;background:#1d8fb8;animation:none;opacity:.92}
#trickBtn.ready{background:var(--carrot);animation:pulse .5s steps(2) infinite}
#trickBtn.hit{transform:translateY(3px) scale(.94)}
.pad{flex:none;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,rgba(42,26,72,.5) 0 55%,rgba(27,16,48,.5) 56%);border:4px solid rgba(255,255,255,.55);position:relative;touch-action:none;box-sizing:border-box}
.pad::before,.pad::after{content:'';position:absolute;left:50%;margin-left:-6px;border:6px solid transparent;opacity:.6}
.pad::before{top:6px;border-bottom-color:#fff}.pad::after{bottom:6px;border-top-color:#fff}
.knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--carrot);border:4px solid #fff;box-shadow:0 4px 0 #000;box-sizing:border-box}
@media (prefers-reduced-motion: reduce){.start,#trickBtn.ready{animation:none}}
</style>
</head><body>
<div id="app">
  <div class="topbar">
    <div class="brand">SURF SESH</div>
    <div class="btns">
      <button class="chip" id="quitBtn" type="button" hidden>PADDLE IN</button>
      <button class="chip" id="muteBtn" type="button">SOUND: ON</button>
    </div>
  </div>
  <div class="screen" id="screen">
    <canvas id="cv" width="256" height="448" aria-label="Surf Sesh, a 16-bit surfing mini game at Huntington Beach"></canvas>
    <div class="panel" id="menu">
      <div class="lbl">DRIVERS</div>
      <div class="row" id="drvRow"></div>
      <div class="lbl">DJS</div>
      <div class="row" id="djRow"></div>
      <div class="lbl">SPOT</div>
      <div class="row" id="spotRow"></div>
      <div class="status" id="menuStatus"></div>
      <div class="row" id="stickRow"><span class="lbl">STICK</span></div>
      <div class="row"><button class="start" id="goBtn" type="button">PADDLE OUT</button></div>
    </div>
    <div class="panel" id="results" hidden>
      <div class="tally" id="tally"></div>
      <div class="row" id="resBtns"></div>
    </div>
  </div>
  <div class="controls" id="controls" hidden>
    <button class="start" id="trickBtn" type="button">TRICK</button>
    <div class="pad" id="pad"><div class="knob" id="knob"></div></div>
  </div>
</div>
<script>
// Jak soundtrack engine: 16-bit house and techno, all synthesized. makeJakMusic(audioContext, outputNode)
function makeJakMusic(ac,out){
  'use strict';
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  // signal chain: instruments -> bus -> warm lowpass -> glue compressor -> level -> out
  const bus=ac.createGain();
  const warm=ac.createBiquadFilter();warm.type='lowpass';warm.frequency.value=8500;warm.Q.value=0.4;
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=10;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.2;
  const level=ac.createGain();level.gain.value=1.4;
  bus.connect(warm);warm.connect(comp);comp.connect(level);level.connect(out);
  const duck=ac.createGain();duck.connect(bus); // melodic parts pump against the kick
  const echo=ac.createDelay(2),fb=ac.createGain(),ehp=ac.createBiquadFilter(),wet=ac.createGain();
  ehp.type='highpass';ehp.frequency.value=700;fb.gain.value=0.33;wet.gain.value=0.4;
  echo.connect(ehp);ehp.connect(fb);fb.connect(echo);ehp.connect(wet);wet.connect(bus);
  const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const pulse=w=>{const n=48,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*w);return ac.createPeriodicWave(re,im);};
  const P25=pulse(0.25),P12=pulse(0.125);

  function vco(type,f,t,stop,det){const o=ac.createOscillator();if(type==='p25')o.setPeriodicWave(P25);else if(type==='p12')o.setPeriodicWave(P12);else o.type=type;
    o.frequency.setValueAtTime(f,t);if(det)o.detune.value=det;o.start(t);o.stop(stop);return o;}
  function vca(t,v,dur,dest,attack=0.002){const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(dest);return g;}
  function nz(t,dur,ftype,freq,v,q=0.7,dest=bus){const s=ac.createBufferSource();s.buffer=nb;const f=ac.createBiquadFilter();f.type=ftype;f.frequency.value=freq;f.Q.value=q;
    s.connect(f);f.connect(vca(t,v,dur,dest,0.001));s.start(t,Math.random()*0.3);s.stop(t+dur+0.02);return f;}

  const I={
    kick(t,v){const o=vco('sine',155,t,t+0.42);o.frequency.exponentialRampToValueAtTime(47,t+0.11);o.connect(vca(t,v,0.38,bus,0.001));nz(t,0.012,'highpass',2600,v*0.25);
      duck.gain.cancelScheduledValues(t);duck.gain.setValueAtTime(0.28,t);duck.gain.linearRampToValueAtTime(1,t+0.22);},
    clap(t,v){[0,0.011,0.022].forEach(d=>nz(t+d,0.018,'bandpass',1400,v*0.7,0.9));nz(t+0.03,0.16,'bandpass',1250,v*0.45,0.8);},
    hat(t,v,open){nz(t,open?0.17:0.035,'highpass',open?7000:8200,v);},
    crash(t,v){nz(t,1.7,'highpass',3800,v);},
    riser(t,dur,v){const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=2.5;
      f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(7000,t+dur);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+dur);g.gain.linearRampToValueAtTime(0.0001,t+dur+0.03);
      s.connect(f);f.connect(g);g.connect(bus);s.start(t);s.stop(t+dur+0.05);},
    tom(t,v){const o=vco('sine',210,t,t+0.2);o.frequency.exponentialRampToValueAtTime(85,t+0.16);o.connect(vca(t,v,0.18,bus));},
    bass(t,m,dur,o){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=o.q||1;const c=o.cut||600;
      f.frequency.setValueAtTime(Math.min(16000,c*(o.acc?3.2:1.8)),t);f.frequency.exponentialRampToValueAtTime(Math.max(70,c*0.55),t+dur);
      vco(o.type||'square',mtof(m),t,t+dur+0.03).connect(f);f.connect(vca(t,o.v||0.25,dur,duck,0.004));},
    stab(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(3400,t);f.frequency.exponentialRampToValueAtTime(800,t+dur);
      const g=vca(t,v*1.6,dur,duck,0.003);f.connect(g);ms.forEach((m,j)=>vco('p25',mtof(m),t,t+dur+0.03,j%2?7:-7).connect(f));},
    pad(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1100;const g=ac.createGain();
      g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.35);g.gain.setValueAtTime(v,t+dur*0.75);g.gain.linearRampToValueAtTime(0.0001,t+dur);
      f.connect(g);g.connect(duck);ms.forEach((m,j)=>vco('sawtooth',mtof(m),t,t+dur+0.05,j%2?9:-9).connect(f));},
    lead(t,m,dur,v){const o=vco('p12',mtof(m),t,t+dur+0.05);const g=vca(t,v,dur,bus,0.004);o.connect(g);g.connect(echo);},
    bell(t,m,dur,v){const o=vco('triangle',mtof(m),t,t+dur+0.05),o2=vco('p25',mtof(m+12),t,t+dur*0.5);const g=vca(t,v,dur,bus,0.002);o.connect(g);o2.connect(vca(t,v*0.25,dur*0.5,g));g.connect(echo);},
    tri(t,m,dur,v){vco('triangle',mtof(m),t,t+dur+0.05).connect(vca(t,v,dur,bus,0.01));},
    snare(t,v){nz(t,0.16,'bandpass',1900,v*0.7,0.7);const o=vco('triangle',200,t,t+0.1);o.frequency.exponentialRampToValueAtTime(150,t+0.08);o.connect(vca(t,v*0.5,0.09,bus));},
    saw3(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=3600;const g=vca(t,v,dur,duck,0.004);f.connect(g);g.connect(echo);
      for(const m of ms)for(const d of [-14,0,14])vco('sawtooth',mtof(m),t,t+dur+0.03,d).connect(f);},
    wobble(t,m,dur,rate,v){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=9;f.frequency.value=650;
      const lfo=vco('sine',rate,t,t+dur+0.05),lg=ac.createGain();lg.gain.value=560;lfo.connect(lg);lg.connect(f.frequency);
      vco('sawtooth',mtof(m),t,t+dur+0.03).connect(f);vco('square',mtof(m-12),t,t+dur+0.03,5).connect(f);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.setValueAtTime(v,t+dur-0.03);g.gain.linearRampToValueAtTime(0.0001,t+dur);f.connect(g);g.connect(duck);
      vco('sine',mtof(m-12),t,t+dur+0.03).connect(vca(t,v*0.9,dur,duck,0.01));},
    reese(t,m,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=2;f.frequency.value=520;
      vco('sawtooth',mtof(m),t,t+dur+0.03,-18).connect(f);vco('sawtooth',mtof(m),t,t+dur+0.03,18).connect(f);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.02);g.gain.setValueAtTime(v,t+dur*0.85);g.gain.linearRampToValueAtTime(0.0001,t+dur);f.connect(g);g.connect(duck);
      vco('sine',mtof(m-12),t,t+dur+0.03).connect(vca(t,v*0.8,dur,duck,0.01));},
    // house piano: bright hammer on top of a soft body
    piano(t,ms,dur,v){const g=vca(t,v,dur,duck,0.002);const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(5200,t);f.frequency.exponentialRampToValueAtTime(1400,t+dur);f.connect(g);
      ms.forEach((m,j)=>{vco('triangle',mtof(m),t,t+dur+0.03,j%2?4:-4).connect(f);vco('p25',mtof(m+12),t,t+0.09).connect(vca(t,0.5,0.08,f));});},
    // electric piano for garage and liquid: sine plus a little bell, slow tremolo
    keys(t,ms,dur,v){const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(duck);
      const tr=vco('sine',5,t,t+dur+0.05),tg=ac.createGain();tg.gain.value=v*0.35;tr.connect(tg);tg.connect(g.gain);
      ms.forEach(m=>{vco('sine',mtof(m),t,t+dur+0.03).connect(g);vco('triangle',mtof(m+12),t,t+0.25).connect(vca(t,0.25,0.22,g));});},
    sub(t,m,dur,v){const o=vco('sine',mtof(m),t,t+dur+0.03);const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.setValueAtTime(v,t+dur*0.8);g.gain.linearRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(duck);},
    cowbell(t,v){const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=800;f.Q.value=3;const g=vca(t,v,0.16,bus,0.001);f.connect(g);vco('square',540,t,t+0.2).connect(f);vco('square',800,t,t+0.2).connect(f);},
    rim(t,v){nz(t,0.02,'bandpass',3200,v,4);vco('triangle',1700,t,t+0.03).connect(vca(t,v*0.5,0.025,bus));},
    shaker(t,v){nz(t,0.05,'bandpass',9000,v,1.5);},
    snap(t,v){nz(t,0.03,'bandpass',2600,v,2);nz(t+0.004,0.05,'highpass',5000,v*0.4);},
    ride(t,v){nz(t,0.45,'bandpass',6500,v,1.2);vco('square',4100,t,t+0.4).connect(vca(t,v*0.12,0.35,bus));},
    brush(t,v,dur){nz(t,dur,'bandpass',3600,v,0.6);},
    // rumble kick for warehouse techno: kick plus a dark, washed-out tail
    rumble(t,v){const o=vco('sine',52,t,t+0.5);o.frequency.exponentialRampToValueAtTime(44,t+0.45);const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=140;o.connect(f);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.06);g.gain.exponentialRampToValueAtTime(0.0001,t+0.45);f.connect(g);g.connect(bus);nz(t,0.3,'lowpass',220,v*0.5);},
    // muted lounge sax for the slots: buzzy reed through a soft filter with vibrato
    sax(t,m,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=2;f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(1900,t+0.06);f.frequency.exponentialRampToValueAtTime(1100,t+dur);
      const a=vco('sawtooth',mtof(m),t,t+dur+0.05),b=vco('square',mtof(m),t,t+dur+0.05,6);const lfo=vco('sine',5.2,t,t+dur+0.05),lg=ac.createGain();lg.gain.value=0;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(14,t+Math.min(0.35,dur));lfo.connect(lg);lg.connect(a.detune);lg.connect(b.detune);
      a.connect(f);b.connect(f);const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.035);g.gain.setValueAtTime(v*0.85,t+dur*0.8);g.gain.linearRampToValueAtTime(0.0001,t+dur);f.connect(g);g.connect(bus);g.connect(echo);},
    upright(t,m,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(1100,t);f.frequency.exponentialRampToValueAtTime(260,t+dur);
      vco('triangle',mtof(m),t,t+dur+0.03).connect(f);vco('sine',mtof(m),t,t+dur+0.03).connect(f);f.connect(vca(t,v,dur,bus,0.006));nz(t,0.03,'bandpass',300,v*0.3,2);}
  };

  const SONGS={
    // opening story: gentle arpeggios, no drums
    story:{bpm:84,swing:0,play(s,t,spb){
      const C=[{r:45,a:[69,72,76,81]},{r:41,a:[65,69,72,77]},{r:38,a:[62,65,69,74]},{r:40,a:[64,68,71,76]}];
      const i=s%16,c=C[Math.floor(s/16)%4];
      if(i===0)I.pad(t,c.a.slice(0,3).map(m=>m-12),spb*16,0.03);
      if(i%8===0)I.tri(t,c.r+12,1.1,0.32);
      if(i%2===0)I.bell(t,c.a[(i/2)%4],0.35,0.07);
    }},
    // tour map: laid-back deep house, 116 BPM
    map:{bpm:116,swing:0.14,play(s,t,spb){
      const CH=[[53,57,60,64],[52,55,59,62],[50,53,57,60],[57,60,64,67]],RT=[41,40,38,45],BL={0:0,3:0,6:12,10:7,13:0};
      const p=Math.floor(s/16)%16,i=s%16,k=Math.floor(s/16)%4;
      if(p>=2&&i%4===0)I.kick(t,0.8);

function audioInit(){
  if(A.ac){if(A.ac.state==='suspended')A.ac.resume();return true;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
  const ac=A.ac=new AC();A.master=ac.createGain();A.master.gain.value=A.muted?0:0.2;A.master.connect(ac.destination);
  A.nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);{const d=A.nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const mus=ac.createGain();mus.gain.value=0.8;mus.connect(A.master);A.eng=makeJakMusic(ac,mus);
  setInterval(()=>{if(A.ac&&A.eng)A.eng.schedule(A.ac.currentTime+0.15);},25);
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}

function tone(f,t,dur,type='square',vol=0.2,slide){if(!A.ac)return;const o=A.ac.createOscillator(),g=A.ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(A.master);o.start(t);o.stop(t+dur+0.03);}
function noise(t,dur,vol,type='lowpass',f=900){if(!A.ac)return;const s=A.ac.createBufferSource();s.buffer=A.nb;const fl=A.ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;
  const g=A.ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(0.06,dur/4));g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(fl);fl.connect(g);g.connect(A.master);s.start(t);s.stop(t+dur+0.02);}

function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}

let G=null;
function startSession(opts={}){
  audioInit();
  const crew=CREW_BY[opts.crew]?opts.crew:sel.crew,spot=SPOT_BY[opts.spot]||SPOT_BY[sel.spot],m=modsFor(crew);
  sel.crew=crew;sel.spot=spot.id;
  const seed=opts.seed!=null?opts.seed:Math.floor(Math.random()*1e9);
  G={crew,spot,m,seed,rnd:rng(seed),wave:0,hearts:3+m.hearts,maxH:3+m.hearts,score:0,carrots:0,tricks:0,bestTrick:'',barrel:0,maxCrew:0,grumpsWon:0,piers:0,kicks:0,
     joy:0,party:0,followers:[],lost:[],parts:[],floats:[],banner:null,shake:0,result:null,waveScores:[],board:BOARD_COLS[CREW.findIndex(c=>c.id===crew)%BOARD_COLS.length]};

  nextWave();
}
function nextWave(){
  const g=G,s=g.spot;g.wave++;
  g.W={len:s.len+(g.wave-1)*200,curl:30,objs:[],pier:null};
  g.x=120;g.h=0.95;g.vh=-1.4;g.vx=s.peel*1.05;g.air=false;g.trick=null;g.tricksThisAir=0;g.hist=[];g.splashed=false;g.inBarrel=0;g.laughUsed=false;g.waveScore=0;g.camX=0;
  g.phase='drop';g.phaseT=0;g.target=0.45;
  // lay out the wave: carrot lines, Grumps, paddlers, a gold carrot and maybe the pier
  const r=g.rnd,Wd=g.W,L=Wd.len;
  if(s.pier){const px=Math.round(L*(0.55+r()*0.15));Wd.pier={x:px,hs:s.piling4?[0.1,0.36,0.62,0.88]:[0.14,0.48,0.82],done:false,hit:false};}
  const clear=x=>!Wd.pier||Math.abs(x-Wd.pier.x)>110;
  let x=300,supLeft=s.sups;
  while(x<L-160){
    if(clear(x)){const t=r();
      if(t<s.grumps){Wd.objs.push({k:'g',x,h:0.18+r()*0.6,ph:r()*6,yell:0,won:false,gone:false});}
      else if(t<s.grumps+0.24&&supLeft>0){supLeft--;Wd.objs.push({k:'s',x,h:0.2+r()*0.55,col:['#ff4fd8','#5fe8ff','#3ad06a','#ffd23f','#ff6b6b','#c58cff','#ff9a4d'][Math.floor(r()*7)],hair:['#3a2418','#111','#ffd27a','#8a3a1a','#c8c8c8'][Math.floor(r()*5)],gone:false});}
      else{const n=3+Math.floor(r()*3*s.carrots),h0=0.15+r()*0.7,dh=(r()-0.5)*0.16;for(let k=0;k<n;k++)Wd.objs.push({k:'c',x:x+k*22,h:clamp(h0+dh*k,0.08,0.95),gone:false});x+=n*22;}}
    x+=70+Math.floor(r()*80);
  }
  const gx=Math.round(L*(0.3+r()*0.4));if(clear(gx))Wd.objs.push({k:'c',x:gx,h:0.96,gold:true,gone:false});
  setBanner(`WAVE ${g.wave} OF ${WAVES_PER_SET}`,g.wave===1?'SET WAVE! DROP IN':'HERE COMES ANOTHER ONE','#ffd23f',1.8);
}
function setBanner(text,sub,col,dur){G.banner={text,sub,col,t:dur,d:dur};}
function floatText(x,h,text,col){G.floats.push({x,h,text,col,t:1.2});}
function faceH(x){const g=G,s=g.spot,d=x-g.W.curl;return s.face*clamp(1-Math.max(0,d-60)/700,0.42,1);}
function TR(){return Math.round(H*0.68);} // trough line on screen
function screenY(x,h){return TR()-h*faceH(x);}
function addPts(p,x,h,label,col){const k=G.party>0?2:1,v=Math.round(p*k);G.score+=v;G.waveScore+=v;if(label)floatText(x,h,`${label} +${v}`,col||'#ffd23f');return v;}
function addJoy(v){const g=G;if(g.party>0)return;g.joy=clamp(g.joy+v*g.m.joy,0,100);if(g.joy>=100)startParty();}
function startParty(){const g=G;g.party=8*g.m.partyLen;g.joy=100;setBanner('PARTY WAVE!','GRUMPS YOU TOUCH JOIN THE PARTY','#ff4fd8',2);sfx.cheer();if(A.eng)A.eng.setHype(true,anow());
  if(g.m.partyCarrots){g.carrots+=g.m.partyCarrots;floatText(g.x,g.h+0.3,`+${g.m.partyCarrots} CARROTS`,'#ff9a4d');}

function wipeout(why,closeout){
  const g=G;if(g.phase!=='ride')return;
  g.phase='wipe';g.phaseT=0;g.shake=0.5;g.trick=null;g.splashed=false;g.closeout=!!closeout;g.wvh=g.air?g.vh:Math.min(0,g.vh);g.wvx=g.vx;g.air=false;sfx.splash();
  if(closeout){ // rode it all the way: the wave closes out on you, no heart lost and the ride still pays
    setBanner('CLOSEOUT!','RODE IT TO THE END','#5fe8ff',1.8);g.kicks++;addPts(200,g.x,g.h+0.3,'RODE IT OUT','#5fe8ff');
    const cp=g.followers.length*50;if(cp)addPts(cp,g.x,g.h+0.5,`${g.followers.length} CREW`,'#3ad06a');g.party=0;if(A.eng)A.eng.setHype(false,anow());return;}
  g.hearts--;setBanner('WIPEOUT!',why,'#ff6b6b',1.8);
  if(!g.m.keepLine){const n=Math.ceil(g.followers.length/2);for(let i=0;i<n;i++){const f=g.followers.pop();g.lost.push({...f,x:g.x-30-i*12,h:0.2,life:1.2});}}
  g.party=0;if(A.eng)A.eng.setHype(false,anow());
}
function endWave(kicked){

const TRICKS=[['SPIN 360',150,'spin'],['SUPERMAN',180,'super'],['KICKFLIP',220,'flip'],['ALLEY OOP',260,'spin']];

// ---------- update ----------
function update(dt){
  if(mode!=='game'||!G)return;const g=G,s=g.spot,m=g.m,Wd=g.W;
  g.phaseT+=dt;
  if(g.banner&&(g.banner.t-=dt)<=0)g.banner=null;

  g.parts=g.parts.filter(p=>(p.life-=dt)>0);g.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;});
  g.lost=g.lost.filter(f=>(f.life-=dt)>0);g.lost.forEach(f=>{f.x-=60*dt;});
  if(g.shake>0)g.shake-=dt;
  if(g.phase==='between'){if(g.phaseT>2.2){if(g.wave>=WAVES_PER_SET||g.hearts<=0)finishSession(false);else nextWave();}return;}
  // the wave peels at its own speed
  Wd.curl+=s.peel*dt;
  if(g.phase==='wipe'){
    if(!g.splashed){ // still falling: same gravity as the air, the board carries some speed
      g.wvh-=4.4*dt;g.h+=g.wvh*dt;g.wvx+=(s.peel*0.5-g.wvx)*dt*1.5;g.x+=g.wvx*dt;
      if(g.h<=0){g.h=0;g.splashed=true;g.splashT=g.phaseT;g.shake=0.3;sfx.splash();
        for(let i=0;i<18;i++)g.parts.push({x:g.x,y:screenY(g.x,0),vx:(Math.random()-0.5)*140,vy:-60-Math.random()*110,life:0.8,col:Math.random()<0.6?'#ffffff':'#bff4ff'});}}
    else g.x+=(s.peel*0.9-30)*dt; // under the whitewater, washed toward the beach
    if(g.phaseT>2.2){g.phase='between';g.phaseT=0;g.waveScores.push(g.waveScore);}camFollow(dt);return;}
  // steering: touch where you want to ride, or hold up and down
  const fh=faceH(g.x);
  if(g.phase==='drop'){g.h+=g.vh*dt;g.vh+=0.6*dt;if(g.h<=0.45||g.phaseT>1){g.phase='ride';g.vh=-0.4;}g.x+=g.vx*dt;g.target=g.h;camFollow(dt);return;}
  if(g.snapCD>0)g.snapCD-=dt;
  if(joy.active&&Math.abs(joy.y)>0.12)g.target=clamp(g.h-joy.y*1.6,-0.1,1.4);
  else if(touch)g.target=clamp((TR()-touch.y)/fh,-0.1,1.4);
  else if(keys.ArrowUp||keys.w)g.target=1.4;else if(keys.ArrowDown||keys.s)g.target=-0.1;else g.target=g.air?g.h:clamp(g.h,0,1);
  const maxV=1.9*m.turn;
  if(!g.air){
    const want=clamp((g.target-g.h)*6,-maxV,maxV);g.vh+=(want-g.vh)*Math.min(1,dt*8*m.turn);
    g.h+=g.vh*dt;
    // speed: dropping down the face accelerates, climbing costs, the pocket pushes you along
    const c=g.x-Wd.curl,pocket=clamp(1-Math.abs(g.h-0.6)/0.6,0,1),near=clamp(1-c/360,0.3,1);
    const push=s.peel*(0.72+0.42*pocket*near)*m.speed*(g.h<0.06?0.75:1);
    g.vx+=(g.vh<0?-g.vh*120*m.pump:-g.vh*75*m.climb)*dt+(push-g.vx)*0.7*dt;
    g.vx=clamp(g.vx,s.peel*0.45,s.peel*2);
    if(g.h<0){g.h=0;g.vh=Math.max(0,g.vh);}
    if(g.h>=1){
      if(g.vh>0.7&&g.vx>s.peel*0.6){g.air=true;g.vh=Math.min(3.2,g.vh*1.25*m.air);g.tricksThisAir=0;floatText(g.x,1.3,'AIR!','#5fe8ff');}
      else{g.h=1;g.vh=Math.min(0,g.vh);}
    }
    // spray off the board on hard turns
    if(Math.abs(g.vh)>1.2&&Math.random()<dt*40)g.parts.push({x:g.x-6,y:screenY(g.x,g.h),vx:-40-Math.random()*40,vy:-60-Math.random()*60,life:0.5,col:Math.random()<0.5?'#ffffff':'#bff4ff'});
  }else{
    g.vh-=4.4*dt;g.h+=g.vh*dt;
    if(g.trick){g.trick.p+=dt/g.trick.dur;if(g.trick.p>=1){g.tricks++;g.tricksThisAir++;const v=addPts(g.trick.pts*(g.tricksThisAir>1?1.5:1),g.x,g.h+0.25,g.trick.name,'#ff4fd8');addJoy(12);g.bestTrick=g.trick.name;g.trick=null;}}
    if(g.h<=1&&g.vh<0){
      g.air=false;g.h=1;
      if(g.trick){wipeout('BAILED THE '+g.trick.name);return;}
      g.vh=-0.8;sfx.land();if(g.tricksThisAir)floatText(g.x,1.2,'STOMPED!','#ffd23f');
      for(let i=0;i<10;i++)g.parts.push({x:g.x,y:screenY(g.x,1),vx:(Math.random()-0.5)*120,vy:-40-Math.random()*80,life:0.6,col:'#ffffff'});
    }
  }
  g.x+=g.vx*dt;
  const c=g.x-Wd.curl;
  // caught by the whitewater
  if(c<-4){wipeout('THE CURL CAUGHT YOU');return;}
  // in the barrel
  if(!g.air&&c<52&&g.h>0.12&&g.h<0.78){g.inBarrel+=dt;g.barrel+=dt;const p=60*dt*m.barrel;G.score+=p*(g.party>0?2:1);g.waveScore+=p;addJoy(9*dt);}
  else if(g.inBarrel>0){if(g.inBarrel>0.7){addPts(150*g.inBarrel*m.barrel,g.x,g.h+0.3,'SPIT OUT','#5fe8ff');sfx.cheer();}g.inBarrel=0;}
  // party wave timer

  // things on the wave face
  const ry=screenY(g.x,g.h);
  for(const o of Wd.objs){if(o.gone)continue;
    if(o.x<Wd.curl-10){o.gone=true;continue;} // swept away by the whitewater
    if(Math.abs(o.x-g.x)>60)continue;
    const oy=screenY(o.x,o.h),dx=o.x-g.x,dy=oy-ry;
    if(o.k==='c'){if(Math.abs(dx)<11&&Math.abs(dy)<14){o.gone=true;g.carrots+=o.gold?5:1;addPts(o.gold?250:10,o.x,o.h+0.15,o.gold?'GOLD CARROT':'',o.gold?'#ffd23f':'#ff9a4d');addJoy(o.gold?30:7);o.gold?sfx.gold():sfx.carrot();}}
    else if(o.k==='s'){const pr=16*m.pull;if(Math.abs(dx)<pr&&Math.abs(dy)<pr){o.gone=true;g.followers.push({col:o.col,hair:o.hair});g.maxCrew=Math.max(g.maxCrew,g.followers.length);addPts(40,o.x,o.h+0.2,'SUP JOINS','#3ad06a');addJoy(6);sfx.join();}}
    else if(o.k==='g'&&!o.won){
      if(dx>0&&dx<90&&!o.yelled){o.yelled=true;o.yell=1.6;sfx.yell();}
      const br=g.party>0?14+m.bass:12;
      if(Math.abs(dx)<br&&Math.abs(dy)<br){
        if(g.party>0||(m.melt&&g.joy>=50)){o.won=true;g.grumpsWon++;addPts(150,o.x,o.h+0.2,'GRUMP WON OVER','#ff4fd8');sfx.join();}
        else if(m.laugh&&!g.laughUsed){g.laughUsed=true;o.won=true;floatText(o.x,o.h+0.2,'HA HA HA!','#ffd23f');}
        else if(!g.air){wipeout('HIT A GRUMP');return;}
      }}
  }
  for(const o of Wd.objs)if(o.k==='g'){if(o.yell>0)o.yell-=dt;if(!o.won)o.h=clamp(o.h+Math.sin(T/900+o.ph)*0.04*dt*g.m.grumpSlow,0.08,0.9);}
  // shoot the pier: thread between the pilings
  const P=Wd.pier;
  if(P&&!P.done&&!g.air){for(const ph of P.hs){if(Math.abs(g.x-(P.x+(ph-0.5)*44))<5&&Math.abs(g.h-ph)<0.085){P.hit=true;wipeout('HIT A PILING');return;}}}
  if(P&&!P.done&&g.x>P.x+28){P.done=true;if(!P.hit){g.piers++;addPts(500,g.x,g.h+0.3,'SHOT THE PIER','#ffd23f');addJoy(25);sfx.cheer();}}

  camFollow(dt);
}

    ctx.fillStyle=cg;ctx.beginPath();ctx.moveTo(lipX,lipY+2);ctx.bezierCurveTo(c1x,c1y+4,c2x,c2y+4,tipX+6,tipY);ctx.lineTo(lipX+40,tr+6);ctx.quadraticCurveTo(lipX+26,(lipY+tr)/2,lipX,lipY+2);ctx.closePath();ctx.fill();
    // spinning water on the inside wall of the tube
    ctx.globalAlpha=0.35;for(let k=0;k<5;k++){const off=((T/12+k*9)%40),u0=0.25+k*0.12;ctx.strokeStyle=k%2?'#5ac8e0':'#2a8ab8';ctx.lineWidth=1;ctx.beginPath();
      ctx.ellipse(curlS+18+k*3,tr-fh0*0.42,12+k*4,fh0*(0.3+u0*0.2),0,Math.PI*(0.55+off/200),Math.PI*(1.35+off/200));ctx.stroke();}ctx.globalAlpha=1;
    // the lip curtain: thick and glassy up top, thinning to a white sheet where it lands
    for(let k=0;k<=60;k++){const u=k/60,[x,y]=lipAt(u),th=Math.max(2,Math.round(8-u*5));
      ctx.globalAlpha=0.92;R(x-2,y-1,5,th,u<0.35?(party?'#a8fff4':'#8ee8dc'):u<0.7?'#d0f8f4':'#f2fffd');ctx.globalAlpha=1;R(x-2,y-1,5,1,'#ffffff');if(u>0.15&&u<0.8&&k%3===0)R(x-1,y+th-1,2,1,'#5ac0d0');}
    // spray kicked up where the lip lands
    for(let i=0;i<14;i++){const a=T/110+i*0.9,ph=(T/700+i*0.07)%1,r=4+ph*14;ctx.globalAlpha=0.8*(1-ph);R(tipX+Math.cos(a)*r*0.8-1,tipY-2-Math.abs(Math.sin(a))*r,2,2,'#ffffff');}ctx.globalAlpha=1;}
  // ---- whitewater: a churning pile of foam rolling in behind the curl ----
  if(curlS>-4){const end=Math.min(W+6,curlS-6);
    const hAt=sx=>{const u=clamp((curlS-sx)/170,0,1),e=clamp((end-sx)/(fh0*0.45),0,1),sh=Math.sqrt(e*(2-e));return Math.max(0,(fh0*(0.2+0.38*(1-u))+Math.sin(sx*0.17+T/130)*3+Math.sin(sx*0.06-T/320)*4)*sh);};
    ctx.fillStyle='#b4d2e6';ctx.beginPath();ctx.moveTo(-4,tr+12);for(let sx=-4;sx<=end;sx+=3)ctx.lineTo(sx,tr-hAt(sx)+4);ctx.lineTo(end,tr+12);ctx.closePath();ctx.fill();
    // lumpy, boiling top made of foam balls, shaded underneath
    for(let sx=-6;sx<end-4;sx+=5){const n=hs(sx+1000),r=Math.max(1,Math.min(4+n%4,Math.round(hAt(sx)/3))),bob=Math.sin(T/160+sx*0.3)*1.5,y=Math.round(tr-hAt(sx)+r+bob);pxCircle(sx,y+2,r,'#9cc0da');pxCircle(sx,y,r,'#eef8ff');if(n%3===0)R(sx-1,y-r+1,2,1,'#ffffff');}
    // churn: darker bubbles rolling inside the foam
    for(let i=0;i<34;i++){const sx=((hs(i)%300)+T*0.04*(1+i%3))%Math.max(8,end+8)-6;if(sx>end)continue;const hh=hAt(sx),y=tr-hh*(0.15+((hs(i*3)%70)/100))+((T*0.02*(1+i%2))%8);R(sx,y,2+(i%2),2,i%4?'#c8e0f0':'#a4c4dc');}
    // mist hanging over the impact zone
    for(let k=0;k<5;k++){const ph=(T/1300+k*0.2)%1;glowAt(curlS-10-k*16,tr-fh0*0.55-ph*16,'#ffffff',14+k*2,0.22*(1-ph));}}
  // ---- the flats in front: deep blue with foam lace drifting off the last wave ----
  const g2=ctx.createLinearGradient(0,tr,0,H);g2.addColorStop(0,'#16649a');g2.addColorStop(0.35,'#11507f');g2.addColorStop(1,'#0a3260');ctx.fillStyle=g2;ctx.fillRect(0,tr+6,W,H-tr);
  // a band of bubbles along the base of the wave
  for(let sx=Math.max(-2,Math.floor(curlS)-8);sx<W;sx+=3){const n=hs(Math.floor((sx+camX)/3));if(n%3)continue;R(sx,tr+5+n%4,2,1,'#8ed4ea');}

  const rows=8;for(let i=0;i<rows;i++){const y0=tr+14+i*((H-tr-24)/rows),fade=0.55-i*0.055,par=0.85+i*0.05;
    for(let sx=-2;sx<W;sx+=2){const wx=sx+camX*par,y=Math.round(y0+Math.sin(wx*0.045+i*1.7+T/1500)*4+Math.sin(wx*0.13+i)*1.5),n=hs(Math.floor(wx/2)+i*977);
      if(n%7<3)continue;ctx.globalAlpha=fade*(0.5+0.5*((n>>>4)%2));R(sx,y,2,1,i<2?'#e8fbff':'#9fd8f0');}}

  for(let i=0;i<30;i++){const y=tr+12+((i*29)%(H-tr-12)),sx=((i*61-camX*(0.9+(i%3)*0.1)-T*0.006*(i%2))%(W+40)+W+40)%(W+40)-20;ctx.globalAlpha=0.3;R(sx,y,3+(i%3)*2,1,'#bff4ff');R(sx+1,y+1,1+(i%3),1,'#0a3260');}
  ctx.globalAlpha=1;
  // whitewater spills out over the flats behind the curl
  if(curlS>0){for(let sx=-2;sx<Math.min(W,curlS+8);sx+=3){const y=tr+3+Math.sin(sx*0.3+T/200)*2,len=4+((sx*7)%6);R(sx,y,3,len,'#e8f6ff');R(sx,y+len,3,1,'#a4c4dc');}
    for(let i=0;i<40;i++){const sx=hs(i*11)%Math.max(4,Math.min(W,curlS)),y=tr+10+((hs(i*17)%40)+T*0.004*(i%3))%40;ctx.globalAlpha=0.55*(1-(y-tr)/52);R(sx,y,2+(i%3),1,'#e8f6ff');}ctx.globalAlpha=1;}
}
function drawPier(camX,behind){
  const g=G,P=g.W.pier;if(!P)return;const px=P.x-camX;if(px<-60||px>W+60)return;
  const tr=TR(),deckY=tr-g.spot.face-46;

    ctx.globalAlpha=0.6;R(x-7,y+1,15,1,'#ffffff');ctx.globalAlpha=1;}
  if(behind){R(px-34,deckY-10,68,10,'#7a5a3a');R(px-34,deckY-10,68,2,'#9a7a54');R(px-36,deckY-1,72,3,'#2a2a36');
    for(let k=-28;k<30;k+=8)R(px+k,deckY-20,1,10,'#e8e4dc');R(px-30,deckY-20,60,1,'#e8e4dc');

}
function drawObjs(camX){
  const g=G;
  for(const o of g.W.objs){if(o.gone)continue;const sx=o.x-camX;if(sx<-24||sx>W+24)continue;const y=screenY(o.x,o.h);
    if(o.k==='c'){drawCarrot(Math.round(sx-5),Math.round(y-12),T,o.gold);if(o.gold)glowAt(sx,y-6,'#ffd23f',14,0.5);}
    else if(o.k==='s'){drawSUP(Math.round(sx-5),Math.round(y-16),T,o.col,o.hair,-1,false);}
    else if(o.k==='g'){drawFloatyGrump(Math.round(sx-6),Math.round(y-20),T,o.yell>0&&!o.won,-1);
      if(o.won){note(Math.round(sx+6),Math.round(y-30+Math.sin(T/200)*2),'#ff4fd8');R(sx-3,y-16,6,1,'#111');}
      else if(o.yell>0)bubble(sx,y-22,[['NO SURFING!','MY WAVE!','GET LOST, KOOK!','TOO LOUD!'][Math.floor(o.ph*10)%4]]);}}

function drawFollowers(camX){
  const g=G,n=g.followers.length;
  for(let i=n-1;i>=0;i--){const idx=g.hist.length-1-(i+1)*9;if(idx<0)continue;const p=g.hist[idx],f=g.followers[i],sx=p.x-camX;if(sx<-24||sx>W+24)continue;
    drawSUP(Math.round(sx-5),Math.round(screenY(p.x,p.h)-16),T+i*90,f.col,f.hair,1,g.party>0||f.line);}
  for(const f of g.lost){ctx.globalAlpha=Math.min(1,f.life);drawPaddler(Math.round(f.x-camX-5),Math.round(screenY(f.x,f.h)-14),T,f.col,f.hair,-1);ctx.globalAlpha=1;}
}
function drawRider(camX){
  const g=G,sx=g.x-camX,y=screenY(g.x,g.h);

    if(!g.splashed){ctx.save();ctx.translate(Math.round(sx),Math.round(y-8));ctx.rotate(u*7);ctx.translate(0,8);drawSurfer(0,0,g.crew,{board:g.board,crouch:true});ctx.restore();return;}
    const w=u-g.splashT,bob=Math.round(Math.sin(T/220)*1.5),wy=Math.round(screenY(g.x,0));
    ctx.save();ctx.translate(Math.round(sx+10),wy+2+bob);ctx.rotate(0.25+Math.sin(T/300)*0.1);R(-12,-1,24,3,PAL.K);R(-11,-1,22,2,g.board);ctx.restore();

function drawHUD(){

}
function drawTrickBtn(){const g=G,ready=!!g&&g.phase==='ride'&&((g.air&&!g.trick)||(!g.air&&g.h>0.62));
  if(trickBtn.classList.contains('ready')!==ready)trickBtn.classList.toggle('ready',ready);}
function drawGame(){
  const g=G,s=g.spot,camX=Math.round(g.camX),tr=TR(),horizon=Math.max(40,tr-s.face-44);
  ctx.save();if(g.shake>0&&!reduceMotion)ctx.translate(Math.round((Math.random()-0.5)*4),Math.round((Math.random()-0.5)*4));

  if(g.inBarrel>0&&g.phase==='ride'){const curlS=g.W.curl-camX;ctx.globalAlpha=0.55;for(let k=0;k<16;k++){const u=k/16,x=curlS+44-u*40,y=screenY(g.W.curl+44,1)-Math.sin(u*Math.PI)*16;R(x,y,4,5,'#e8fbff');}ctx.globalAlpha=1;}

// ---------- main loop ----------
let last=0;
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-(last||now))/1000));last=now;T+=dt*1000;
  try{ctx.imageSmoothingEnabled=false;
    if(mode==='game'){update(dt);if(G)drawGame();}
    else if(mode==='results'&&G)drawGame();
    else drawMenu();
  }catch(e){console.error(e);window.__err=(window.__err||0)+1;window.__lastErr=String(e&&e.stack||e);}
  requestAnimationFrame(frame);
}
const SurfSesh=window.SurfSesh={version:'0.1',crew:CREW.map(c=>c.id),spots:SPOTS.map(s=>s.id),
  start(opts={}){startSession(opts);},onFinish:null,onExit:null,
  _state:()=>G,_step:dt=>update(dt),_press:pressTrick,_keys:keys,_touch:y=>{touch=y==null?null:{id:-1,y};}};
setUI();requestAnimationFrame(frame);

})();
