<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Snowcat Sessions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0d0718">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* One arcade screen that fills the display: the whole booth is drawn on the canvas, menus float over it. */
:root{
  --bg:#0d0718;--panel:#1b1030;--panel-edge:#3b2a63;--ink:#fff4e6;--dim:#a596c4;
  --carrot:#ff5c00;--pink:#ff4fd8;--cyan:#5fe8ff;--gold:#ffd23f;
  --font-pixel:'Press Start 2P','Courier New',monospace;--font-body:'VT323','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;position:fixed;inset:0;width:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{touch-action:manipulation}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:env(safe-area-inset-top,0px)}
.topbar{align-self:stretch;flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px max(8px, env(safe-area-inset-right, 0px)) 4px max(8px, env(safe-area-inset-left, 0px))}
.brand{font-family:var(--font-pixel);font-size:8px;letter-spacing:.08em;color:var(--carrot);text-shadow:2px 2px 0 #3a1200;white-space:nowrap}
.btns{display:flex;gap:6px;flex-wrap:nowrap}
.chip{font-family:var(--font-pixel);font-size:7px;letter-spacing:.06em;background:var(--panel);color:var(--ink);border:2px solid var(--panel-edge);padding:6px 8px;cursor:pointer}
.chip:hover{border-color:var(--cyan)}
.chip.on{border-color:var(--gold);color:var(--gold)}
.chip:focus-visible,.start:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{position:relative;flex:none;background:#000;max-width:100%;margin-block:auto}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:pointer}
.panel{position:absolute;left:4%;right:4%;bottom:3%;background:var(--panel);border:4px solid var(--ink);box-shadow:inset 0 0 0 3px #000,0 0 0 3px #000;padding:12px;display:grid;gap:10px}
.lbl{font-family:var(--font-pixel);font-size:8px;color:var(--dim);letter-spacing:.08em}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.status{font-size:clamp(17px,4.4vw,22px);color:var(--dim);line-height:1.05}
.status b{color:var(--gold);font-weight:normal}
.start{font-family:var(--font-pixel);font-size:12px;letter-spacing:.1em;background:var(--carrot);color:#fff;border:4px solid #fff;box-shadow:0 0 0 3px #000,0 5px 0 3px #000;padding:12px 16px;cursor:pointer;animation:pulse 1.1s steps(2) infinite}
.start:active{transform:translateY(3px)}
.start.quiet{animation:none;background:var(--panel);font-size:9px;padding:10px 12px}
@keyframes pulse{50%{background:var(--pink)}}
.tally{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:clamp(18px,4.6vw,23px);line-height:1.05}
.tally .v{text-align:right}
.tally .k{color:var(--dim)}
.tally .tot{color:var(--gold);font-family:var(--font-pixel);font-size:10px;padding-top:8px;border-top:2px dashed var(--panel-edge);margin-top:4px}
#fsMsg{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 44px);transform:translateX(-50%);z-index:40;width:min(86vw,320px);background:var(--panel);border:3px solid var(--gold);padding:10px;font-family:var(--font-pixel);font-size:8px;line-height:1.7;color:var(--ink);text-align:center}
@media (prefers-reduced-motion: reduce){.start{animation:none}}
</style>

<div id="app">
  <div class="topbar">
    <div class="brand">SNOWCAT SESSIONS</div>
    <div class="btns">
      <button class="chip" id="quitBtn" type="button" hidden>END SET</button>
      <button class="chip" id="fsBtn" type="button" hidden>FULL SCREEN</button>
      <button class="chip" id="muteBtn" type="button">SOUND: ON</button>
    </div>
  </div>
  <div class="screen" id="screen">
    <canvas id="cv" width="256" height="448" aria-label="Snowcat Sessions, a 16-bit DJ mini game inside the Disco Carrot booth"></canvas>
    <div class="panel" id="menu">
      <div class="lbl">DJ</div>
      <div class="row" id="crewRow"></div>
      <div class="lbl">GIG</div>
      <div class="row" id="gigRow"></div>
      <div class="status" id="menuStatus"></div>
      <div class="row"><button class="start" id="goBtn" type="button">PLAY A SET</button></div>
    </div>
    <div class="panel" id="results" hidden>
      <div class="tally" id="tally"></div>
      <div class="row" id="resBtns"></div>
    </div>
  </div>
</div>

<script>
// Jak soundtrack engine: 16-bit house and techno, all synthesized. makeJakMusic(audioContext, outputNode)
function makeJakMusic(ac,out){
  'use strict';
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  // signal chain: instruments -> bus -> warm lowpass -> glue compressor -> level -> out
  const bus=ac.createGain();
  const warm=ac.createBiquadFilter();warm.type='lowpass';warm.frequency.value=8500;warm.Q.value=0.4;
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=10;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.2;
  const level=ac.createGain();level.gain.value=1.4;
  bus.connect(warm);warm.connect(comp);comp.connect(level);level.connect(out);
  const duck=ac.createGain();duck.connect(bus); // melodic parts pump against the kick
  const echo=ac.createDelay(2),fb=ac.createGain(),ehp=ac.createBiquadFilter(),wet=ac.createGain();
  ehp.type='highpass';ehp.frequency.value=700;fb.gain.value=0.33;wet.gain.value=0.4;
  echo.connect(ehp);ehp.connect(fb);fb.connect(echo);ehp.connect(wet);wet.connect(bus);
  const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const pulse=w=>{const n=48,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*w);return ac.createPeriodicWave(re,im);};
  const P25=pulse(0.25),P12=pulse(0.125);

  function vco(type,f,t,stop,det){const o=ac.createOscillator();if(type==='p25')o.setPeriodicWave(P25);else if(type==='p12')o.setPeriodicWave(P12);else o.type=type;
    o.frequency.setValueAtTime(f,t);if(det)o.detune.value=det;o.start(t);o.stop(stop);return o;}
  function vca(t,v,dur,dest,attack=0.002){const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(dest);return g;}
  function nz(t,dur,ftype,freq,v,q=0.7,dest=bus){const s=ac.createBufferSource();s.buffer=nb;const f=ac.createBiquadFilter();f.type=ftype;f.frequency.value=freq;f.Q.value=q;
    s.connect(f);f.connect(vca(t,v,dur,dest,0.001));s.start(t,Math.random()*0.3);s.stop(t+dur+0.02);return f;}

  const I={
    kick(t,v){const o=vco('sine',155,t,t+0.42);o.frequency.exponentialRampToValueAtTime(47,t+0.11);o.connect(vca(t,v,0.38,bus,0.001));nz(t,0.012,'highpass',2600,v*0.25);
      duck.gain.cancelScheduledValues(t);duck.gain.setValueAtTime(0.28,t);duck.gain.linearRampToValueAtTime(1,t+0.22);},
    clap(t,v){[0,0.011,0.022].forEach(d=>nz(t+d,0.018,'bandpass',1400,v*0.7,0.9));nz(t+0.03,0.16,'bandpass',1250,v*0.45,0.8);},
    hat(t,v,open){nz(t,open?0.17:0.035,'highpass',open?7000:8200,v);},
    crash(t,v){nz(t,1.7,'highpass',3800,v);},
    riser(t,dur,v){const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=2.5;
      f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(7000,t+dur);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+dur);g.gain.linearRampToValueAtTime(0.0001,t+dur+0.03);
      s.connect(f);f.connect(g);g.connect(bus);s.start(t);s.stop(t+dur+0.05);},
    tom(t,v){const o=vco('sine',210,t,t+0.2);o.frequency.exponentialRampToValueAtTime(85,t+0.16);o.connect(vca(t,v,0.18,bus));},
    bass(t,m,dur,o){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=o.q||1;const c=o.cut||600;
      f.frequency.setValueAtTime(Math.min(16000,c*(o.acc?3.2:1.8)),t);f.frequency.exponentialRampToValueAtTime(Math.max(70,c*0.55),t+dur);
      vco(o.type||'square',mtof(m),t,t+dur+0.03).connect(f);f.connect(vca(t,o.v||0.25,dur,duck,0.004));},
    stab(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(3400,t);f.frequency.exponentialRampToValueAtTime(800,t+dur);
      const g=vca(t,v*1.6,dur,duck,0.003);f.connect(g);ms.forEach((m,j)=>vco('p25',mtof(m),t,t+dur+0.03,j%2?7:-7).connect(f));},
    pad(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1100;const g=ac.createGain();
      g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.35);g.gain.setValueAtTime(v,t+dur*0.75);g.gain.linearRampToValueAtTime(0.0001,t+dur);
      f.connect(g);g.connect(duck);ms.forEach((m,j)=>vco('sawtooth',mtof(m),t,t+dur+0.05,j%2?9:-9).connect(f));},
    lead(t,m,dur,v){const o=vco('p12',mtof(m),t,t+dur+0.05);const g=vca(t,v,dur,bus,0.004);o.connect(g);g.connect(echo);},
    bell(t,m,dur,v){const o=vco('triangle',mtof(m),t,t+dur+0.05),o2=vco('p25',mtof(m+12),t,t+dur*0.5);const g=vca(t,v,dur,bus,0.002);o.connect(g);o2.connect(vca(t,v*0.25,dur*0.5,g));g.connect(echo);},
    tri(t,m,dur,v){vco('triangle',mtof(m),t,t+dur+0.05).connect(vca(t,v,dur,bus,0.01));},
    snare(t,v){nz(t,0.16,'bandpass',1900,v*0.7,0.7);const o=vco('triangle',200,t,t+0.1);o.frequency.exponentialRampToValueAtTime(150,t+0.08);o.connect(vca(t,v*0.5,0.09,bus));},
    saw3(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=3600;const g=vca(t,v,dur,duck,0.004);f.connect(g);g.connect(echo);
      for(const m of ms)for(const d of [-14,0,14])vco('sawtooth',mtof(m),t,t+dur+0.03,d).connect(f);},
    wobble(t,m,dur,rate,v){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=9;f.frequency.value=650;
      const lfo=vco('sine',rate,t,t+dur+0.05),lg=ac.createGain();lg.gain.value=560;lfo.connect(lg);lg.connect(f.frequency);
      vco('sawtooth',mtof(m),t,t+dur+0.03).connect(f);vco('square',mtof(m-12),t,t+dur+0.03,5).connect(f);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.setValueAtTime(v,t+dur-0.03);g.gain.linearRampToValueAtTime(0.0001,t+dur);f.connect(g);g.connect(duck);
      vco('sine',mtof(m-12),t,t+dur+0.03).connect(vca(t,v*0.9,dur,duck,0.01));},
    reese(t,m,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=2;f.frequency.value=520;
      vco('sawtooth',mtof(m),t,t+dur+0.03,-18).connect(f);vco('sawtooth',mtof(m),t,t+dur+0.03,18).connect(f);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.02);g.gain.setValueAtTime(v,t+dur*0.85);g.gain.linearRampToValueAtTime(0.0001,t+dur);f.connect(g);g.connect(duck);
      vco('sine',mtof(m-12),t,t+dur+0.03).connect(vca(t,v*0.8,dur,duck,0.01));},
    // house piano: bright hammer on top of a soft body
    piano(t,ms,dur,v){const g=vca(t,v,dur,duck,0.002);const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(5200,t);f.frequency.exponentialRampToValueAtTime(1400,t+dur);f.connect(g);
      ms.forEach((m,j)=>{vco('triangle',mtof(m),t,t+dur+0.03,j%2?4:-4).connect(f);vco('p25',mtof(m+12),t,t+0.09).connect(vca(t,0.5,0.08,f));});},
    // electric piano for garage and liquid: sine plus a little bell, slow tremolo
    keys(t,ms,dur,v){const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(duck);
      const tr=vco('sine',5,t,t+dur+0.05),tg=ac.createGain();tg.gain.value=v*0.35;tr.connect(tg);tg.connect(g.gain);
      ms.forEach(m=>{vco('sine',mtof(m),t,t+dur+0.03).connect(g);vco('triangle',mtof(m+12),t,t+0.25).connect(vca(t,0.25,0.22,g));});},
    sub(t,m,dur,v){const o=vco('sine',mtof(m),t,t+dur+0.03);const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.setValueAtTime(v,t+dur*0.8);g.gain.linearRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(duck);},
    cowbell(t,v){const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=800;f.Q.value=3;const g=vca(t,v,0.16,bus,0.001);f.connect(g);vco('square',540,t,t+0.2).connect(f);vco('square',800,t,t+0.2).connect(f);},
    rim(t,v){nz(t,0.02,'bandpass',3200,v,4);vco('triangle',1700,t,t+0.03).connect(vca(t,v*0.5,0.025,bus));},
    shaker(t,v){nz(t,0.05,'bandpass',9000,v,1.5);},
    snap(t,v){nz(t,0.03,'bandpass',2600,v,2);nz(t+0.004,0.05,'highpass',5000,v*0.4);},
    ride(t,v){nz(t,0.45,'bandpass',6500,v,1.2);vco('square',4100,t,t+0.4).connect(vca(t,v*0.12,0.35,bus));},
    brush(t,v,dur){nz(t,dur,'bandpass',3600,v,0.6);},
    // rumble kick for warehouse techno: kick plus a dark, washed-out tail
    rumble(t,v){const o=vco('sine',52,t,t+0.5);o.frequency.exponentialRampToValueAtTime(44,t+0.45);const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=140;o.connect(f);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.06);g.gain.exponentialRampToValueAtTime(0.0001,t+0.45);f.connect(g);g.connect(bus);nz(t,0.3,'lowpass',220,v*0.5);},
    // muted lounge sax for the slots: buzzy reed through a soft filter with vibrato
    sax(t,m,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=2;f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(1900,t+0.06);f.frequency.exponentialRampToValueAtTime(1100,t+dur);
      const a=vco('sawtooth',mtof(m),t,t+dur+0.05),b=vco('square',mtof(m),t,t+dur+0.05,6);const lfo=vco('sine',5.2,t,t+dur+0.05),lg=ac.createGain();lg.gain.value=0;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(14,t+Math.min(0.35,dur));lfo.connect(lg);lg.connect(a.detune);lg.connect(b.detune);
      a.connect(f);b.connect(f);const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.035);g.gain.setValueAtTime(v*0.85,t+dur*0.8);g.gain.linearRampToValueAtTime(0.0001,t+dur);f.connect(g);g.connect(bus);g.connect(echo);},
    upright(t,m,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(1100,t);f.frequency.exponentialRampToValueAtTime(260,t+dur);
      vco('triangle',mtof(m),t,t+dur+0.03).connect(f);vco('sine',mtof(m),t,t+dur+0.03).connect(f);f.connect(vca(t,v,dur,bus,0.006));nz(t,0.03,'bandpass',300,v*0.3,2);}
  };

  const SONGS={
    // opening story: gentle arpeggios, no drums
    story:{bpm:84,swing:0,play(s,t,spb){
      const C=[{r:45,a:[69,72,76,81]},{r:41,a:[65,69,72,77]},{r:38,a:[62,65,69,74]},{r:40,a:[64,68,71,76]}];
      const i=s%16,c=C[Math.floor(s/16)%4];
      if(i===0)I.pad(t,c.a.slice(0,3).map(m=>m-12),spb*16,0.03);
      if(i%8===0)I.tri(t,c.r+12,1.1,0.32);
      if(i%2===0)I.bell(t,c.a[(i/2)%4],0.35,0.07);
    }},
    // tour map: laid-back deep house, 116 BPM
    map:{bpm:116,swing:0.14,play(s,t,spb){
      const CH=[[53,57,60,64],[52,55,59,62],[50,53,57,60],[57,60,64,67]],RT=[41,40,38,45],BL={0:0,3:0,6:12,10:7,13:0};
      const p=Math.floor(s/16)%16,i=s%16,k=Math.floor(s/16)%4;
      if(p>=2&&i%4===0)I.kick(t,0.8);
      if(p>=4&&(i===4||i===12))I.clap(t,0.3);
      if(i%4===2)I.hat(t,0.11,true);else if(i%2===1)I.hat(t,0.04,false);
      if(BL[i]!==undefined)I.bass(t,RT[k]+BL[i],spb*1.5,{type:'square',cut:520,v:0.24});
      if(i===2||i===7||i===10)I.stab(t,CH[k],spb*1.6,0.05);
      if(i===0)I.pad(t,CH[k],spb*16,0.03);
      if(p>=8&&i%4===0)I.bell(t,CH[k][(i/4)%4]+12,spb*2.5,0.06);
    }},
    // Marshall Mountain: bouncy piano-stab house, 122 BPM
    disco:{bpm:122,swing:0.08,play(s,t,spb,H){
      const CH=[[57,60,64],[57,60,65],[55,60,64],[55,59,62]],RT=[45,41,48,43];
      const L=[{0:76,3:74,6:72,8:69,11:72,14:74},{0:72,2:69,4:67,6:69,10:64},{0:76,3:79,6:76,8:74,11:72,14:74},{0:71,2:74,4:79,6:76}];
      const p=Math.floor(s/16)%32,i=s%16,k=Math.floor(s/16)%4,brk=p>=16&&p<20,drop=p>=20&&p<28;
      if(!brk){
        if(i%4===0)I.kick(t,0.9);
        if(i===4||i===12)I.clap(t,0.55);else if(H&&i%4===0)I.clap(t,0.25);
        if(i%4===2)I.hat(t,0.15,true);else if(i%2===1||H)I.hat(t,0.06,false);
      }else{
        if(p===18&&i===0)I.riser(t,spb*32,0.2);
        if(p===19){const r=i<8?4:(i<12?2:1);if(i%r===0)I.clap(t,0.2+i*0.025);}
      }
      if(p===20&&i===0)I.crash(t,0.28);
      if((!brk||p>=18)&&i%2===0)I.bass(t,RT[k]+(i%4===2?12:0),spb*1.6,{type:'square',cut:H?1500:720,v:0.24});

// ---------- decks ----------
// EQ knob position 0..1: 0 = killed, 0.75 = flat (12 o'clock), 1 = +6 dB
function eqDb(v){return v>=0.75?(v-0.75)/0.25*6:v<0.03?-40:-40*(1-v/0.75);}
function mkDeck(id){return{id,eng:null,inNode:null,hi:null,mid:null,low:null,xf:null,track:null,playing:false,pitch:0,nudge:1,cuePos:0,held:false,
  eq:{hi:0.75,mid:0.75,low:0.75},vol:1,timeLeft:0,played:0,
  get lowOn(){return this.eq.low>0.5;},set lowOn(v){this.eq.low=v?0.75:0;},
  bpm(){return this.track?this.track.bpm*(1+this.pitch):0;},
  beats(){return this.playing&&this.eng?this.eng.pos(anow()):null;},
  apply(){if(this.eng&&this.track)this.eng.setRate((1+this.pitch)*this.nudge);const t=anow();
    if(this.hi){this.hi.gain.setTargetAtTime(eqDb(this.eq.hi),t,0.012);this.mid.gain.setTargetAtTime(eqDb(this.eq.mid),t,0.012);this.low.gain.setTargetAtTime(eqDb(this.eq.low),t,0.012);}}};}
const decks=[mkDeck(0),mkDeck(1)];
let M=decks[0],I=decks[1]; // M: the main track the crowd hears; I: the incoming deck you're cueing up
let xfade=0; // crossfader: 0 = left deck, 1 = right deck
function xfGain(d){const a=xfade*Math.PI/2;return d.id===0?Math.cos(a):Math.sin(a);}
function toward(d){return d.id===0?1-xfade:xfade;} // 1 when the crossfader sits on this deck's side
function eff(d){return d.playing?d.vol*xfGain(d):0;} // how loud this deck is in the speakers
function applyXf(){decks.forEach(d=>{if(d.xf)d.xf.gain.setTargetAtTime(d.playing?d.vol*xfGain(d):0,anow(),0.01);});}
function deckPlay(d){ // start from the cue position, to a fraction of a step, so the phase you set by hand is kept
  const now=anow(),fs=Math.max(0,d.cuePos||0),rate=(1+d.pitch)*d.nudge,spb=60/(d.track.bpm*rate)/4;
  d.eng.setRate(rate);
  if(fs<0.001)d.eng.setSong(d.track.song,now,0,true);
  else{const n1=Math.floor(fs)+1;d.eng.setSong(d.track.song,now+(n1-fs)*spb-0.06,n1,true);}
  d.playing=true;d.apply();applyXf();}
function deckStop(d){if(d.eng)d.eng.setSong(null,anow());d.playing=false;applyXf();}
function deckPause(d){if(!d.playing)return;d.cuePos=Math.max(0,(d.beats()||0)*4);deckStop(d);}
function resetDeck(d){d.eq={hi:0.75,mid:0.75,low:0.75};d.vol=1;d.cuePos=0;d.held=false;d.played=0;d.pitch=0;d.nudge=1;d.apply();}

function mixableNow(t){return Math.abs(t.bpm/(M.bpm()||M.track.bpm)-1)<=PITCH_RANGE-0.004;} // reachable with the pitch fader from the main deck's current tempo
function openCrate(delay){
  // every card can be beatmatched: within about 4% of the main deck's current tempo (the pitch fader goes to 8%)
  const cur=M.track,mb=M.bpm()||cur.bpm,recent=B.recent||[];
  const near=lim=>LIB.filter(t=>t.song!==cur.song&&Math.abs(t.bpm/mb-1)<=lim);
  let pool=near(0.04);if(pool.length<3)pool=near(0.06);if(pool.length<3)pool=near(0.075);
  const fresh=pool.filter(t=>!recent.includes(t.song));if(fresh.length>=3)pool=fresh;
  let cards=[];
  cards=cards.concat(pool.filter(t=>!cards.includes(t)).sort(()=>Math.random()-0.5).slice(0,8-cards.length));
  cards.sort((a,b)=>a.bpm-b.bpm||a.en-b.en);
  let best=0;cards.forEach((c,i)=>{if(Math.abs(c.bpm-mb)<Math.abs(cards[best].bpm-mb))best=i;});
  const off=clamp(best-1,0,Math.max(0,cards.length-3));
  B.crate={cards:cards.map(mkTrack),t:-(delay||0),off,target:off,drag:false};
}
function crateMax(){return Math.max(0,B.crate.cards.length-3);}
function chooseCard(k){
  const c=B.crate&&B.crate.cards[k];if(!c||B.crate.t<0.25)return;
  B.crate.cards.forEach((o,i)=>{if(i!==k)usedTitles.delete(o.title);});
  B.crate=null;I.track=c;waveOf(c.song);resetDeck(I);I.lowOn=false;I.apply();sfx.load();
  B.recent=[...(B.recent||[]),c.song].slice(-4);
  B.mix={cut:!mixableNow(c),overlap:0,q:0,wreck:0,mud:0,drop:null,startAt:null,t:0};
  if(B.dead){B.mix.cut=true;}
}
function judgeOne(d){ // how far (in beats) the deck is from the downbeat of its bar, as the player HEARS it
  let b=d.beats();if(b==null)return 9;
  // phones and Bluetooth speakers play sound a little after the game's clock; judge against what's coming out of the speaker
  const lat=A.ac?(A.ac.outputLatency||0)+(A.ac.baseLatency||0):0;b-=lat*(d.bpm()*d.nudge)/60;
  const bp=((b%4)+4)%4;return Math.min(bp,4-bp);
}
function pressPlay(d){
  if(mode!=='booth'||!B||B.over)return;
  if(!d.track){floatText(d.id?208:48,DY-8,B.crate?'PICK A TRACK FIRST':'NO TRACK','#ffd23f');return;}
  if(d===M&&M.timeLeft<=0)return; // that track has ended
  sfx.click();
  if(d.playing){deckPause(d);return;}
  if(d===I){
    const mx=B.mix;
    if(mx&&(mx.cut||B.dead)){ // too far apart in tempo, or the main track ended: slam it in on the one
      const off=B.dead?0.5:judgeOne(M);
      deckPlay(I);I.lowOn=true;I.vol=1;I.apply();xfade=I.id;deckStop(M);applyXf();
      mx.drop=off<0.25?'perfect':off<0.5?'good':'off';
      completeMix(B.dead?'dead':'cut');return;}
    deckPlay(I);if(mx&&mx.startAt==null)mx.startAt=judgeOne(M);return;}
  deckPlay(d); // resume the main deck where it paused
}
function setEq(d,band,v){
  if(mode!=='booth'||!B||B.over)return;
  const was=d.lowOn;d.eq[band]=clamp(v,0,1);d.apply();
  if(band==='low'&&!was&&d.lowOn)bassIn(d);
}
function toggleEq(d,band){setEq(d,band,d.eq[band]>0.2?0:0.75);sfx.click();}
function toggleLow(d){toggleEq(d,'low');}
function bassIn(d){
  const mx=B.mix;
  if(d===I&&I.playing&&M.playing&&M.lowOn){M.lowOn=false;M.apply();} // bass swap
  if(d===I&&mx&&I.playing&&mx.drop==null&&eff(I)>=0.35){
    // counts if it lands on either track's "one", so a drop on the main track's downbeat is never marked wrong
    const off=Math.min(judgeOne(I),M.playing?judgeOne(M):9);
    if(off<0.25){mx.drop='perfect';B.E+=12;B.score+=150;B.perfects++;setBanner('PERFECT DROP!','',PAL.O,1.6);sfx.cheer(true);handsUp(1.4);B.shake=0.3;B.flash=0.7;}
    else if(off<0.5){mx.drop='good';B.E+=5;setBanner('NICE DROP','',PAL.Y,1.2);sfx.cheer(false);handsUp(0.8);}
    else{mx.drop='off';B.E-=4;setBanner('OFF THE ONE','WAIT FOR THE ORANGE LIGHT','#ff6b6b',1.6);sfx.wince();wince();}
  }
}
function phaseDiff(){const a=M.beats(),b=I.beats();if(a==null||b==null)return null;let d=(b-a)%1;d=((d%1)+1.5)%1-0.5;return d;}
function handsUp(s){B.guests.forEach(g=>{if(g.st==='dance'||Math.random()<0.4)g.hands=s*(0.6+Math.random()*0.6);});}
function wince(){B.guests.forEach(g=>{if(g.st==='dance')g.wince=0.9;});}
function setBanner(text,sub,col,dur){B.banner={text,sub,col,t:dur,d:dur};}
function floatText(x,y,text,col){B.floats.push({x,y,text,col,t:1.3});}
function completeMix(kind){
  const mx=B.mix||{overlap:0,q:0,wreck:0,mud:0,drop:null};
  let pts,label='';
  if(kind==='cut'){pts=mx.drop==='perfect'?72:mx.drop==='good'?50:20;label='CUT';}
  else if(kind==='dead'||kind==='forced'){pts=10;label=kind==='dead'?'DEAD AIR':'RAN OUT OF TRACK';}
  else{
    const avgQ=mx.overlap>0?mx.q/mx.overlap:0.4;
    pts=avgQ*60*(mx.overlap<3?0.7:1)+(mx.drop==='perfect'?30:mx.drop==='good'?16:mx.drop==='off'?0:6)-mx.mud*4-mx.wreck*3;
    const bar=I.beats()!=null&&M.beats()!=null?(((I.beats()-M.beats())%4)+4)%4:2;if(Math.min(bar,4-bar)<0.15){pts+=10;label='PHRASED';}
  }
  pts=clamp(Math.round(pts),0,100);
  const g=pts>=90?'S':pts>=75?'A':pts>=55?'B':pts>=35?'C':'D';
  B.grades.push(g);B.score+=pts*10;
  // what the crowd thinks of the pick
  const prev=M.track,nt=I.track,step=nt.en-prev.en;
  let sel=0,why='';
  if(step===1){sel=6;why='BUILDING';}
  else if(step===0){sel=prev.en>=4?4:1;why=prev.en>=4?'KEEP IT UP':'';}
  else if(step===2){sel=-2;why='BIG JUMP';}
  else if(step>2){sel=-10;why='TOO MUCH TOO SOON';}
  else if(step===-1){sel=B.mixes>=SET_MIXES-1?3:-4;why=B.mixes>=SET_MIXES-1?'COOL DOWN':'ENERGY DIP';}
  else{sel=-10;why='CLEARED THE FLOOR';}
  const gE={S:14,A:10,B:5,C:0,D:-8}[g];
  B.E+=sel+gE;
  // swap roles: the incoming deck is now the main one
  if(M.playing)deckStop(M);
  const old=M;M=I;I=old;I.track=null;I.lowOn=true;I.pitch=0;I.nudge=1;I.apply();
  M.timeLeft=Infinity;M.lowOn=true;M.apply();M.nudge=1;M.apply();
  xfade=M.id;applyXf();if(B.hype)M.eng.setHype(true,anow());
  B.mixes++;B.dead=false;B.mix=null;
  setBanner(`MIX ${B.mixes}: ${g}`,[label,why].filter(Boolean).join(' / '),g==='S'||g==='A'?PAL.Y:g==='D'?'#ff6b6b':'#ffffff',2.2);sfx.grade(g);
  if(B.mixes>=SET_MIXES){B.last=true;M.timeLeft=18+(crewId==='bk'?10:0);setTimeout(()=>{if(B&&!B.over)setBanner('LAST TRACK!','BRING IT HOME',PAL.O,2);},2300);}
  else openCrate(1.6);
}

// ---------- booth update ----------
function updBooth(dt){
  const b=B;
  if(b.banner&&(b.banner.t-=dt)<=0)b.banner=null;
  b.floats=b.floats.filter(f=>(f.t-=dt)>0);
  b.parts=b.parts.filter(p=>(p.life-=dt)>0);b.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=60*dt;});
  if(b.flash>0)b.flash-=dt*1.5;if(b.shake>0)b.shake-=dt;
  if(b.crate){b.crate.t+=dt;if(!b.crate.drag)b.crate.off+=(b.crate.target-b.crate.off)*Math.min(1,dt*12);}
  // held controls (jog nudges, keyboard pitch and crossfader)
  const kn=(keys.ArrowLeft?-1:0)+(keys.ArrowRight?1:0);
  decks.forEach(d=>{let n=1;if(d===I&&kn&&!B.crate)n=kn<0?0.94:1.06;d.nudge=n;
    if(d.eng&&d.track&&d.playing)d.eng.setRate((1+d.pitch)*d.nudge);});
  const kp=(keys.ArrowUp?-1:0)+(keys.ArrowDown?1:0);if(kp&&I.track){I.pitch=clamp(I.pitch+kp*0.008*dt,-PITCH_RANGE,PITCH_RANGE);}
  const kx=(keys[',']||keys['<']?-1:0)+(keys['.']||keys['>']?1:0);if(kx){xfade=clamp(xfade+kx*1.1*dt,0,1);applyXf();}
  decks.forEach(d=>{if(d.playing)d.played+=dt;});
  if(I.track&&M.track&&!kp&&!Object.values(drags).some(r=>r.k==='pitch'&&r.d===I)){
    const want=clamp(M.bpm()/I.track.bpm-1,-PITCH_RANGE,PITCH_RANGE);if(Math.abs((want-I.pitch)*I.track.bpm)<0.4&&want!==I.pitch){I.pitch+=(want-I.pitch)*Math.min(1,dt*8);if(Math.abs((want-I.pitch)*I.track.bpm)<0.005)I.pitch=want;}}
  if(b.over){b.overT+=dt;updCrowd(dt);b.roses.forEach(r=>{if(r.y<r.ty){r.vy+=200*dt;r.y=Math.min(r.ty,r.y+r.vy*dt);}});if(b.overT>4.2&&!b.shown){b.shown=1;showResults();}return;}
  // the main track runs down
  if(M.playing&&b.last){M.timeLeft-=dt;
    if(M.timeLeft<=0){
      if(b.last){endSet(false);return;}
      if(I.playing){B.mix=B.mix||{};completeMix('forced');setBanner('RAN OUT OF TRACK!','KEEP AN EYE ON THE CLOCK','#ff6b6b',2.2);sfx.wince();wince();}
      else{deckStop(M);b.dead=true;setBanner('TRACK ENDED!','GET THE NEXT ONE PLAYING','#ff6b6b',2.4);sfx.wince();wince();}
    }}
  // mix in progress: judge the blend while both decks are in the speakers
  const mx=b.mix;
  if(mx&&I.playing&&M.playing){
    mx.t+=dt;const gM=eff(M),gI=eff(I);
    if(gM>0.25&&gI>0.25){
      const pd=Math.abs(phaseDiff()||0),te=Math.abs(M.bpm()-I.bpm());
      const q=clamp(1-Math.max(0,pd-0.04)/0.26,0,1)*clamp(1-te/2,0,1);mx.overlap+=dt;mx.q+=q*dt;
      const wreck=pd>0.24||te>1.5;
      if(wreck){mx.wreck+=dt;b.E-=dt*(crewId==='ritz'?3:6);b.wreckT=(b.wreckT||0)+dt;if(b.wreckT>1.2&&!b.wreckShown){b.wreckShown=1;setBanner('TRAINWRECK!','MATCH THE BEATS','#ff6b6b',1.4);sfx.wince();wince();}}
      else{b.wreckT=0;b.wreckShown=0;}
      if(M.lowOn&&I.lowOn&&gM>0.35&&gI>0.35){mx.mud+=dt;b.E-=dt*(crewId==='ritz'?2:4);if(!b.mudShown){b.mudShown=1;floatText(128,WIN.y+50,'MUDDY BASS!','#ff9a4d');}}else b.mudShown=0;
    }
  }
  if(mx&&I.playing&&I.lowOn&&eff(I)>=0.8&&eff(M)<=0.08)completeMix('blend');
  // nothing coming out of the speakers
  const out=decks.reduce((t,d)=>t+eff(d),0);
  if(out<0.12){b.silentT=(b.silentT||0)+dt;b.E-=dt*10;if(b.silentT>0.6&&!b.silentShown&&!b.dead){b.silentShown=1;setBanner('DEAD AIR!','GET SOMETHING PLAYING','#ff6b6b',2);sfx.wince();wince();}}
  else{b.silentT=0;b.silentShown=0;}
  // floor energy drifts toward what the main track can hold
  let target=0;
  if(M.playing){target=18+M.track.en*14-Math.max(0,M.played-75)*0.6;if(b.hype)target+=4;}
  const down=crewId==='bk'?0.9:1.6;
  b.E+=(target-b.E)*Math.min(1,dt*(target<b.E?down:1.6)/30);
  b.E=clamp(b.E,0,100);
  // hype
  const thr=crewId==='zoo'?75:85;
  if(!b.hype&&b.E>=thr){b.hype=true;b.hypeT=0;M.eng.setHype(true,anow());setBanner('THE FLOOR IS ON FIRE!','',PAL.O,1.8);sfx.cheer(true);handsUp(1.5);}
  else if(b.hype&&b.E<thr-15){b.hype=false;decks.forEach(d=>{if(d.eng)d.eng.setHype(false,anow());});}
  if(b.hype)b.hypeT+=dt;
  updCrowd(dt);
  const dancers=b.guests.filter(g=>g.st==='dance').length;b.peak=Math.max(b.peak,dancers);
  b.score+=dancers*dt;
}
function updCrowd(dt){
  const b=B,f=clamp((b.E-12)/65,0,1),beat=M.playing&&M.track?60000/M.bpm():520;
  b.spawnT-=dt;
  if(b.spawnT<=0&&b.guests.length<28&&!b.over){b.spawnT=4.6-3.4*b.E/100+Math.random()*1.2;if(b.E>8||b.guests.length<8)newGuest(true);}
  for(const g of b.guests){
    g.y=WIN.y+WIN.h-g.yb;g.beatMs=beat/(g.th<0.3?2:1);if(g.hands>0)g.hands-=dt;if(g.wince>0)g.wince-=dt;
    if(g.st==='walk'){const d=g.tx-g.x;g.x+=Math.sign(d)*Math.min(Math.abs(d),34*dt);if(Math.abs(d)<1){g.st='watch';}continue;}
    if(g.st==='leave'){g.x+=g.dir*34*dt;continue;}
    if(g.st==='watch'&&f>g.th+0.03)g.st='dance';else if(g.st==='dance'&&f<g.th-0.03)g.st='watch';
    if(b.E<18&&g.st==='watch'&&g.th>0.45&&Math.random()<dt*0.07){g.st='leave';g.dir=g.x<128?-1:1;}
  }
  b.guests=b.guests.filter(g=>g.x>WIN.x-14&&g.x<WIN.x+WIN.w+14);
}

// ---------- what to do next (shown under the desk) ----------
function nextStep(){
  const b=B;if(!b||b.over)return{text:'',ctl:null};
  if(b.dead&&!I.track)return{text:'PICK A TRACK, FAST!',ctl:'crate'};
  if(b.crate)return{text:b.crate.t<0?'LET IT RIDE...':'PICK THE NEXT TRACK',ctl:b.crate.t<0?null:'crate'};
  if(!M.playing&&!M.held&&M.track&&M.timeLeft>0&&!I.playing)return{text:'PRESS PLAY TO KEEP IT GOING',ctl:'playM'};
  if(b.last)return{text:'LAST TRACK. ENJOY IT!',ctl:null};
  const mx=b.mix;if(!mx||!I.track)return{text:'',ctl:null};
  if(!I.playing){if(b.dead)return{text:'PRESS PLAY NOW!',ctl:'play'};if(mx.cut)return{text:'TOO FAR: CUT IT IN ON THE ONE',ctl:'play'};
    if(Math.abs(M.bpm()-I.bpm())>0.2)return{text:'MATCH THE BPM WITH PITCH',ctl:'pitch'};
    return{text:'PRESS PLAY ON THE ONE',ctl:'play'};}
  const te=Math.abs(M.bpm()-I.bpm());
  if(M.playing&&te>0.2)return{text:'MATCH THE BPM WITH PITCH',ctl:'pitch'};
  const pd=Math.abs(phaseDiff()||0);
  if(M.playing&&pd>0.08&&eff(I)<0.5)return{text:'LINE UP BEATS: HOLD/SPIN JOG',ctl:'jog'};
  if(eff(I)<0.4)return{text:I.vol<0.5?'BRING UP THE VOLUME FADER':'BRING IT IN: CROSSFADER',ctl:I.vol<0.5?'fader':'xf'};
  if(!I.lowOn)return{text:'DROP THE BASS ON THE ONE',ctl:'low'};
  return{text:'BRING IT ALL THE WAY OVER',ctl:'xf'};
}

  if(B.flash>0){ctx.globalAlpha=Math.max(0,B.flash)*0.5;R(0,0,W,H,'#ffe8ff');ctx.globalAlpha=1;}
}

// ---------- menu scene ----------
function drawMenu(){
  const g=H-150;drawOutside(g,{door:0});snowfall(T,40,0.025);
  txt('SNOWCAT',112,16,PAL.O,16,'center');txt('SESSIONS',112,38,PAL.O,16,'center');txt('A LEGEND OF JAK MINI GAME',128,66,'#ffffff',8,'center');
  const c=CREW_BY[selCrew];R(198,8,54,54,PAL.K);R(200,10,50,50,PAL.Y);drawPortrait(201,11,2,c.port);
}

// ---------- input ----------
const keys={};
function toCanvas(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
const inCirc=(p,c,pad=4)=>Math.hypot(p.x-c.cx,p.y-c.cy)<=c.r+pad;
const inRect=(p,r,pad=3)=>p.x>=r.x-pad&&p.x<=r.x+r.w+pad&&p.y>=r.y-pad&&p.y<=r.y+r.h+pad;
const drags={};
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();const p=toCanvas(e);
  if(mode==='intro'){enterBooth();return;}
  if(mode!=='booth'||!B||B.over)return;
  const cr=B.crate;
  if(cr&&cr.t>=0.25&&p.y>=WIN.y+12&&p.y<=WIN.y+98){drags[e.pointerId]={k:'crate',x0:p.x,off0:cr.off,moved:false};cr.drag=true;cvCap(e);return;}
  const q={x:p.x,y:p.y-DY-WF_H};
  for(const d of decks){
    if(inCirc(q,CTL.play(d))){pressPlay(d);return;}
    for(const band of ['hi','mid','low']){if(inCirc(q,CTL[band](d),3)){drags[e.pointerId]={k:'eq',d,band,y0:q.y,v0:d.eq[band],moved:false};cvCap(e);return;}}
    if(inRect(q,CTL.fader(d),2)){drags[e.pointerId]={k:'vol',d};cvCap(e);moveVol(d,q);return;}
    if(inRect(q,CTL.pitch(d),4)&&d.track){drags[e.pointerId]={k:'pitch',d,y:q.y};cvCap(e);return;}
    const j=CTL.jog(d);if(inCirc(q,j,2)&&d.track){ // touching the platter holds the track still
      const was=d.playing;if(was)deckPause(d);d.held=true;sfx.click();
      drags[e.pointerId]={k:'jog',d,a:Math.atan2(q.y-j.cy,q.x-j.cx),was};cvCap(e);return;}
  }
  if(inRect(q,CTL.xf,6)){drags[e.pointerId]={k:'xf'};cvCap(e);moveXf(q);return;}
});
function cvCap(e){try{cv.setPointerCapture(e.pointerId);}catch(_){}}
function moveVol(d,p){const f=CTL.fader(d);d.vol=clamp(1-(p.y-f.y-6)/(f.h-12),0,1);applyXf();}
function moveXf(p){const c=CTL.xf;xfade=clamp((p.x-c.x-7)/(c.w-14),0,1);applyXf();}
cv.addEventListener('pointermove',e=>{const dr=drags[e.pointerId];if(!dr||!B)return;const p=toCanvas(e),q={x:p.x,y:p.y-DY-WF_H};
  if(dr.k==='crate'){const cr=B.crate;if(!cr)return;const dx=p.x-dr.x0;if(Math.abs(dx)>4)dr.moved=true;cr.off=clamp(dr.off0-dx/78,-0.3,crateMax()+0.3);}
  else if(dr.k==='xf')moveXf(q);
  else if(dr.k==='pitch'){const dy=q.y-dr.y;dr.y=q.y;dr.d.pitch=clamp(dr.d.pitch+dy*0.0006,-PITCH_RANGE,PITCH_RANGE);dr.d.apply();}
  else if(dr.k==='vol')moveVol(dr.d,q);
  else if(dr.k==='eq'){const dy=q.y-dr.y0;if(Math.abs(dy)>3)dr.moved=true;if(dr.moved)setEq(dr.d,dr.band,dr.v0-dy*0.014);}
  else if(dr.k==='jog'){ // turning the held platter moves the track: one full turn = one bar
    const d=dr.d,j=CTL.jog(d),a=Math.atan2(q.y-j.cy,q.x-j.cx);let da=a-dr.a;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;dr.a=a;
    const before=Math.floor(d.cuePos/4);d.cuePos=Math.max(0,d.cuePos+da/(Math.PI/8));if(Math.floor(d.cuePos/4)!==before)sfx.click();}});
function endDrag(e){const dr=drags[e.pointerId];if(!dr)return;delete drags[e.pointerId];if(!B)return;
  if(dr.k==='jog'){const d=dr.d;d.held=false;if(dr.was&&mode==='booth'&&!B.over&&d.track&&!(d===M&&M.timeLeft<=0))deckPlay(d);}
  else if(dr.k==='eq'&&!dr.moved)toggleEq(dr.d,dr.band);
  else if(dr.k==='crate'){const cr=B.crate;if(!cr)return;cr.drag=false;const mx=crateMax();
    if(dr.moved){cr.target=clamp(Math.round(cr.off),0,mx);return;}
    const p=toCanvas(e);
    if(p.x<WIN.x+12&&cr.off>0.05){cr.target=clamp(Math.round(cr.off)-1,0,mx);return;}
    if(p.x>WIN.x+WIN.w-12&&cr.off<mx-0.05){cr.target=clamp(Math.round(cr.off)+1,0,mx);return;}
    const fk=(p.x-WIN.x-6)/78+cr.off,k=Math.floor(fk);if(k>=0&&k<cr.cards.length&&(fk-k)*78<=72&&p.y>=WIN.y+18&&p.y<=WIN.y+86)chooseCard(k);}}
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;
  if(mode==='booth'&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(e.repeat)return;
  if(mode==='intro'&&(k===' '||k==='Enter')){enterBooth();return;}
  if(mode==='menu'&&k==='Enter'&&document.activeElement===document.body){startSet();return;}
  if(mode!=='booth'||!B)return;
  if((k==='1'||k==='2'||k==='3')&&B.crate)chooseCard(Math.round(B.crate.target)+(+k-1));
  else if(B.crate&&(k==='ArrowLeft'||k==='ArrowRight')){B.crate.target=clamp(Math.round(B.crate.target)+(k==='ArrowLeft'?-1:1),0,crateMax());}
  else if(k===' ')pressPlay(I);
  else if(k==='b')toggleLow(I);
  else if(k==='v')toggleLow(M);});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

// ---------- main loop ----------
let mode='menu',crewId='bk',last=0;
function setUI(){menuEl.hidden=mode!=='menu';resultsEl.hidden=mode!=='results';quitBtn.hidden=!(mode==='booth'||mode==='intro')||EMBED;if(mode==='menu')renderMenu();fitScreen();}
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-(last||now))/1000));last=now;T+=dt*1000;
  try{
    if(mode==='intro'){updIntro(dt);if(mode==='intro')drawIntro();}
    if(mode==='booth'){updBooth(dt);if(B)drawBooth();}
    else if(mode==='results'&&B){updBooth(dt);drawBooth();}
    else if(mode==='menu')drawMenu();
  }catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
const Sessions=window.Sessions={version:'0.1',crew:CREW.map(c=>c.id),
  start(opts={}){if(CREW_BY[opts.crew])selCrew=opts.crew;startSet();},onFinish:null,onExit:null,_state:()=>({B,M,I,mode,xfade,decks})};
setUI();requestAnimationFrame(frame);
})();
</script>
