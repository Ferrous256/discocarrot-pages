<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ski Down</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0d0718">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Same arcade cabinet look as The Legend of Jak: 16-bit screen on top, menu or touch controls underneath. */
:root{
  --bg:#0d0718;--panel:#1b1030;--panel-edge:#3b2a63;--ink:#fff4e6;--dim:#a596c4;
  --carrot:#ff5c00;--pink:#ff4fd8;--cyan:#5fe8ff;--gold:#ffd23f;
  --font-pixel:'Press Start 2P','Courier New',monospace;--font-body:'VT323','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body[data-mode="play"]{overflow:hidden;position:fixed;inset:0;width:100%;background:#000}
button,.chip,.start{touch-action:manipulation}
[hidden]{display:none!important}
#app{box-sizing:border-box;max-width:860px;margin:0 auto;padding-block:8px 12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:10px;min-height:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-family:var(--font-pixel);font-size:10px;letter-spacing:.08em;color:var(--carrot);text-shadow:2px 2px 0 #3a1200}
.brand small{display:block;color:var(--dim);font-size:7px;margin-top:5px;letter-spacing:.12em}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:var(--font-pixel);font-size:8px;letter-spacing:.06em;background:var(--panel);color:var(--ink);border:2px solid var(--panel-edge);padding:9px 10px;cursor:pointer;box-shadow:0 3px 0 #000}
.chip:hover{border-color:var(--cyan)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.chip.on{border-color:var(--gold);color:var(--gold)}
.chip:focus-visible,.start:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{position:relative;width:min(100%, calc((100dvh - 240px) * 1.1428));min-width:min(100%,280px);aspect-ratio:256/224;max-width:100%;margin:0 auto;background:#000;border:4px solid var(--panel-edge);box-shadow:0 0 0 4px #000,0 0 40px rgba(255,92,0,.25);box-sizing:border-box}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:pointer}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:rgba(13,7,24,.86);padding:16px}
.overlay h2{font-family:var(--font-pixel);font-size:clamp(11px,3.4vw,18px);line-height:1.5;margin:0;color:var(--gold);text-shadow:3px 3px 0 #3a1200}
.overlay p{font-size:clamp(18px,4.6vw,24px);margin:0}
.under{width:min(100%, calc((100dvh - 240px) * 1.1428));min-width:min(100%,280px);max-width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border:4px solid var(--ink);box-shadow:inset 0 0 0 3px #000,0 0 0 3px #000;padding:12px 14px 14px;display:grid;gap:10px}
.lbl{font-family:var(--font-pixel);font-size:8px;color:var(--dim);letter-spacing:.08em}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.status{font-size:clamp(18px,4.4vw,22px);color:var(--dim);line-height:1.05}
.status b{color:var(--gold);font-weight:normal}
.start{font-family:var(--font-pixel);font-size:13px;letter-spacing:.1em;background:var(--carrot);color:#fff;border:4px solid #fff;box-shadow:0 0 0 3px #000,0 5px 0 3px #000;padding:14px 18px;cursor:pointer;animation:pulse 1.1s steps(2) infinite}
.start:active{transform:translateY(3px)}
.start.quiet{animation:none;background:var(--panel);font-size:10px;padding:11px 12px}
@keyframes pulse{50%{background:var(--pink)}}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:12px;min-height:120px;touch-action:none}
.controls .pad{grid-column:2;grid-row:1}
.controls #trickBtn{grid-column:3;grid-row:1;justify-self:end}
body[data-stick="left"] .controls .pad{grid-column:1;justify-self:start}
body[data-stick="right"] .controls .pad{grid-column:3;justify-self:end}
body[data-stick="right"] .controls #trickBtn{grid-column:1;justify-self:start}
/* a run fills the whole screen: the slope runs edge to edge, the stick and TRICK float over the snow */
body[data-mode="play"] #app{position:fixed;inset:0;max-width:none;margin:0;min-height:0;gap:0;padding:env(safe-area-inset-top,0px) 0 0;display:flex;flex-direction:column;align-items:center}
body[data-mode="play"] .topbar{align-self:stretch;flex:none;justify-content:flex-end;padding:4px max(8px, env(safe-area-inset-right, 0px)) 4px max(8px, env(safe-area-inset-left, 0px))}
body[data-mode="play"] .brand{display:none}
body[data-mode="play"] .topbar .btns{gap:6px;flex-wrap:nowrap}
body[data-mode="play"] .topbar .chip{padding:6px 8px;font-size:7px;box-shadow:none;opacity:.9}
body[data-mode="play"] .screen{flex:none;border:0;box-shadow:none;min-width:0;max-width:none;margin:0}
body[data-mode="play"] .under{position:fixed;left:0;right:0;bottom:0;width:auto;max-width:none;min-width:0;margin:0;z-index:5;pointer-events:none;
  padding:0 max(18px, calc(env(safe-area-inset-right, 0px) + 12px)) max(18px, calc(env(safe-area-inset-bottom, 0px) + 10px)) max(18px, calc(env(safe-area-inset-left, 0px) + 12px))}
body[data-mode="play"] .controls{pointer-events:auto;background:transparent}
body[data-mode="play"] .pad{background:radial-gradient(circle,rgba(42,26,72,.5) 0 55%,rgba(27,16,48,.5) 56%);border-color:rgba(255,255,255,.55)}
body[data-mode="play"] #trickBtn{opacity:.92}
/* sideways phone: slope in the middle at full height, stick and TRICK in the side gutters */
body[data-mode="play"].land .under{top:calc(env(safe-area-inset-top,0px) + 34px);justify-content:center;padding-bottom:max(10px, env(safe-area-inset-bottom, 0px))}
body[data-mode="play"].land .controls{width:100%}
body[data-mode="play"].land:not([data-stick="right"]) .controls .pad{grid-column:1;justify-self:start}
#fsMsg{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 48px);transform:translateX(-50%);z-index:40;width:min(86vw,320px);background:var(--panel);border:3px solid var(--gold);padding:10px;font-family:var(--font-pixel);font-size:8px;line-height:1.7;color:var(--ink);text-align:center}
#trickBtn{width:104px;height:104px;border-radius:50%;padding:0;font-size:11px;background:#1d8fb8;animation:none}
#trickBtn.air{background:var(--carrot);animation:pulse .5s steps(2) infinite}
.pad{flex:none;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,#2a1a48 0 55%,#1b1030 56%);border:4px solid var(--panel-edge);position:relative;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--carrot);border:4px solid #fff;box-shadow:0 4px 0 #000}
.hint{font-size:clamp(17px,4.2vw,21px);color:var(--dim);line-height:1.05;text-align:center}
.hint b{color:var(--gold);font-weight:normal}
.tally{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:clamp(19px,4.8vw,24px);line-height:1.05}
.tally .v{text-align:right;color:var(--ink)}
.tally .k{color:var(--dim)}
.tally .tot{color:var(--gold);font-family:var(--font-pixel);font-size:11px;padding-top:8px;border-top:2px dashed var(--panel-edge);margin-top:4px}
footer{font-family:var(--font-pixel);font-size:7px;color:var(--dim);text-align:center;letter-spacing:.1em;line-height:1.8}
body[data-mode="play"] footer{display:none}
@media (prefers-reduced-motion: reduce){.start,#trickBtn.air{animation:none}}
</style>
<div id="app">
  <div class="topbar">
    <div class="brand">DISCO CARROT<small>SKI DOWN &middot; JAK MINI GAME</small></div>
    <div class="btns">
      <button class="chip" id="pauseBtn" type="button" hidden>PAUSE</button>
      <button class="chip" id="quitBtn" type="button" hidden>QUIT RUN</button>
      <button class="chip" id="fsBtn" type="button" hidden>FULL SCREEN</button>
      <button class="chip" id="muteBtn" type="button">SOUND: ON</button>
    </div>
  </div>

  <div class="screen" id="screen">
    <canvas id="cv" width="256" height="224" aria-label="Ski Down, a 16-bit skiing mini game"></canvas>
    <div class="overlay" id="overlay" hidden>
      <h2 id="ovTitle">PAUSED</h2>
      <p id="ovText">Tap to keep skiing</p>
    </div>
  </div>

  <div class="under">
    <div class="panel" id="menu">
      <div class="lbl">RIDER</div>
      <div class="row" id="crewRow"></div>
      <div class="lbl">RUN</div>
      <div class="row" id="runRow"></div>
      <div class="lbl">NIGHT RUNS</div>
      <div class="row" id="nightRow"></div>
      <div class="status" id="menuStatus"></div>
      <div class="row" id="stickRow"><span class="lbl">STICK</span></div>
      <div class="row"><button class="start" id="goBtn" type="button">DROP IN</button></div>

<script>
// Jak soundtrack engine: 16-bit house and techno, all synthesized. makeJakMusic(audioContext, outputNode)
function makeJakMusic(ac,out){
  'use strict';
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  // signal chain: instruments -> bus -> warm lowpass -> glue compressor -> level -> out
  const bus=ac.createGain();
  const warm=ac.createBiquadFilter();warm.type='lowpass';warm.frequency.value=8500;warm.Q.value=0.4;
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=10;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.2;
  const level=ac.createGain();level.gain.value=1.4;
  bus.connect(warm);warm.connect(comp);comp.connect(level);level.connect(out);
  const duck=ac.createGain();duck.connect(bus); // melodic parts pump against the kick
  const echo=ac.createDelay(2),fb=ac.createGain(),ehp=ac.createBiquadFilter(),wet=ac.createGain();
  ehp.type='highpass';ehp.frequency.value=700;fb.gain.value=0.33;wet.gain.value=0.4;
  echo.connect(ehp);ehp.connect(fb);fb.connect(echo);ehp.connect(wet);wet.connect(bus);
  const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const pulse=w=>{const n=48,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*w);return ac.createPeriodicWave(re,im);};
  const P25=pulse(0.25),P12=pulse(0.125);

  function vco(type,f,t,stop,det){const o=ac.createOscillator();if(type==='p25')o.setPeriodicWave(P25);else if(type==='p12')o.setPeriodicWave(P12);else o.type=type;
    o.frequency.setValueAtTime(f,t);if(det)o.detune.value=det;o.start(t);o.stop(stop);return o;}
  function vca(t,v,dur,dest,attack=0.002){const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(dest);return g;}
  function nz(t,dur,ftype,freq,v,q=0.7,dest=bus){const s=ac.createBufferSource();s.buffer=nb;const f=ac.createBiquadFilter();f.type=ftype;f.frequency.value=freq;f.Q.value=q;
    s.connect(f);f.connect(vca(t,v,dur,dest,0.001));s.start(t,Math.random()*0.3);s.stop(t+dur+0.02);return f;}

  const I={
    kick(t,v){const o=vco('sine',155,t,t+0.42);o.frequency.exponentialRampToValueAtTime(47,t+0.11);o.connect(vca(t,v,0.38,bus,0.001));nz(t,0.012,'highpass',2600,v*0.25);
      duck.gain.cancelScheduledValues(t);duck.gain.setValueAtTime(0.28,t);duck.gain.linearRampToValueAtTime(1,t+0.22);},
    clap(t,v){[0,0.011,0.022].forEach(d=>nz(t+d,0.018,'bandpass',1400,v*0.7,0.9));nz(t+0.03,0.16,'bandpass',1250,v*0.45,0.8);},
    hat(t,v,open){nz(t,open?0.17:0.035,'highpass',open?7000:8200,v);},
    crash(t,v){nz(t,1.7,'highpass',3800,v);},
    riser(t,dur,v){const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=2.5;
      f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(7000,t+dur);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+dur);g.gain.linearRampToValueAtTime(0.0001,t+dur+0.03);
      s.connect(f);f.connect(g);g.connect(bus);s.start(t);s.stop(t+dur+0.05);},
    tom(t,v){const o=vco('sine',210,t,t+0.2);o.frequency.exponentialRampToValueAtTime(85,t+0.16);o.connect(vca(t,v,0.18,bus));},
    bass(t,m,dur,o){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=o.q||1;const c=o.cut||600;
      f.frequency.setValueAtTime(Math.min(16000,c*(o.acc?3.2:1.8)),t);f.frequency.exponentialRampToValueAtTime(Math.max(70,c*0.55),t+dur);
      vco(o.type||'square',mtof(m),t,t+dur+0.03).connect(f);f.connect(vca(t,o.v||0.25,dur,duck,0.004));},
    stab(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(3400,t);f.frequency.exponentialRampToValueAtTime(800,t+dur);
      const g=vca(t,v*1.6,dur,duck,0.003);f.connect(g);ms.forEach((m,j)=>vco('p25',mtof(m),t,t+dur+0.03,j%2?7:-7).connect(f));},
    pad(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1100;const g=ac.createGain();
      g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.35);g.gain.setValueAtTime(v,t+dur*0.75);g.gain.linearRampToValueAtTime(0.0001,t+dur);
      f.connect(g);g.connect(duck);ms.forEach((m,j)=>vco('sawtooth',mtof(m),t,t+dur+0.05,j%2?9:-9).connect(f));},
    lead(t,m,dur,v){const o=vco('p12',mtof(m),t,t+dur+0.05);const g=vca(t,v,dur,bus,0.004);o.connect(g);g.connect(echo);},
    bell(t,m,dur,v){const o=vco('triangle',mtof(m),t,t+dur+0.05),o2=vco('p25',mtof(m+12),t,t+dur*0.5);const g=vca(t,v,dur,bus,0.002);o.connect(g);o2.connect(vca(t,v*0.25,dur*0.5,g));g.connect(echo);},
    tri(t,m,dur,v){vco('triangle',mtof(m),t,t+dur+0.05).connect(vca(t,v,dur,bus,0.01));},
    snare(t,v){nz(t,0.16,'bandpass',1900,v*0.7,0.7);const o=vco('triangle',200,t,t+0.1);o.frequency.exponentialRampToValueAtTime(150,t+0.08);o.connect(vca(t,v*0.5,0.09,bus));},
    saw3(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=3600;const g=vca(t,v,dur,duck,0.004);f.connect(g);g.connect(echo);
      for(const m of ms)for(const d of [-14,0,14])vco('sawtooth',mtof(m),t,t+dur+0.03,d).connect(f);},
    wobble(t,m,dur,rate,v){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=9;f.frequency.value=650;
      const lfo=vco('sine',rate,t,t+dur+0.05),lg=ac.createGain();lg.gain.value=560;lfo.connect(lg);lg.connect(f.frequency);
      vco('sawtooth',mtof(m),t,t+dur+0.03).connect(f);vco('square',mtof(m-12),t,t+dur+0.03,5).connect(f);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.setValueAtTime(v,t+dur-0.03);g.gain.linearRampToValueAtTime(0.0001,t+dur);f.connect(g);g.connect(duck);
      vco('sine',mtof(m-12),t,t+dur+0.03).connect(vca(t,v*0.9,dur,duck,0.01));},
    reese(t,m,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=2;f.frequency.value=520;
      vco('sawtooth',mtof(m),t,t+dur+0.03,-18).connect(f);vco('sawtooth',mtof(m),t,t+dur+0.03,18).connect(f);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.02);g.gain.setValueAtTime(v,t+dur*0.85);g.gain.linearRampToValueAtTime(0.0001,t+dur);f.connect(g);g.connect(duck);
      vco('sine',mtof(m-12),t,t+dur+0.03).connect(vca(t,v*0.8,dur,duck,0.01));},
    // house piano: bright hammer on top of a soft body
    piano(t,ms,dur,v){const g=vca(t,v,dur,duck,0.002);const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(5200,t);f.frequency.exponentialRampToValueAtTime(1400,t+dur);f.connect(g);
      ms.forEach((m,j)=>{vco('triangle',mtof(m),t,t+dur+0.03,j%2?4:-4).connect(f);vco('p25',mtof(m+12),t,t+0.09).connect(vca(t,0.5,0.08,f));});},
    // electric piano for garage and liquid: sine plus a little bell, slow tremolo
    keys(t,ms,dur,v){const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(duck);
      const tr=vco('sine',5,t,t+dur+0.05),tg=ac.createGain();tg.gain.value=v*0.35;tr.connect(tg);tg.connect(g.gain);
      ms.forEach(m=>{vco('sine',mtof(m),t,t+dur+0.03).connect(g);vco('triangle',mtof(m+12),t,t+0.25).connect(vca(t,0.25,0.22,g));});},
    sub(t,m,dur,v){const o=vco('sine',mtof(m),t,t+dur+0.03);const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.setValueAtTime(v,t+dur*0.8);g.gain.linearRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(duck);},
    cowbell(t,v){const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=800;f.Q.value=3;const g=vca(t,v,0.16,bus,0.001);f.connect(g);vco('square',540,t,t+0.2).connect(f);vco('square',800,t,t+0.2).connect(f);},
    rim(t,v){nz(t,0.02,'bandpass',3200,v,4);vco('triangle',1700,t,t+0.03).connect(vca(t,v*0.5,0.025,bus));},
    shaker(t,v){nz(t,0.05,'bandpass',9000,v,1.5);},
    snap(t,v){nz(t,0.03,'bandpass',2600,v,2);nz(t+0.004,0.05,'highpass',5000,v*0.4);},
    ride(t,v){nz(t,0.45,'bandpass',6500,v,1.2);vco('square',4100,t,t+0.4).connect(vca(t,v*0.12,0.35,bus));},
    brush(t,v,dur){nz(t,dur,'bandpass',3600,v,0.6);},

// ---------- seeded course builder ----------
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
// The Chutes: a couloir whose center wanders and whose width pinches; the walls are cliffs
function chuteC(cp,y){return 128+34*Math.sin(y/260+cp[0])+14*Math.sin(y/97+cp[1]);}
function chuteW(cp,y){const w=104+22*Math.sin(y/180+cp[2]),k=Math.max(0,Math.min(1,(y-150)/350));return 190+(w-190)*k;}
function chuteParams(seed){const r=rng((seed^0x2b7e1516)>>>0);return[r()*6,r()*6,r()*6];}
function buildCourse(run,seed){
  const st=run.style||'classic';
  if(st==='pillows')return finishCourse(buildPillows(run,seed),run);
  if(st==='chutes')return finishCourse(buildChutes(run,seed),run);
  if(st==='moguls')return finishCourse(buildMoguls(run,seed),run);
  if(st==='park')return finishCourse(buildPark(run,seed),run);
  return finishCourse(buildClassic(run,seed),run);
}
// no rocks on the slope: trees are the only obstacles (rocks are filtered out here, and nothing replaces them)
function finishCourse(O,run){const L=run.len;const out=O.filter(o=>o.k!=='rock'&&(o.edge||(o.y>300&&o.y<L-160)));out.sort((a,b)=>a.y-b.y);return out;}
function edgeTrees(r,L,add){for(let y=-120;y<L+320;y+=12+r()*10){add({k:'tree',x:3+r()*18,y,edge:1});add({k:'tree',x:253-r()*18,y,edge:1});
    if(r()<0.5)add({k:'tree',x:18+r()*14,y:y+6,edge:1});if(r()<0.5)add({k:'tree',x:238-r()*14,y:y+6,edge:1});}}
const cl=(v,a=36,b=220)=>Math.max(a,Math.min(b,v));
function buildClassic(run,seed){
  const r=rng(seed),O=[],L=run.len,add=o=>{O.push(o);return o;};
  edgeTrees(r,L,add);
  const cx=()=>44+r()*168;
  const W8=[['trees',3*run.dens],['carrots',2.6],['fan',2.4],['grump',1.4*run.grumps],['rock',1.3*run.dens],['jump',2.0*run.jumps],['thread',1.1*run.dens]];
  const tot=W8.reduce((s,w)=>s+w[1],0);
  let y=380,fanN=0,goldDone=false;
  while(y<L-300){
    let roll=r()*tot,kind='trees';for(const [k,w] of W8){if((roll-=w)<0){kind=k;break;}}
    const x=cx();
    if(kind==='trees'){const n=2+Math.floor(r()*3*run.dens);for(let i=0;i<n;i++)add({k:'tree',x:Math.max(30,Math.min(226,x+(r()-0.5)*56)),y:y+(r()-0.5)*44});}
    else if(kind==='carrots'){let xx=x,dx=(r()-0.5)*14;for(let i=0;i<5;i++){add({k:'carrot',x:xx,y:y+i*24});xx=Math.max(36,Math.min(220,xx+dx));}}
    else if(kind==='fan'){const n=1+(r()<0.4?1:0);for(let i=0;i<n;i++)add({k:'fan',x:Math.max(36,Math.min(220,x+i*22)),y:y+i*10,col:FAN_COLS[(fanN++)%FAN_COLS.length],ph:r()*6});}
    else if(kind==='grump'){add({k:'grump',x,y});if(r()<0.5)add({k:'fan',x:x<128?x+70:x-70,y:y+30,col:FAN_COLS[(fanN++)%FAN_COLS.length],ph:r()*6});}
    else if(kind==='rock'){add({k:'rock',x,y});if(r()<0.5*run.dens)add({k:'rock',x:Math.max(36,Math.min(220,x+(r()<0.5?-34:34))),y:y+26});}
    else if(kind==='jump'){const jx=Math.max(56,Math.min(200,x));add({k:'jump',x:jx,y});
      for(let i=0;i<4;i++)add({k:'carrot',x:jx,y:y+200+i*22});add({k:'fan',x:jx+(r()<0.5?-40:40),y:y+250,col:FAN_COLS[(fanN++)%FAN_COLS.length],ph:r()*6});y+=170;}
    else if(kind==='thread'){
      const gx=Math.max(70,Math.min(186,x));add({k:'tree',x:gx-22,y:y+10});add({k:'tree',x:gx+22,y:y+16});add({k:'tree',x:gx-26,y:y+52});add({k:'tree',x:gx+24,y:y+58});
      if(!goldDone&&y>L*0.35&&r()<0.6){add({k:'gold',x:gx,y:y+36});goldDone=true;}
      else for(let i=0;i<3;i++)add({k:'carrot',x:gx,y:y+8+i*22});}
    y+=(150+r()*90)/run.dens;
  }
  if(!goldDone){const gy=Math.round(L*0.5);add({k:'gold',x:128,y:gy});add({k:'tree',x:104,y:gy-14});add({k:'tree',x:152,y:gy-8});}
  return O;
}
// Secret Pillows: small cliff bands and stacks of snow pillows that pop you into the air
function buildPillows(run,seed){
  const r=rng(seed),O=[],L=run.len,add=o=>{O.push(o);return o;};
  edgeTrees(r,L,add);
  const W8=[['cliff',2.6],['stack',2.4],['boulders',1.3],['carrots',1.4],['fan',1.0],['trees',0.9]],tot=W8.reduce((s,w)=>s+w[1],0);
  let y=400,fanN=0,big=null;
  while(y<L-320){
    let roll=r()*tot,kind='cliff';for(const [k,w] of W8){if((roll-=w)<0){kind=k;break;}}
    if(kind==='cliff'){const x0=24+r()*90,x1=Math.min(232,x0+70+r()*100),h=9+Math.round(r()*13),c=add({k:'cliff',x:(x0+x1)/2,x0,x1,y,h});
      if(!big||h>big.h)big=c;
      for(let i=0;i<3;i++)add({k:'carrot',x:cl((x0+x1)/2+(r()-0.5)*30),y:y+50+i*22});
      if(x0>64)for(let i=0;i<2;i++)add({k:'rock',x:cl(30+r()*(x0-40),30,x0-8),y:y+(r()-0.5)*20});
      if(x1<192)for(let i=0;i<2;i++)add({k:'rock',x:cl(x1+10+r()*(222-x1),x1+8,226),y:y+(r()-0.5)*20});
      y+=110;}
    else if(kind==='stack'){const n=3+Math.floor(r()*3),px=60+r()*136;
      for(let i=0;i<n;i++){const x=cl(px+(i%2?16:-16)+(r()-0.5)*10,40,216);add({k:'pillow',x,y:y+i*46,w:18+Math.round(r()*8)});if(i<n-1)add({k:'carrot',x,y:y+i*46+26});}
      y+=n*46;}
    else if(kind==='boulders'){const bx=50+r()*156;for(let i=0;i<4;i++)add({k:'rock',x:cl(bx+(r()-0.5)*110),y:y+(r()-0.5)*70});add({k:'pillow',x:cl(bx+(r()-0.5)*40),y:y+40,w:20});}
    else if(kind==='carrots'){let xx=50+r()*156;for(let i=0;i<5;i++){add({k:'carrot',x:xx,y:y+i*24});xx=cl(xx+(r()-0.5)*16);}}
    else if(kind==='fan'){add({k:'fan',x:cl(40+r()*176),y,col:FAN_COLS[(fanN++)%FAN_COLS.length],ph:r()*6});}
    else{const tx=50+r()*156;for(let i=0;i<3;i++)add({k:'tree',x:cl(tx+(r()-0.5)*50,30,226),y:y+(r()-0.5)*40});}
    y+=130+r()*80;
  }
  if(big)add({k:'gold',x:big.x,y:big.y+40});else add({k:'gold',x:128,y:L*0.5});
  return O;
}
// The Chutes: rock walls (drawn from the corridor shape), short mandatory drops at the chokes, carrot lines down the fall line
function buildChutes(run,seed){
  const r=rng(seed),O=[],L=run.len,add=o=>{O.push(o);return o;},cp=chuteParams(seed);
  let y=460,fanN=0,narrow={w:999,y:L/2};
  while(y<L-300){
    const c=chuteC(cp,y),w=chuteW(cp,y),roll=r();
    if(w<narrow.w)narrow={w,y};
    if(roll<0.32){for(let i=0;i<6;i++){const yy=y+i*22;add({k:'carrot',x:chuteC(cp,yy)+(r()-0.5)*8,y:yy});}y+=60;}
    else if(roll<0.55){add({k:'cliff',x:c,x0:c-w/2-12,x1:c+w/2+12,y,h:8+Math.round(r()*8)});for(let i=0;i<2;i++)add({k:'carrot',x:chuteC(cp,y+60+i*22),y:y+60+i*22});y+=90;}
    else if(roll<0.8){add({k:'rock',x:c+(r()<0.5?-1:1)*w*0.22,y});if(r()<0.5)add({k:'rock',x:chuteC(cp,y+40)+(r()<0.5?-1:1)*w*0.2,y:y+40});}
    else add({k:'fan',x:c+(r()-0.5)*w*0.4,y,col:FAN_COLS[(fanN++)%FAN_COLS.length],ph:r()*6});
    y+=140+r()*70;
  }
  add({k:'gold',x:chuteC(cp,narrow.y),y:narrow.y});
  return O;
}
// Mogul Land: staggered rows of bumps, carrot zipper lines down the troughs
function buildMoguls(run,seed){
  const r=rng(seed),O=[],L=run.len,add=o=>{O.push(o);return o;};
  edgeTrees(r,L,add);
  let row=0,fanN=0;
  for(let y=380;y<L-220;y+=22,row++){const off=row%2?15:0;for(let x=34+off;x<=224;x+=30){if(r()<0.1)continue;add({k:'mogul',x:x+(r()-0.5)*4,y:y+(r()-0.5)*3});}}
  for(let y=520;y<L-400;y+=420+r()*200){const tx=34+15+30*Math.floor(r()*6);for(let i=0;i<7;i++)add({k:'carrot',x:tx,y:y+i*22+11});}
  for(let y=600;y<L-400;y+=500+r()*300)add({k:'fan',x:r()<0.5?30:226,y,col:FAN_COLS[(fanN++)%FAN_COLS.length],ph:r()*6});
  for(let y=900;y<L-400;y+=1400+r()*600)add({k:'grump',x:r()<0.5?28:228,y});
  add({k:'gold',x:34+15+30*3,y:Math.round(L*0.6)+11});

}
// Jump Park: a lane of kickers (small, medium, big), rails and boxes, with fences and spectators along the sides
function buildPark(run,seed){
  const r=rng(seed),O=[],L=run.len,add=o=>{O.push(o);return o;};
  edgeTrees(r,L,add);
  let y=460,fanN=0,k=0;
  while(y<L-420){
    const kind=k++%3;
    if(kind===0){for(let s=1;s<=3;s++){const jx=110+r()*36;add({k:'jump',x:jx,y,size:s});for(let i=0;i<3;i++)add({k:'carrot',x:jx,y:y+150+s*30+i*22});y+=230+s*40;}
      add({k:'fan',x:62,y:y-120,col:FAN_COLS[(fanN++)%FAN_COLS.length],ph:r()*6});add({k:'fan',x:194,y:y-80,col:FAN_COLS[(fanN++)%FAN_COLS.length],ph:r()*6});}
    else if(kind===1){const len=90+r()*40;add({k:'rail',x:100,y,len,box:false});add({k:'rail',x:156,y:y+30,len:len-10,box:true});
      for(let i=0;i<3;i++)add({k:'carrot',x:128,y:y+len+60+i*22});y+=len+200;
      add({k:'rail',x:128,y,len:130,box:r()<0.5});y+=330;}
    else{add({k:'jump',x:92,y,size:2});add({k:'rail',x:168,y:y-20,len:110,box:true});add({k:'fan',x:128,y:y+190,col:FAN_COLS[(fanN++)%FAN_COLS.length],ph:r()*6});y+=330;}
  }
  add({k:'gold',x:128,y:Math.round(L*0.55)});
  return O;
}

    banner:null,time:0,phase:'intro',introT:INTRO,finT:0,overT:0,aval:rollAval(run,seed),camLift:44,shake:0,wiped:false,buried:0,crashes:0,

// does this run slide, and where? rolled from the run's seed so a replayed seed slides the same way
function rollAval(run,seed){const r=rng((seed^0x5bd1e995)>>>0);const hit=r()<(run.aval||0);return{on:false,y:-999,at:hit?run.len*(0.42+r()*0.33):Infinity};}
// opening: Jak is parked at the top with its back to us, honks, and the rider hops out of the back
const INTRO=2.1,HOP0=0.35,HOP1=1.15;
function hopState(){const e=INTRO-Math.max(0,G.introT);
  if(e<HOP0)return{inside:true,u:0,y:-46};
  const u=Math.min(1,(e-HOP0)/(HOP1-HOP0));return{inside:false,u,y:-46+46*u-34*Math.sin(Math.PI*u),landed:u>=1};}
function setBanner(text,sub,col=PAL.Y,dur=1.6){G.banner={text,sub,col,t:dur,d:dur};}
function floatText(x,y,text,col='#fff'){G.floats.push({x,y,text,col,t:1.1});}
function puff(x,y,n,col){for(let i=0;i<n;i++)G.parts.push({x,y,vx:(Math.random()-0.5)*90,vy:-Math.random()*60-10,life:0.5+Math.random()*0.5,col:col||(i%2?'#ffffff':'#c8d6ee')});}
function loseFollowers(n,why){n=Math.min(n,G.followers.length);for(let i=0;i<n;i++){const f=G.followers.pop();G.lost.push({x:f.x,y:f.y,vx:(Math.random()<0.5?-1:1)*(40+Math.random()*30),col:f.col,life:1.3});}
  if(n>0){sfx.lose();floatText(G.x,G.y-30,`-${n} CREW`,'#ff6b6b');}return n;}
function crash(msg){
  if(G.crashT>0||G.inv>0||G.phase!=='ski')return;
  G.hearts--;G.crashes++;G.crashT=1.1;G.v=0;G.air=null;G.grind=null;G.shake=0.4;sfx.hurt();puff(G.x,G.y,14);
  loseFollowers(Math.ceil(G.followers.length/3));setBanner(msg||'YARD SALE!',G.hearts>0?`${G.hearts} HEART${G.hearts===1?'':'S'} LEFT`:'OUT OF HEARTS',PAL.Y,1.4);
  G.debris=[{x:G.x,y:G.y,vx:-60,vy:-40,r:0,kind:'ski'},{x:G.x,y:G.y,vx:55,vy:-30,r:0,kind:'ski'},{x:G.x,y:G.y,vx:25,vy:-70,r:0,kind:'pole'}];
  if(G.hearts<=0)G.wiped=true;
}
function launch(size){const v=G.v;
  G.air=size?{t:0,dur:0.45+0.17*size+v/320,hgt:5+size*6+v/14,tricks:[],cur:null}:{t:0,dur:0.55+v/280,hgt:8+v/10,tricks:[],cur:null};
  G.spinCount=0;sfx.jump();puff(G.x,G.y,6);}
function dropOff(h){const v=G.v;G.ang*=0.35;G.air={t:0,dur:0.42+h*0.03+v/500,hgt:4+h*0.35,tricks:[],cur:null};G.spinCount=0;sfx.jump();puff(G.x,G.y,8);floatText(G.x,G.y-30,h>=17?'BIG DROP!':'DROP!','#5fe8ff');}
function pop(){const v=G.v;G.ang*=0.5;G.air={t:0,dur:0.36+v/700,hgt:5+v/40,tricks:[],cur:null};G.spinCount=0;sfx.jump();puff(G.x,G.y,5);}
function bump(){const v=G.v;G.air={t:0,dur:0.2+v/900,hgt:2+v/60,tricks:[],cur:null,bump:true};}
function doTrick(){
  if(mode!=='play'||paused||!G)return;
  if(G.phase==='intro'){if(G.introT>0.01){G.introT=0.01;puff(128,0,8);}return;}
  const A=G.air;if(!A||A.bump||A.cur||A.t>A.dur-0.12)return;
  let {ix,iy}=readInput(0);const kl=keys.ArrowLeft||keys.a,kr=keys.ArrowRight||keys.d;if(kl||kr)ix=(kr?1:0)-(kl?1:0);let k;
  if(Math.abs(ix)>0.4){G.spinCount++;k={type:'spin',dir:Math.sign(ix),dur:0.42,pts:100,name:`${360*G.spinCount} SPIN`};}
  else if(iy<-0.4){k={type:'flip',dir:-1,dur:0.5,pts:160,name:'BACKFLIP'};G.spinCount=0;}
  else if(iy>0.4){k={type:'flip',dir:1,dur:0.5,pts:160,name:'FRONTFLIP'};G.spinCount=0;}
  else{const GN=['DISCO GRAB','CARROT GRAB','MUTE GRAB'];k={type:'grab',dur:0.4,pts:70,name:GN[G.grabN++%3]};G.spinCount=0;}

function land(){

  if(A.cur)A.tricks.push(A.cur);

  if(A.tricks.length){
    // a spin that kept going counts once at its biggest number
    const list=[];A.tricks.forEach(t=>{const prev=list[list.length-1];if(t.type==='spin'&&prev&&prev.type==='spin'){prev.name=t.name;prev.pts+=t.pts;}else list.push({...t});});
    const base=list.reduce((s,t)=>s+t.pts,0),pts=Math.round(base*list.length*G.trickX);
    G.tpts+=pts;G.tricksDone+=list.length;G.bestCombo=Math.max(G.bestCombo,pts);
    const names=list.map(t=>t.name).join(' + ');
    setBanner(list.length>1?'COMBO!':'STOMPED!',`${names.length>30?list.length+' TRICKS':names}  +${pts}`,list.length>1?PAL.Y:'#5fe8ff',1.6);
    if(list.length>1)sfx.party();

// ---------- update ----------
function update(dt){
  T+=dt*1000;
  if(mode==='menu')return;
  if(!G)return;
  const run=G.run;
  G.parts=G.parts.filter(p=>(p.life-=dt)>0);G.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;});
  G.floats=G.floats.filter(f=>(f.t-=dt)>0);
  G.lost=G.lost.filter(f=>(f.life-=dt)>0);G.lost.forEach(f=>{f.x+=f.vx*dt;f.y+=20*dt;f.vx*=0.97;});
  if(G.banner&&(G.banner.t-=dt)<=0)G.banner=null;
  if(G.shake>0)G.shake-=dt;
  if(G.debris)G.debris.forEach(d=>{d.x+=d.vx*dt;d.y+=d.vy*dt;d.vy+=150*dt;if(d.vy>0&&d.y>G.y+6){d.vy=0;d.vx*=0.8;}d.r+=dt*8;});
  if(mode!=='play'||paused)return;

  if(G.phase==='intro'){
    const e0=INTRO-G.introT;G.introT-=dt;const e1=INTRO-G.introT;
    if(e0<0.05&&e1>=0.05)sfx.honk();
    if(e0<HOP0&&e1>=HOP0)sfx.jump();
    if(e0<HOP1&&e1>=HOP1){sfx.land();puff(128,0,10);}
    if(G.introT<=0){G.phase='ski';G.introT=0;sfx.count(true);setBanner('DROP IN!',run.name,PAL.O,1.0);}
    return;
  }
  const {ix,iy}=readInput(dt);
  if(G.phase==='ski'){G.time+=dt;G.camLift*=Math.exp(-dt*2.2);}

  // steering and speed
  if(G.phase==='finish'){
    const tgtA=Math.max(-0.6,Math.min(0.6,(128-G.x)/60));G.ang+=(tgtA-G.ang)*Math.min(1,dt*4);
    if(G.y<run.len+70)G.v+=(run.cruise*0.6-G.v)*Math.min(1,dt*1.5);else G.v=Math.max(0,G.v-180*dt);
  }else if(G.phase==='over'){G.v=Math.max(0,G.v-200*dt);}
  else if(G.crashT>0){
    G.crashT-=dt;G.v=0;
    if(G.crashT<=0){if(G.wiped){G.phase='over';G.overT=0;sfx.over();AudioK.setSong(null);setBanner('WIPEOUT!','SKI PATROL IS ON THE WAY','#ff6b6b',2.4);}
      else{G.inv=1.5;G.debris=null;G.ang=0;G.grind=null;if(run.style==='chutes')G.x=chuteC(G.cp,G.y);}}
  }else if(G.grind){updGrind(dt,ix);
  }else if(!G.air||G.air.bump){
    const tgtA=ix*1.2;G.ang+=(tgtA-G.ang)*Math.min(1,dt*7);
    const tuck=iy>0.45,brake=iy<-0.45;G.tuck=tuck;
    let tgt=(tuck?run.tuck:run.cruise)*Math.max(0,Math.cos(G.ang*1.15));if(brake)tgt=Math.min(tgt,45);
    const rate=G.v<tgt?(tuck?0.95:0.8):(brake?3.2:1.6);G.v+=(tgt-G.v)*Math.min(1,rate*dt);
    if(Math.abs(G.ang)>0.7&&G.v>60&&Math.random()<dt*30)G.parts.push({x:G.x+Math.sign(G.ang)*5,y:G.y+2,vx:Math.sign(G.ang)*(30+Math.random()*30),vy:-30-Math.random()*30,life:0.35,col:'#ffffff'});
  }
  if(G.inv>0)G.inv-=dt;
  // air time and tricks
  if(G.air){const A=G.air;A.t+=dt;
    if(A.cur){A.cur.p+=dt/A.cur.dur;if(A.cur.p>=1){A.tricks.push(A.cur);floatText(G.x,G.y-44,A.cur.name,'#ffd23f');A.cur=null;}}
    if(G.run.style==='chutes'){G.ang+=(Math.max(-0.5,Math.min(0.5,(chuteC(G.cp,G.y+40)-G.x)/60))-G.ang)*Math.min(1,dt*3);}
    if(A.t>=A.dur)land();}
  // move
  const ox=G.x,oy=G.y;
  if(G.crashT<=0){G.x+=Math.sin(G.ang)*G.v*dt*1.15;G.y+=Math.cos(G.ang)*G.v*dt;}
  G.x=Math.max(10,Math.min(246,G.x));
  const moved=Math.hypot(G.x-ox,G.y-oy);
  if(moved>0.3){G.s+=moved;G.trail.push({x:G.x,y:G.y,s:G.s,air:!!G.air});if(G.trail.length>1400)G.trail.splice(0,200);}

  // followers ride the trail behind the skier
  if(G.phase!=='finish'||G.finT<0.4)G.followers.forEach((f,i)=>{const p=trailAt(G.s-14*(i+1));const k=Math.min(1,dt*6);f.x+=(p.x-f.x)*k;f.y+=(p.y-f.y)*k;});

  // collisions
  if(G.phase==='ski'){
    const h=G.air?airH():0;
    const i0=lowerBound(G.objs,G.y-60);
    for(let i=i0;i<G.objs.length;i++){const o=G.objs[i];if(o.y>G.y+60)break;if(o.dead)continue;
      const dx=G.x-o.x,dy=G.y-o.y;
      if(o.k==='carrot'||o.k==='gold'){if(Math.abs(dx)<9&&Math.abs(dy+6)<11&&h<22){o.dead=1;
          if(o.k==='gold'){G.gold=true;G.carrots+=10;sfx.gold();setBanner('GOLDEN CARROT!','+10 CARROTS','#ffd23f',1.8);puff(o.x,o.y-8,16,'#ffd23f');}
          else{G.carrots++;sfx.chomp();floatText(o.x,o.y-20,'+1','#ff9a4d');}}}
      else if(o.k==='fan'){if(Math.abs(dx)<G.recruitR&&Math.abs(dy)<14&&h<10&&G.crashT<=0){o.dead=1;G.followers.push({x:o.x,y:o.y,col:o.col});sfx.recruit();floatText(o.x,o.y-22,'+1 CREW','#3ad06a');}}
      else if(G.crashT>0||G.inv>0)continue;
      else if(o.k==='tree'){if(Math.abs(dx)<6&&dy>-6&&dy<4&&h<16)crash('YARD SALE!');}
      else if(o.k==='rock'){if(Math.abs(dx)<7&&Math.abs(dy)<5&&h<4){G.v*=0.35;G.inv=0.6;G.shake=0.2;sfx.bump();puff(G.x,G.y,6);floatText(G.x,G.y-26,'OOF!','#ff9a4d');}}
      else if(o.k==='grump'){if(Math.abs(dx)<7&&Math.abs(dy)<6&&h<10)crash('GRUMPED!');}
      else if(o.k==='jump'){const hw=o.size?8+o.size*3:13;if(!G.air&&!G.grind&&Math.abs(dx)<hw&&dy>-8&&dy<3&&G.v>50)launch(o.size);}
      else if(o.k==='cliff'){if(!G.air&&!G.grind&&oy<o.y&&G.y>=o.y&&G.x>o.x0&&G.x<o.x1)dropOff(o.h);}
      else if(o.k==='pillow'){if(!G.air&&Math.abs(dx)<o.w/2&&dy>-5&&dy<3&&G.v>35&&!o.used){o.used=1;pop();floatText(o.x,o.y-26,'POP!','#ffffff');}}
      else if(o.k==='mogul'){if(!G.air&&!o.hitT&&Math.abs(dx)<6&&Math.abs(dy)<4){o.hitT=1;
          if(G.v>90)G.v*=0.96;if(G.v>100){bump();G.shake=Math.max(G.shake,0.06);}
          const now=G.time;G.bumps=G.bumps.filter(t=>now-t<1.1);G.bumps.push(now);
          if(G.tuck&&G.v>150&&G.bumps.length>=3){G.bumps=[];crash('BUCKED!');}}}
      else if(o.k==='rail'){if(!G.air&&!G.grind&&oy<o.y&&G.y>=o.y&&Math.abs(G.x-o.x)<(o.box?9:6)){G.grind={o,t:0,bal:(Math.random()-0.5)*0.3};floatText(G.x,G.y-30,o.box?'ON THE BOX':'ON THE RAIL','#ffd23f');sfx.click&&sfx.click();}}
    }
    if(G.run.style==='chutes'&&G.crashT<=0&&G.inv<=0){const c=chuteC(G.cp,G.y),hw=chuteW(G.cp,G.y)/2;const lo=c-hw+3,hi=c+hw-3;if(G.x<lo||G.x>hi){if(G.air){G.x=Math.max(lo+1,Math.min(hi-1,G.x));G.ang*=-0.3;G.v*=0.9;}else crash('SLAMMED THE WALL!');}}
    // Grumps yell when you blast past them
    for(let i=lowerBound(G.objs,G.y-30);i<G.objs.length;i++){const o=G.objs[i];if(o.y>G.y+30)break;
      if(o.k!=='grump'||o.yelled)continue;
      if(Math.abs(G.x-o.x)<40&&Math.abs(G.y-o.y)<22){o.yelled=1;o.yellT=1.6;
        if(G.air)floatText(o.x,o.y-30,'TOO FAST!','#5fe8ff');
        else{sfx.growl();const n=loseFollowers(G.scare);if(!n)floatText(o.x,o.y-30,'NO CREW TO SCARE','#a596c4');}}}
  }
  G.objs.forEach(o=>{if(o.yellT>0)o.yellT-=dt;});

  // avalanche on the last stretch
  const A=G.aval;
  if(G.phase==='ski'&&!A.on&&G.y>A.at){A.on=true;A.y=G.y-90;sfx.thunder();G.shake=0.6;setBanner('AVALANCHE!','TUCK AND OUTRUN IT','#ff6b6b',2.0);}
  if(A.on){
    if(G.phase==='ski'&&G.crashT<=0){A.y+=run.cruise*0.92*dt;A.y=Math.max(A.y,G.y-210);
      if(A.y>G.y-6&&G.crashT<=0){G.hearts--;G.crashT=1.2;G.v=0;G.air=null;G.shake=0.6;sfx.hurt();
        const n=loseFollowers(Math.ceil(G.followers.length/2));G.buried++;
        setBanner('BURIED!',n?`THE SNOW TOOK ${n} CREW`:'DIG OUT AND GO','#ff6b6b',1.6);A.y=G.y-300;if(G.hearts<=0)G.wiped=true;}
      if(Math.random()<dt*6)G.shake=Math.max(G.shake,0.08);}
  }

  if(G.phase==='ski'&&G.y>=run.len){G.phase='finish';G.finT=0;sfx.party();AudioK.setSong('disco');AudioK.setHype(true);setBanner('FINISH!',`${G.followers.length} CREW MADE IT DOWN`,PAL.O,2.2);G.air=null;}
  if(G.phase==='finish'){if(G.v<4){G.finT+=dt;if(G.finT>3.2)finishRun(false);}}

}
function updGrind(dt,ix){ // balance on the rail: the lean grows on its own, steer against it to stay on
  const g=G.grind,o=g.o,run=G.run;g.t+=dt;G.ang=0;G.v+=(Math.max(110,run.cruise*0.8)-G.v)*Math.min(1,dt*2);
  g.bal+=(g.bal*(o.box?1.0:1.7)+Math.sign(g.bal||1)*(o.box?0.15:0.3)+ix*2.6)*dt;

function airH(){const A=G.air;if(!A)return 0;const u=Math.min(1,A.t/A.dur);return 4*A.hgt*u*(1-u);}
function trailAt(s){const tr=G.trail;if(!tr.length)return{x:G.x,y:G.y};

// ---------- results and the handoff back to the main game ----------
function finishRun(wiped){
  const run=G.run,crowd=wiped?0:G.followers.length,hearts=wiped?0:G.hearts;
  const timeBonus=wiped?0:Math.max(0,Math.round((run.par-G.time)*10));
  const score=G.carrots*10+G.tpts+crowd*50+hearts*100+timeBonus;
  const k=run.len/6600,rank=wiped?'PATROL PICKUP':score<700*k?'SNOWPLOW':score<1300*k?'SHREDDER':score<2100*k?'RIPPER':'LEGEND OF THE HILL';
  const result={type:'skidown:result',crew:G.crew,run:run.id,seed:G.seed,score,rank,carrots:G.carrots,gold:G.gold,crowd,trickPoints:G.tpts,tricks:G.tricksDone,
    bestCombo:G.bestCombo,time:Math.round(G.time*10)/10,hearts,crashes:G.crashes,wipeout:wiped,shopPoints:G.carrots+crowd};
  const bk=G.run.id+':'+G.crew,b=bests(),isBest=!b[bk]||score>b[bk];if(isBest&&score>0){b[bk]=score;ls.set('skidown-best',JSON.stringify(b));}
  G.result=result;G.phase='done';G.isBest=isBest&&score>0;
  setMode('results');AudioK.setSong(wiped?'map':'house');AudioK.setHype(false);
  const row=(k,v,cls='')=>`<div class="k ${cls}">${k}</div><div class="v ${cls}">${v}</div>`;
  $('tally').innerHTML=
    row(`Carrots ${G.carrots}${G.gold?' (golden!)':''} x10`,G.carrots*10)+
    row(`Tricks ${G.tricksDone}${G.bestCombo?` (best ${G.bestCombo})`:''}`,G.tpts)+
    row(`Crew down ${crowd} x50`,crowd*50)+
    row(`Hearts left ${hearts} x100`,hearts*100)+
    row(wiped?'Time bonus (wiped out)':`Time ${result.time}s (par ${run.par}s)`,timeBonus)+
    row(`TOTAL${G.isBest?' NEW BEST':''}`,score,'tot');
  const rb=$('resBtns');rb.innerHTML='';
  if(EMBED){rb.appendChild(mkBtn('start','BACK TO JAK',exitToHost));}
  else{rb.appendChild(mkBtn('start','RUN AGAIN',()=>startRun()));rb.appendChild(mkBtn('start quiet','CHANGE RIDER',toMenu));}
  // the main game listens for this when Ski Down runs inside it
  try{if(typeof SkiDown.onFinish==='function')SkiDown.onFinish(result);}catch(e){}
  try{if(window.parent&&window.parent!==window)window.parent.postMessage(result,'*');}catch(e){}
}
function exitToHost(){try{if(typeof SkiDown.onExit==='function')SkiDown.onExit(G&&G.result);}catch(e){}
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'skidown:exit',result:G&&G.result},'*');}catch(e){}}

  // Jak waits at the top of the run
  const jt=-58-camY,hop=G.phase==='intro'?hopState():null;
  if(hop&&(hop.inside||hop.u<0.55))drawHop(hop,camY); // still climbing out: Jak's body hides the legs
  if(jt>-40)drawJakView(116,jt,{dir:'up',t:T,lights:true,wiggle:!!hop&&hop.u<0.2&&!hop.inside});
  drawFinish(run.len,camY);
  // everything on the slope, back to front
  const list=[];const i0=lowerBound(G.objs,camY-40);
  for(let i=i0;i<G.objs.length;i++){const o=G.objs[i];if(o.y>camY+H+40)break;if(!o.dead)list.push(o);}
  G.followers.forEach((f,i)=>list.push({k:'f',x:f.x,y:f.y,col:f.col,i}));
  if(!hop)list.push({k:'me',x:G.x,y:G.y});else if(!hop.inside&&hop.u>=0.55)list.push({k:'hop',x:128,y:-1,hop});
  list.sort((a,b)=>a.y-b.y);
  for(const o of list){const sy=o.y-camY;
    switch(o.k){
      case'tree':shadow(o.x,sy+1,14);drawTree(Math.round(o.x-8),Math.round(sy-26));break;
      case'rock':drawRock(Math.round(o.x),Math.round(sy));break;
      case'jump':drawKicker(Math.round(o.x),Math.round(sy),o.size);break;
      case'cliff':drawCliff(o,Math.round(sy));break;
      case'pillow':drawPillow(Math.round(o.x),Math.round(sy),o.w);break;
      case'mogul':drawMogul(Math.round(o.x),Math.round(sy));break;
      case'rail':drawRail(o,Math.round(sy));break;
      case'carrot':drawCarrot(Math.round(o.x-5),Math.round(sy-18),T,false);break;
      case'gold':drawCarrot(Math.round(o.x-5),Math.round(sy-18),T,true);if(Math.floor(T/150)%2)R(o.x-7,sy-20,1,1,'#fff');break;
      case'fan':drawFan(o,Math.round(sy));break;
      case'grump':{const yell=o.yellT>0;drawGrump(Math.round(o.x-6),Math.round(sy-18),T,yell,G.x<o.x?-1:1);break;}
      case'f':{if((G.phase==='finish'&&G.finT>0.4)||G.phase==='done'){const a=o.i/Math.max(1,G.followers.length)*Math.PI*2+T/2000,jx=128+Math.cos(a)*(34+(o.i%3)*10),jy=run.len+80+Math.sin(a)*14;
          G.followers[o.i].x+=(jx-G.followers[o.i].x)*0.08;G.followers[o.i].y+=(jy-G.followers[o.i].y)*0.08;
          drawDancer(Math.round(o.x-5),Math.round(sy-14),T+o.i*90,o.col,o.i%2?'#3a2418':'#ffd23f');}
        else{shadow(o.x,sy+1,10);drawSkier(Math.round(o.x-5),Math.round(sy-15),T+o.i*70,o.col);}break;}
      case'me':drawRider(G.x,sy);break;
      case'hop':drawHop(o.hop,camY);break;
    }}
  // grump yells on top
  for(let i=i0;i<G.objs.length;i++){const o=G.objs[i];if(o.y>camY+H+40)break;if(o.k==='grump'&&o.yellT>0)bubble(o.x,o.y-camY-20,['KEEP IT','DOWN!']);}
  G.lost.forEach(f=>{const a=Math.min(1,f.life);ctx.globalAlpha=a;drawSkier(Math.round(f.x-5),Math.round(f.y-camY-15),T,f.col);ctx.globalAlpha=1;});
  if(G.phase==='over'){const px=G.x+(G.overT<1.2?(1.2-G.overT)*80:0);drawPatrol(px,G.y-camY+10);}
  G.parts.forEach(p=>R(p.x,p.y-camY,2,2,p.col));
  if(run.night)drawNightSlope(camY,list);
  // avalanche wall
  const A=G.aval;if(A.on&&G.phase==='ski'){const ay0=A.y-camY;if(ay0<=-30&&ay0>-160){const k=1-(-30-ay0)/130;for(let i=0;i<14;i++){const bx=(i*19+T*0.05)%W,by=16+Math.abs(Math.sin(T/120+i))*6*k;R(bx,by,3,2,'#ffffff');R(bx+1,by+2,2,1,'#c8d6ee');}txt('RUMBLE',128,18,'#ff6b6b',8,'center');}}
  if(A.on){const ay=Math.round(A.y-camY);if(ay>-30){
    // a churning blue-gray slide with a dark leading edge so it reads against white snow
    R(0,0,W,Math.max(0,ay-14),'#b4c4e2');
    for(let y=0;y<ay-14;y+=5){const off=Math.round((T*0.06+y*7)%12);for(let x=-12+off;x<W;x+=12)R(x,y,5,2,'#d6e0f4');}
    for(let x=0;x<W;x+=4){const wob=Math.round(Math.sin(x*0.3+T/90)*4+Math.sin(x*0.11-T/140)*3);
      R(x,ay-16+wob,4,12,(x>>2)%3?'#e8eefb':'#ffffff');R(x,ay-4+wob,4,2,'#8fa4d0');R(x,ay-2+wob,4,1,'#5a6a94');}
    for(let k=0;k<12;k++){const bx=(k*53+T*0.08)%W,by=ay-8+Math.sin(T/100+k)*7;R(bx-1,by-1,5,5,'#5a6a94');R(bx,by,3,3,'#ffffff');}}}
  ctx.restore();
  G.floats.forEach(f=>txt(f.text,f.x,f.y-camY-(1.1-f.t)*24,f.col,8,'center'));
  drawHUD();
  if(G.phase==='intro'){const cy=Math.max(Math.round(H*0.6),150),h=hopState();
    txt(run.name,128,cy,'#fff',8,'center');txt(h.landed?'READY':'HOP OUT!',128,cy+14,PAL.O,16,'center');
    txt(coarse?'STICK DOWN = TUCK':'DOWN = TUCK',128,cy+44,'#5a4a8a',8,'center','#ffffff');txt(coarse?'TRICK IN THE AIR':'SPACE = TRICK IN AIR',128,cy+56,'#5a4a8a',8,'center','#ffffff');}
  if(G.banner){const b=G.banner,u=1-b.t/b.d,pop=u<0.1?u*10:1,y=46+Math.round((1-pop)*-20);
    txt(b.text,128,y,b.col,16,'center');if(b.sub)txt(b.sub,128,y+22,'#fff',8,'center');}
  if(paused){R(0,0,W,H,'rgba(13,7,24,0.35)');}
}
function drawHUD(){
  R(0,0,W,15,'rgba(20,11,34,0.82)');
  for(let i=0;i<G.maxH;i++)heart(3+i*9,4,i<G.hearts?'#ff3b5c':'#4a3a5a');
  let x=6+G.maxH*9;
  R(x+2,3,1,3,PAL.N);R(x+4,2,1,4,PAL.N);for(let r=0;r<6;r++)R(x+3-Math.floor((6-r)/2.5),6+r,Math.max(1,Math.round((6-r)/1.4)),1,PAL.O);
  txt(String(G.carrots),x+9,4,'#ff9a4d',8);x+=14+String(G.carrots).length*8;
  R(x+1,3,4,3,PAL.SK);R(x,6,6,5,'#3ad06a');R(x+1,11,1,2,'#2b2b44');R(x+4,11,1,2,'#2b2b44');
  txt(String(G.followers.length),x+9,4,'#3ad06a',8);
  const live=G.carrots*10+G.tpts+G.followers.length*50;txt(String(live),W-4,4,PAL.Y,8,'right');
  // progress down the run
  const top=22,len=Math.max(60,Math.min(H-50,CTLY-34)),u=Math.max(0,Math.min(1,G.y/G.run.len));
  R(W-8,top,5,len,'rgba(20,11,34,0.55)');R(W-7,top+1,3,Math.round((len-2)*u),PAL.O);
  if(G.aval.on){const au=Math.max(0,Math.min(1,G.aval.y/G.run.len));R(W-10,top+Math.round((len-2)*au),9,2,'#ffffff');}
  R(W-9,top+len,7,5,PAL.K);R(W-8,top+len+1,2,2,'#fff');R(W-6,top+len+1,2,2,'#140b22');R(W-8,top+len+3,2,1,'#140b22');R(W-6,top+len+3,2,1,'#fff');
}
const PORT_X0=14,PORT_Y=70;
function drawMenu(){
  const run=RUN_BY[sel.run];
  sky(run.sky[0],run.sky[1]);stars(T,run.night?70:30);if(run.night){R(206,22,12,12,'#fff3c0');R(204,24,16,8,'#fff3c0');R(210,24,4,3,'#e8dca0');}
  mountains(150,70,run.night?'#1c2240':'#3b2a63',run.night?'#9aa8d4':'#eef3ff',1.3);mountains(168,44,run.night?'#141832':'#2a1a48',run.night?'#7584b4':'#cfdcf5',2.1);
  if(run.night)for(let k=0;k<6;k++){const lx=20+k*44,ly=150-((k*37)%30);R(lx,ly,1,6,'#3a3a48');R(lx-1,ly-1,3,2,'#fff6c8');}
  R(0,168,W,H-168,'#eef3ff');for(let i=0;i<24;i++)R((i*41)%W,172+(i*13)%46,3,1,'#cfdcf5');
  for(let i=0;i<7;i++)drawTree(i*40-6+(i%2)*10,150+(i%3)*3);
  if(run.night){ctx.globalAlpha=0.5;R(0,140,W,H-140,'#0a1030');ctx.globalAlpha=1;}
  snowfall(T,40,0.03);
  txt('SKI DOWN',128,14,PAL.O,16,'center');txt('A LEGEND OF JAK MINI GAME',128,38,'#a596c4',8,'center');
  CREW.forEach((c,i)=>{const x=PORT_X0+i*60,on=c.id===sel.crew;
    if(on){R(x-4,PORT_Y-4,56,56,Math.floor(T/300)%2?PAL.Y:PAL.O);}else R(x-2,PORT_Y-2,52,52,PAL.K);
    drawPortrait(x,PORT_Y,2,c.port);});
  const c=CREW_BY[sel.crew];
  R(8,126,240,40,'rgba(20,11,34,0.78)');
  txt(c.name,128,131,PAL.Y,8,'center');txt(c.role,128,142,'#a596c4',8,'center');txt(c.perk,128,153,'#5fe8ff',8,'center');
  // the chosen rider carving back and forth
  const px=128+Math.sin(T/900)*70,b=Math.max(-2,Math.min(2,Math.round(Math.cos(T/900)*2.2)));
  const rc=riderCanvas(sel.crew,'front',b,false);shadow(px,202,12);ctx.drawImage(rc,Math.round(px-12),179);
  if(Math.floor(T/500)%2)txt(coarse?'TAP DROP IN BELOW':'PRESS ENTER TO DROP IN',128,210,'#140b22',8,'center','#ffffff');
}
function drawResults(){
  drawGame();
  const r=G.result;if(!r)return;
  R(0,22,W,62,'rgba(13,7,24,0.82)');
  txt(r.wipeout?'WIPED OUT':'RUN COMPLETE',128,28,r.wipeout?'#ff6b6b':PAL.Y,8,'center');
  txt(String(r.score),128,42,'#fff',16,'center');
  txt(r.rank,128,64,G.isBest?PAL.O:'#5fe8ff',8,'center');
  if(G.isBest&&Math.floor(T/300)%2)txt('NEW BEST!',128,74,PAL.Y,8,'center');
}
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-(last||now))/1000));last=now;
  try{update(dt);
    ctx.imageSmoothingEnabled=false;
    if(mode==='menu')drawMenu();else if(mode==='results')drawResults();else if(G)drawGame();
  }catch(e){console.error(e);}
  requestAnimationFrame(frame);
}

// ---------- public handle so the main game can launch Ski Down later ----------
const SkiDown=window.SkiDown={
  version:'0.1',
  crew:CREW.map(c=>c.id),runs:RUNS.map(r=>r.id),
  start(opts={}){startRun(opts);},   // {crew:'bk'|'zoo'|'unk'|'ritz', run:'marshall'|'bridger'|'snowbird' or a custom run object, seed, hearts}
  onFinish:null,                      // called with the result object when a run ends
  onExit:null,                        // called when the player taps BACK TO JAK (embedded mode)
  _state:()=>G,_chute:y=>({c:chuteC(G.cp,y),hw:chuteW(G.cp,y)/2})
};

renderMenu();setMode('menu');
if(params.get('autostart')==='1')startRun({crew:sel.crew,run:sel.run,seed:params.get('seed')?+params.get('seed'):undefined});
requestAnimationFrame(frame);
})();
</script>
