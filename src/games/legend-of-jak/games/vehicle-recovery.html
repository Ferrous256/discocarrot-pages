<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Same arcade cabinet look as The Legend of Jak and the other mini games: 16-bit screen on top, menu or touch controls underneath. */
:root{
  --bg:#0d0718;--panel:#1b1030;--panel-edge:#3b2a63;--ink:#fff4e6;--dim:#a596c4;
  --carrot:#ff5c00;--pink:#ff4fd8;--cyan:#5fe8ff;--gold:#ffd23f;
  --font-pixel:'Press Start 2P','Courier New',monospace;--font-body:'VT323','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body[data-mode="play"]{overflow:hidden;position:fixed;inset:0;width:100%;background:#000}
button,.chip,.start{touch-action:manipulation}
[hidden]{display:none!important}
#app{box-sizing:border-box;max-width:860px;margin:0 auto;padding-block:8px 12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:10px;min-height:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-family:var(--font-pixel);font-size:10px;letter-spacing:.08em;color:var(--carrot);text-shadow:2px 2px 0 #3a1200}
.brand small{display:block;color:var(--dim);font-size:7px;margin-top:5px;letter-spacing:.12em}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:var(--font-pixel);font-size:8px;letter-spacing:.06em;background:var(--panel);color:var(--ink);border:2px solid var(--panel-edge);padding:9px 10px;cursor:pointer;box-shadow:0 3px 0 #000}
.chip:hover{border-color:var(--cyan)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.chip.on{border-color:var(--gold);color:var(--gold)}
.chip:focus-visible,.start:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{position:relative;width:min(100%, calc((100dvh - 240px) * 1.1428));min-width:min(100%,280px);aspect-ratio:256/224;max-width:100%;margin:0 auto;background:#000;border:4px solid var(--panel-edge);box-shadow:0 0 0 4px #000,0 0 40px rgba(255,92,0,.25);box-sizing:border-box}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:pointer}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:rgba(13,7,24,.86);padding:16px}
.overlay h2{font-family:var(--font-pixel);font-size:clamp(11px,3.4vw,18px);line-height:1.5;margin:0;color:var(--gold);text-shadow:3px 3px 0 #3a1200}
.overlay p{font-size:clamp(18px,4.6vw,24px);margin:0}
.under{width:min(100%, calc((100dvh - 240px) * 1.1428));min-width:min(100%,280px);max-width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border:4px solid var(--ink);box-shadow:inset 0 0 0 3px #000,0 0 0 3px #000;padding:12px 14px 14px;display:grid;gap:10px}
.lbl{font-family:var(--font-pixel);font-size:8px;color:var(--dim);letter-spacing:.08em}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.status{font-size:clamp(18px,4.4vw,22px);color:var(--dim);line-height:1.05}
.status b{color:var(--gold);font-weight:normal}
.start{font-family:var(--font-pixel);font-size:13px;letter-spacing:.1em;background:var(--carrot);color:#fff;border:4px solid #fff;box-shadow:0 0 0 3px #000,0 5px 0 3px #000;padding:14px 18px;cursor:pointer;animation:pulse 1.1s steps(2) infinite}
.start:active{transform:translateY(3px)}
.start.quiet{animation:none;background:var(--panel);font-size:10px;padding:11px 12px}
@keyframes pulse{50%{background:var(--pink)}}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:12px;min-height:120px;touch-action:none}
.controls .pad{grid-column:2;grid-row:1}
.controls #trickBtn{grid-column:3;grid-row:1;justify-self:end}
body[data-stick="left"] .controls .pad{grid-column:1;justify-self:start}
body[data-stick="right"] .controls .pad{grid-column:3;justify-self:end}
body[data-stick="right"] .controls #trickBtn{grid-column:1;justify-self:start}
/* a run fills the whole screen: the slope runs edge to edge, the stick and TRICK float over the snow */
body[data-mode="play"] #app{position:fixed;inset:0;max-width:none;margin:0;min-height:0;gap:0;padding:env(safe-area-inset-top,0px) 0 0;display:flex;flex-direction:column;align-items:center}
body[data-mode="play"] .topbar{align-self:stretch;flex:none;justify-content:flex-end;padding:4px max(8px, env(safe-area-inset-right, 0px)) 4px max(8px, env(safe-area-inset-left, 0px))}
body[data-mode="play"] .brand{display:none}
body[data-mode="play"] .topbar .btns{gap:6px;flex-wrap:nowrap}
body[data-mode="play"] .topbar .chip{padding:6px 8px;font-size:7px;box-shadow:none;opacity:.9}
body[data-mode="play"] .screen{flex:none;border:0;box-shadow:none;min-width:0;max-width:none;margin:0}
body[data-mode="play"] .under{position:fixed;left:0;right:0;bottom:0;width:auto;max-width:none;min-width:0;margin:0;z-index:5;pointer-events:none;
  padding:0 max(18px, calc(env(safe-area-inset-right, 0px) + 12px)) max(18px, calc(env(safe-area-inset-bottom, 0px) + 10px)) max(18px, calc(env(safe-area-inset-left, 0px) + 12px))}
body[data-mode="play"] .controls{pointer-events:auto;background:transparent}
body[data-mode="play"] .pad{background:radial-gradient(circle,rgba(42,26,72,.5) 0 55%,rgba(27,16,48,.5) 56%);border-color:rgba(255,255,255,.55)}
body[data-mode="play"] #trickBtn{opacity:.92}
/* sideways phone: slope in the middle at full height, stick and TRICK in the side gutters */
body[data-mode="play"].land .under{top:calc(env(safe-area-inset-top,0px) + 34px);justify-content:center;padding-bottom:max(10px, env(safe-area-inset-bottom, 0px))}
body[data-mode="play"].land .controls{width:100%}
body[data-mode="play"].land:not([data-stick="right"]) .controls .pad{grid-column:1;justify-self:start}
#fsMsg{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 48px);transform:translateX(-50%);z-index:40;width:min(86vw,320px);background:var(--panel);border:3px solid var(--gold);padding:10px;font-family:var(--font-pixel);font-size:8px;line-height:1.7;color:var(--ink);text-align:center}
#trickBtn{width:104px;height:104px;border-radius:50%;padding:0;font-size:11px;background:#1d8fb8;animation:none}
#trickBtn.air{background:var(--carrot);animation:pulse .5s steps(2) infinite}
.pad{flex:none;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,#2a1a48 0 55%,#1b1030 56%);border:4px solid var(--panel-edge);position:relative;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--carrot);border:4px solid #fff;box-shadow:0 4px 0 #000}
.hint{font-size:clamp(17px,4.2vw,21px);color:var(--dim);line-height:1.05;text-align:center}
.hint b{color:var(--gold);font-weight:normal}
.tally{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:clamp(19px,4.8vw,24px);line-height:1.05}
.tally .v{text-align:right;color:var(--ink)}
.tally .k{color:var(--dim)}
.tally .tot{color:var(--gold);font-family:var(--font-pixel);font-size:11px;padding-top:8px;border-top:2px dashed var(--panel-edge);margin-top:4px}
footer{font-family:var(--font-pixel);font-size:7px;color:var(--dim);text-align:center;letter-spacing:.1em;line-height:1.8}
body[data-mode="play"] footer{display:none}
#gasBtn{width:84px;height:84px;border-radius:50%;padding:0;font-size:10px;background:#1f7a44;animation:none}
#gasBtn.hot{background:#3ad06a}
#trickBtn.hold{background:var(--carrot);animation:none}
body.pull .controls .pad{display:none}
body.pull .controls #gasBtn{grid-column:1;grid-row:1;justify-self:start}
body.pull .controls #trickBtn{grid-column:3;grid-row:1;justify-self:end}
#rig{pointer-events:auto;max-height:min(60vh,430px);overflow-y:auto;gap:7px;padding:10px 12px 12px}
#rig .chip{font-size:7px;padding:8px;line-height:1.5;text-align:left}
#rig .chip:disabled{opacity:.35;cursor:not-allowed}
#rig .start:disabled{opacity:.5;animation:none;cursor:not-allowed}
#rig .status{font-size:clamp(16px,4.2vw,20px)}
#rig .tipline{color:var(--gold)}
body.land #rig{margin-top:auto;max-height:60vh;gap:4px;padding:8px 10px}
body.land #rig .status{font-size:16px}
body.land #rig .chip{padding:5px 7px}
body.land #rig .start{font-size:10px;padding:8px 12px}
@media (prefers-reduced-motion: reduce){.start,#trickBtn.air{animation:none}}
</style>
<div id="app">
  <div class="topbar">
    <div class="brand">DISCO CARROT<small>VEHICLE RECOVERY &middot; JAK MINI GAME</small></div>
    <div class="btns">
      <button class="chip" id="pauseBtn" type="button" hidden>PAUSE</button>
      <button class="chip" id="quitBtn" type="button" hidden>QUIT JOB</button>
      <button class="chip" id="fsBtn" type="button" hidden>FULL SCREEN</button>
      <button class="chip" id="muteBtn" type="button">SOUND: ON</button>
    </div>
  </div>

  <div class="screen" id="screen">
    <canvas id="cv" width="256" height="224" aria-label="Vehicle Recovery, a 16-bit winching and towing mini game"></canvas>
    <div class="overlay" id="overlay" hidden>
      <h2 id="ovTitle">PAUSED</h2>
      <p id="ovText">Tap to keep working</p>
    </div>
  </div>

  <div class="under">
    <div class="panel" id="menu">
      <div class="lbl">RIGGER</div>
      <div class="row" id="crewRow"></div>
      <div class="lbl">CALL</div>
      <div class="row" id="runRow"></div>
      <div class="status" id="menuStatus"></div>
      <div class="row" id="stickRow"><span class="lbl">STICK</span></div>
      <div class="row"><button class="start" id="goBtn" type="button">ROLL OUT</button></div>
    </div>

    <div class="controls" id="controls" hidden>
      <button class="start" id="gasBtn" type="button" hidden>GAS</button>
      <button class="start" id="trickBtn" type="button">PARK</button>
      <div class="pad" id="pad"><div class="knob" id="knob"></div></div>
    </div>
    <div class="panel" id="rig" hidden>
      <div class="status" id="rigInfo"></div>
      <div class="lbl">ANCHOR JAK</div>
      <div class="row" id="rigAnchor"></div>
      <div class="lbl">LINE</div>
      <div class="row" id="rigLine"></div>
      <div class="lbl">HOOK TO (IT TAKES THE FULL FORCE)</div>
      <div class="row" id="rigHook"></div>
      <div class="lbl">SAFETY</div>
      <div class="row" id="rigSafe"></div>
      <div class="row"><button class="start" id="pullGo" type="button">START PULL</button><button class="start quiet" id="moveJak" type="button">MOVE JAK</button></div>
    </div>

    <div class="panel" id="results" hidden>
      <div class="tally" id="tally"></div>
      <div class="row" id="resBtns"></div>
    </div>
  </div>
  <footer>THIOKOL ENTERTAINMENT &middot; MISSOULA, MONTANA &middot; MINI GAME SANDBOX</footer>
</div>

<script>
// Jak soundtrack engine: 16-bit house and techno, all synthesized. makeJakMusic(audioContext, outputNode)
function makeJakMusic(ac,out){
  'use strict';
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  // signal chain: instruments -> bus -> warm lowpass -> glue compressor -> level -> out
  const bus=ac.createGain();
  const warm=ac.createBiquadFilter();warm.type='lowpass';warm.frequency.value=8500;warm.Q.value=0.4;
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=10;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.2;
  const level=ac.createGain();level.gain.value=1.4;
  bus.connect(warm);warm.connect(comp);comp.connect(level);level.connect(out);
  const duck=ac.createGain();duck.connect(bus); // melodic parts pump against the kick
  const echo=ac.createDelay(2),fb=ac.createGain(),ehp=ac.createBiquadFilter(),wet=ac.createGain();
  ehp.type='highpass';ehp.frequency.value=700;fb.gain.value=0.33;wet.gain.value=0.4;
  echo.connect(ehp);ehp.connect(fb);fb.connect(echo);ehp.connect(wet);wet.connect(bus);
  const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const pulse=w=>{const n=48,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*w);return ac.createPeriodicWave(re,im);};
  const P25=pulse(0.25),P12=pulse(0.125);

  function vco(type,f,t,stop,det){const o=ac.createOscillator();if(type==='p25')o.setPeriodicWave(P25);else if(type==='p12')o.setPeriodicWave(P12);else o.type=type;
    o.frequency.setValueAtTime(f,t);if(det)o.detune.value=det;o.start(t);o.stop(stop);return o;}
  function vca(t,v,dur,dest,attack=0.002){const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(dest);return g;}
  function nz(t,dur,ftype,freq,v,q=0.7,dest=bus){const s=ac.createBufferSource();s.buffer=nb;const f=ac.createBiquadFilter();f.type=ftype;f.frequency.value=freq;f.Q.value=q;
    s.connect(f);f.connect(vca(t,v,dur,dest,0.001));s.start(t,Math.random()*0.3);s.stop(t+dur+0.02);return f;}

  const I={
    kick(t,v){const o=vco('sine',155,t,t+0.42);o.frequency.exponentialRampToValueAtTime(47,t+0.11);o.connect(vca(t,v,0.38,bus,0.001));nz(t,0.012,'highpass',2600,v*0.25);
      duck.gain.cancelScheduledValues(t);duck.gain.setValueAtTime(0.28,t);duck.gain.linearRampToValueAtTime(1,t+0.22);},
    clap(t,v){[0,0.011,0.022].forEach(d=>nz(t+d,0.018,'bandpass',1400,v*0.7,0.9));nz(t+0.03,0.16,'bandpass',1250,v*0.45,0.8);},
    hat(t,v,open){nz(t,open?0.17:0.035,'highpass',open?7000:8200,v);},
    crash(t,v){nz(t,1.7,'highpass',3800,v);},
    riser(t,dur,v){const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=2.5;
      f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(7000,t+dur);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+dur);g.gain.linearRampToValueAtTime(0.0001,t+dur+0.03);
      s.connect(f);f.connect(g);g.connect(bus);s.start(t);s.stop(t+dur+0.05);},
    tom(t,v){const o=vco('sine',210,t,t+0.2);o.frequency.exponentialRampToValueAtTime(85,t+0.16);o.connect(vca(t,v,0.18,bus));},
    bass(t,m,dur,o){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=o.q||1;const c=o.cut||600;
      f.frequency.setValueAtTime(Math.min(16000,c*(o.acc?3.2:1.8)),t);f.frequency.exponentialRampToValueAtTime(Math.max(70,c*0.55),t+dur);
      vco(o.type||'square',mtof(m),t,t+dur+0.03).connect(f);f.connect(vca(t,o.v||0.25,dur,duck,0.004));},
    stab(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(3400,t);f.frequency.exponentialRampToValueAtTime(800,t+dur);
      const g=vca(t,v*1.6,dur,duck,0.003);f.connect(g);ms.forEach((m,j)=>vco('p25',mtof(m),t,t+dur+0.03,j%2?7:-7).connect(f));},
    pad(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1100;const g=ac.createGain();
      g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.35);g.gain.setValueAtTime(v,t+dur*0.75);g.gain.linearRampToValueAtTime(0.0001,t+dur);
      f.connect(g);g.connect(duck);ms.forEach((m,j)=>vco('sawtooth',mtof(m),t,t+dur+0.05,j%2?9:-9).connect(f));},
    lead(t,m,dur,v){const o=vco('p12',mtof(m),t,t+dur+0.05);const g=vca(t,v,dur,bus,0.004);o.connect(g);g.connect(echo);},
    bell(t,m,dur,v){const o=vco('triangle',mtof(m),t,t+dur+0.05),o2=vco('p25',mtof(m+12),t,t+dur*0.5);const g=vca(t,v,dur,bus,0.002);o.connect(g);o2.connect(vca(t,v*0.25,dur*0.5,g));g.connect(echo);},
    tri(t,m,dur,v){vco('triangle',mtof(m),t,t+dur+0.05).connect(vca(t,v,dur,bus,0.01));},
    snare(t,v){nz(t,0.16,'bandpass',1900,v*0.7,0.7);const o=vco('triangle',200,t,t+0.1);o.frequency.exponentialRampToValueAtTime(150,t+0.08);o.connect(vca(t,v*0.5,0.09,bus));},
    saw3(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=3600;const g=vca(t,v,dur,duck,0.004);f.connect(g);g.connect(echo);
      for(const m of ms)for(const d of [-14,0,14])vco('sawtooth',mtof(m),t,t+dur+0.03,d).connect(f);},
    wobble(t,m,dur,rate,v){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=9;f.frequency.value=650;
      const lfo=vco('sine',rate,t,t+dur+0.05),lg=ac.createGain();lg.gain.value=560;lfo.connect(lg);lg.connect(f.frequency);
      vco('sawtooth',mtof(m),t,t+dur+0.03).connect(f);vco('square',mtof(m-12),t,t+dur+0.03,5).connect(f);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.setValueAtTime(v,t+dur-0.03);g.gain.linearRampToValueAtTime(0.0001,t+dur);f.connect(g);g.connect(duck);
      vco('sine',mtof(m-12),t,t+dur+0.03).connect(vca(t,v*0.9,dur,duck,0.01));},
    reese(t,m,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=2;f.frequency.value=520;
      vco('sawtooth',mtof(m),t,t+dur+0.03,-18).connect(f);vco('sawtooth',mtof(m),t,t+dur+0.03,18).connect(f);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.02);g.gain.setValueAtTime(v,t+dur*0.85);g.gain.linearRampToValueAtTime(0.0001,t+dur);f.connect(g);g.connect(duck);
      vco('sine',mtof(m-12),t,t+dur+0.03).connect(vca(t,v*0.8,dur,duck,0.01));},
    // house piano: bright hammer on top of a soft body
    piano(t,ms,dur,v){const g=vca(t,v,dur,duck,0.002);const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(5200,t);f.frequency.exponentialRampToValueAtTime(1400,t+dur);f.connect(g);
      ms.forEach((m,j)=>{vco('triangle',mtof(m),t,t+dur+0.03,j%2?4:-4).connect(f);vco('p25',mtof(m+12),t,t+0.09).connect(vca(t,0.5,0.08,f));});},
    // electric piano for garage and liquid: sine plus a little bell, slow tremolo
    keys(t,ms,dur,v){const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(duck);

  const land=play&&vw>vh*1.05;document.body.classList.toggle('land',land);

    const availW=vw,availH=Math.max(200,vh-padT-topbarEl.offsetHeight);
    if(land)w=Math.max(256,Math.min(480,Math.round(224*availW/availH/2)*2));
    else h=Math.max(224,Math.min(600,Math.round(256*availH/availW)));
    const sc=Math.min(availW/w,availH/h);
    screenEl.style.width=Math.floor(w*sc)+'px';screenEl.style.aspectRatio=`${w}/${h}`;
  }else{screenEl.style.width='';screenEl.style.aspectRatio='';}
  if(w!==W||h!==H){W=w;H=h;cv.width=w;cv.height=h;ctx.imageSmoothingEnabled=false;}
  CTLY=9999;OVY=H;
  if(play){const sr=screenEl.getBoundingClientRect();if(sr.height>0){let top=sr.bottom;const els=[rigEl];if(!land)els.push(controlsEl);
    for(const el of els){if(el.hidden)continue;const r=el.getBoundingClientRect();if(r.height>0)top=Math.min(top,r.top);}
    OVY=Math.round((top-sr.top)/(sr.height/H));}}

function pose(s){const J=G.job,V=G.V,K=J.terrain,x=lerp(G.xs,G.xe,s),a=x-V.L*0.33,b=x+V.L*0.33,ya=groundAt(K,a),yb=groundAt(K,b);

  const J=G.job,V=G.V,r=G.rig,tree=treeInReach(),grip=jakGrip(),est=Math.round(resistBase(G.s)*G.dig/100)*100;
  $('rigInfo').innerHTML=`<b>${V.name}</b>: stuck force about <b>${fmt(est)} LB</b>. Jak's winch line holds <b>${fmt(LINE_LB)} LB</b>.${jakOnIce()?' Jak is parked <b>on ice</b>.':''}`+
    (G.lastTip?`<br><span class="tipline">TIP: ${G.lastTip}</span>`:'');
  const row=(id,items,cur,set)=>{const el=$(id);el.innerHTML='';items.forEach(it=>el.appendChild(mkBtn('chip'+(it.id===cur?' on':''),it.label,()=>{set(it.id);sfx.tick();renderRig();},it.dis)));};
  row('rigAnchor',[{id:'jak',label:`JAK ONLY (GRIP ${fmt(grip)})`},{id:'tree',label:tree==null?'TREE (NONE IN REACH)':`TIE BACK TO TREE (${fmt(TREE_LB)})`,dis:tree==null},
    {id:'dead',label:`DIG A DEADMAN (${fmt(DEAD_LB)}${G.dug?')':', +25 S)'}`}],r.anchor,v=>r.anchor=v);
  row('rigLine',[{id:1,label:'STRAIGHT PULL 1:1'},{id:2,label:'SNATCH BLOCK 2:1 (HALF LOAD, HALF SPEED)'}],r.ma,v=>r.ma=v);
  row('rigHook',V.points.map(p=>({id:p.id,label:G.broken[p.id]?`${p.name} (BROKEN)`:`${p.name} (${fmt(p.lb)})`,dis:G.broken[p.id]})),r.hook,v=>r.hook=v);
  row('rigSafe',[{id:true,label:`LINE DAMPER ON${G.damped?'':' (+5 S)'}`},{id:false,label:'NO DAMPER'}],r.damper,v=>r.damper=v);
  $('pullGo').disabled=!r.hook;$('pullGo').textContent=r.hook?'START PULL':'PICK A HOOK POINT';
}
function startPull(){
  if(!G||G.phase!=='rig')return;const r=G.rig;if(!r.hook)return;
  if(jakFront()<minFront()){setPhase('drive');setBanner('TOO FAR!','THE LINE WON\'T REACH. DRIVE CLOSER','#ff9a4d',1.6);return;}
  if(r.anchor==='tree'&&treeInReach()==null)r.anchor='jak';
  if(r.anchor==='dead'&&!G.dug){G.dug=true;G.time+=25;floatText(G.jak.x-20,-50,'+25 S DIGGING','#ffd23f');sfx.dig();}
  if(r.damper&&!G.damped){G.damped=true;G.time+=5;}
  G.hold=r.anchor==='tree'?TREE_LB:r.anchor==='dead'?DEAD_LB:0;G.P.T=0;sfx.clank();setPhase('pull');
}

// ---------- the pull ----------
function curLimits(){const r=G.rig,pt=G.V.points.find(q=>q.id===r.hook),hold=r.anchor==='jak'?jakGrip():G.hold;
  return[{lb:LINE_LB,name:'LINE'},{lb:hold,name:r.anchor==='jak'?'JAK':r.anchor==='tree'?'TREE':'DEADMAN'},{lb:pt?pt.lb/r.ma:1e9,name:'HOOK'}];}
function gas(){
  if(mode!=='play'||paused||!G||G.phase!=='pull')return;const P=G.P;if(P.gasCd>0)return;
  P.gasT=1.4;P.gasCd=2.6;sfx.rev();const need=resist(G.s)/G.rig.ma,w=vehWheels();
  if(P.T<need*0.4){G.dig=Math.min(1.3,G.dig*1.06);floatText(w[0].x,w[0].y-40,'DIGGING IN!','#ff9a4d');}
  else floatText(w[0].x,w[0].y-40,'GAS!','#3ad06a');
  for(const p of w)for(let i=0;i<6;i++)G.parts.push({x:p.x,y:p.y,vx:30+Math.random()*50,vy:-30-Math.random()*40,life:0.6,col:i%2?'#ffffff':'#c8d6ee',g:140});
  const ex=toWorld(pose(G.s),G.V.L*0.5,-6);for(let i=0;i<4;i++)G.parts.push({x:ex.x,y:ex.y,vx:20+Math.random()*20,vy:-10-Math.random()*20,life:0.8,col:'#6a6a7a',g:-20});
}
function updPull(dt){
  const P=G.P,r=G.rig,ma=r.ma,V=G.V;G.time+=dt;
  if(P.gasT>0)P.gasT-=dt;if(P.gasCd>0)P.gasCd-=dt;
  const Rr=resist(G.s)*(P.gasT>0?1-V.gas:1),need=Rr/ma;
  let moving=false;
  const lim0=Math.min(...curLimits().map(l=>l.lb));
  if(btn.down){if(P.T<need)P.T=Math.min(need,P.T+(P.T<lim0*0.7?3000:900)*dt);if(P.T>=need-1){moving=true;P.T=need*(1+0.012*Math.sin(T/55));}}
  else P.T=Math.max(0,P.T-5200*dt);
  if(moving){const sp=(ma===1?6.5:3.4)*(P.gasT>0?1.25:1);G.s=Math.min(1,G.s+sp*dt/G.pathLen);
    if(Math.random()<dt*12){const w=vehWheels();puff(w[0].x,w[0].y,1,null,30,20);}}
  else if(!btn.down&&!G.job.flat&&P.T*ma<Rr*0.5&&G.s>0)G.s=Math.max(0,G.s-0.5*dt/G.pathLen);
  // what gives first
  const L=curLimits(),pt=V.points.find(q=>q.id===r.hook);
  if(P.T>LINE_LB){snapLine();return;}
  if(pt&&P.T*ma>pt.lb){G.broken[pt.id]=1;r.hook=null;fail('point','RIPPED!',pt.rip);return;}
  if(r.anchor==='jak'){const hold=L[1].lb;if(P.T>hold){G.jak.x+=(5+45*(P.T/hold-1))*dt;G.sliding=0.25;if(Math.random()<dt*8)puff(G.jak.x+90,0,2);
      if(jakFront()>hardMax()){fail('slide','JAK SLID IN!',G.job.flat?`JAK SLID INTO THE ${V.name}`:'JAK SLID TO THE EDGE');return;}}}
  else if(P.T>G.hold){fail('anchor','ANCHOR FAILED!',r.anchor==='tree'?'THE TREE STRAP BROKE':'THE DEADMAN PULLED OUT');return;}
  if(G.sliding>0)G.sliding-=dt;
  // creak when close to the limit
  const lim=Math.min(...L.map(l=>l.lb));G.warnT-=dt;
  if(P.T>lim*0.85&&G.warnT<=0){G.warnT=0.45;sfx.creak();}
  // the danger zone
  const zone=inZone();G.yellT-=dt;
  if(P.T>LINE_LB*0.3&&zone.length){G.unsafeT+=dt;if(G.yellT<=0){G.yellT=2.2;floatText(G.jak.x+44,-46,'STAND CLEAR!','#ff6b6b');sfx.whistle();}}
  AudioK.setWinch(btn.down?(moving?1:0.7):0,P.T/LINE_LB);
  if(G.s>=1)won();
}
function snapLine(){const r=G.rig,zone=inZone(),close=zone.length>0&&!r.damper,h=hookPt();
  G.snap={t:0,x:h.x,y:h.y};
  fail('snap','LINE SNAPPED!',close?'CLOSE CALL! KEEP PEOPLE CLEAR':r.damper?'THE DAMPER KNOCKED IT DOWN':'SPLICED A NEW LINE: +8 S',close);
}
function fail(kind,main,sub,extra){
  G.fails++;G.hearts-=extra?2:1;G.P.T=0;release();AudioK.setWinch(0,0);G.shake=0.45;G.lastTip=G.job.tip;G.time+=8;
  if(kind==='slide'){sfx.hurt();G.jak.x=Math.max(-100,(G.parkX!=null?G.parkX:G.jak.x)-24);G.parkX=G.jak.x;G.dug=false;}else sfx.snap();
  if(kind==='anchor'&&G.rig.anchor==='dead')G.dug=false;
  setBanner(main,sub,'#ff6b6b',2.0);
  if(G.hearts<=0){G.hearts=0;G.phase='over';G.overT=0;controlsEl.hidden=true;rigEl.hidden=true;sfx.over();AudioK.setSong(null);setTimeout(()=>{if(G)setBanner('CALL A WRECKER','JAK NEEDS A BREAK','#ff6b6b',2.4);},1200);}
  else{G.phase='oops';G.oopsT=2.0;controlsEl.hidden=true;gasBtn.hidden=true;document.body.classList.remove('pull');}
}
function won(){
  const J=G.job,V=G.V;G.phase='won';G.wonT=0;release();AudioK.setWinch(0,0);controlsEl.hidden=true;document.body.classList.remove('pull');
  G.fans=J.fans;G.carrots=Math.max(1,J.tips-2*G.fails);
  const p=pose(1);for(let i=0;i<Math.min(J.fans,14);i++)G.dancers.push({x:p.x+V.left+8+((i*13)%(Math.max(30,V.L-10))),y:0,col:FAN_COLS[i%8],hair:i%2?'#3a2418':'#ffd23f',d:i*120});
  G.people.forEach(q=>{if(q.st!=='leave'){q.st='watch';}});
  sfx.party();sfx.honk();AudioK.setHype(true);setBanner('RECOVERED!',`THE ${V.name} IS BACK ON THE ROAD`,PAL.Y,2.6);
}

// ---------- bystanders ----------
function zoneRange(){const a=winchPt().x-4,h=G.rig.hook?hookPt():toWorld(pose(G.s),G.V.left,-8);return[a,Math.min(h.x+6,G.job.flat?h.x+6:G.job.edge)];}
function inZone(){const[a,b]=zoneRange();return G.people.filter(p=>(p.st==='in'||p.st==='watch')&&p.x>a&&p.x<b);}
function pickZoneX(){const[a,b]=zoneRange();return lerp(a+8,Math.max(a+10,b-6),Math.random());}
function spawnPerson(){const r=Math.random;G.people.push({x:G.camX-14,st:'in',tx:pickZoneX(),face:1,ph:r()*999,col:FAN_COLS[Math.floor(r()*8)],skin:SKINS[Math.floor(r()*SKINS.length)],hat:FAN_COLS[Math.floor(r()*8)],waitT:0});}
function shoo(p){p.st='out';p.ox=G.jak.x-6-Math.random()*44;floatText(p.x,-34,'BACK UP!','#ffd23f');sfx.tick();}
function tapScene(e){
  if(!G||G.phase!=='pull'&&G.phase!=='rig')return;
  const r=cv.getBoundingClientRect(),cx=(e.clientX-r.left)/r.width*W,cy=(e.clientY-r.top)/r.height*H,wx=cx+Math.round(G.camX),wy=cy-Math.round(G.g0);
  let best=null,bd=18;for(const p of G.people){if(p.st!=='in'&&p.st!=='watch')continue;const d=Math.abs(p.x-wx)+Math.max(0,Math.abs(wy+9)-12)*0.6;if(d<bd){bd=d;best=p;}}
  if(!best)return;shoo(best);
  if(G.crew==='bk')for(const p of G.people)if(p!==best&&(p.st==='in'||p.st==='watch')&&Math.abs(p.x-best.x)<44)shoo(p);
}
function clearNearest(){if(!G||(G.phase!=='pull'&&G.phase!=='rig'))return;const z=inZone();if(!z.length)return;z.sort((a,b)=>a.x-b.x);shoo(z[0]);if(G.crew==='bk')z.slice(1).forEach(p=>{if(Math.abs(p.x-z[0].x)<44)shoo(p);});}
function updPeople(dt){
  if(G.phase==='rig'||G.phase==='pull'){G.spawnT-=dt;const J=G.job,max=J.id==='bus'?5:3,active=G.people.filter(p=>p.st!=='leave').length;
    if(G.spawnT<=0&&active<max){G.spawnT=lerp(J.crowd[0],J.crowd[1],Math.random());spawnPerson();}}
  for(const p of G.people){
    if(p.st==='in'){const d=p.tx-p.x;p.face=d>=0?1:-1;p.x+=Math.sign(d)*Math.min(Math.abs(d),20*dt);if(Math.abs(d)<1)p.st='watch';}
    else if(p.st==='out'){const d=p.ox-p.x;p.face=d>=0?1:-1;p.x+=Math.sign(d)*Math.min(Math.abs(d),36*dt);if(Math.abs(d)<1){p.st='wait';p.face=1;p.waitT=G.crew==='ritz'?16:8;}}
    else if(p.st==='wait'){if(G.phase==='won')continue;p.waitT-=dt;if(p.waitT<=0){if(Math.random()<0.5){p.st='in';p.tx=pickZoneX();}else p.st='leave';}}
    else if(p.st==='leave'){p.face=-1;p.x-=26*dt;}}
  G.people=G.people.filter(p=>p.st!=='leave'||p.x>G.camX-30);
}

// ---------- update ----------
function updDrive(dt){
  G.time+=dt;const ix=readX();G.jak.v+=(ix*50-G.jak.v)*Math.min(1,dt*3);
  G.jak.x+=G.jak.v*dt;const hm=hardMax()-94;
  if(G.jak.x>hm){G.jak.x=hm;if(G.jak.v>14){G.shake=0.15;floatText(G.jak.x+90,-40,'WHOA, EDGE!','#ff9a4d');sfx.bump();}G.jak.v=0;}
  if(G.jak.x<-170){G.jak.x=-170;G.jak.v=0;}
  if(Math.abs(G.jak.v)>4&&Math.random()<dt*24)G.parts.push({x:G.jak.x+(G.jak.v>0?8:88),y:0,vx:-Math.sign(G.jak.v)*(10+Math.random()*20),vy:-15-Math.random()*20,life:0.4,col:'#ffffff',g:100});
  AudioK.setWinch(0,0);
}
function update(dt){
  T+=dt*1000;
  if(mode==='menu'||!G)return;
  G.parts=G.parts.filter(p=>(p.life-=dt)>0);G.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||120)*dt;});
  G.floats=G.floats.filter(f=>(f.t-=dt)>0);
  if(G.banner&&(G.banner.t-=dt)<=0)G.banner=null;
  if(G.shake>0)G.shake-=dt;
  if(G.snap){G.snap.t+=dt;if(G.snap.t>0.5)G.snap=null;}
  if(mode!=='play'||paused)return;
  switch(G.phase){
    case'dispatch':G.dispT+=dt;if(G.dispT>9)toDrive();break;
    case'drive':updDrive(dt);break;
    case'rig':G.time+=dt;break;
    case'pull':updPull(dt);break;
    case'oops':G.oopsT-=dt;if(G.oopsT<=0)setPhase('rig');break;
    case'won':G.wonT+=dt;if(G.wonT>3.8)finishRun(false);break;
    case'over':G.overT+=dt;if(G.overT>3.4)finishRun(true);break;}
  updPeople(dt);
  if(G.phase==='pull')gasBtn.classList.toggle('hot',G.P.gasCd<=0);
}

// ---------- results and the handoff back to the main game ----------
function finishRun(wiped){
  if(G.phase==='done')return;
  const J=G.job,ok=!wiped,zx=G.crew==='zoo'?1.5:1;
  const pay=ok?J.pay:0,timeB=ok?Math.max(0,Math.round((J.par-G.time)*8)):0;
  const safety=ok?Math.round(Math.max(0,200-G.unsafeT*25)*zx):0,clean=ok&&G.fails===0?Math.round(150*zx):0;
  const fans=ok?G.fans:0,tips=ok?G.carrots:0,hearts=ok?G.hearts:0;
  const score=pay+timeB+safety+clean+fans*50+tips*10+hearts*100;
  const maxS=J.pay+J.par*8*0.55+350*zx+J.fans*50+J.tips*10+G.maxH*100,f=score/maxS;
  const rank=wiped?'CALLED A WRECKER':f<0.45?'ROOKIE RIGGER':f<0.65?'SNOWBANK SAVER':f<0.82?'RECOVERY PRO':'LEGEND OF THE WINCH';
  const result={type:'recovery:result',crew:G.crew,job:J.id,vehicle:J.veh,score,rank,recovered:ok,carrots:tips,fans,time:Math.round(G.time),
    fails:G.fails,unsafeSeconds:Math.round(G.unsafeT*10)/10,hearts,wipeout:wiped,rig:{...G.rig},shopPoints:tips+fans};
  const bk=J.id+':'+G.crew,b=bests(),isBest=!b[bk]||score>b[bk];if(isBest&&score>0){b[bk]=score;ls.set('recovery-best',JSON.stringify(b));}
  G.drawAs=G.phase;G.result=result;G.phase='done';G.isBest=isBest&&score>0;
  setMode('results');AudioK.setSong(wiped?'map':'house');AudioK.setHype(false);AudioK.setWinch(0,0);
  const row=(k,v,cls='')=>`<div class="k ${cls}">${k}</div><div class="v ${cls}">${v}</div>`;
  $('tally').innerHTML=
    row(ok?`Job pay: ${VEH[J.veh].name.toLowerCase()}`:'Job pay (not recovered)',pay)+
    row(ok?`Time ${Math.round(G.time)}s (par ${J.par}s)`:'Time bonus',timeB)+
    row(`Safety${G.unsafeT>0.05?` (${G.unsafeT.toFixed(1)}s in the zone)`:', zone kept clear'}`,safety)+
    row(`Clean rig${G.fails?` (${G.fails} failure${G.fails>1?'s':''})`:', no failures'}`,clean)+
    row(`Fans ${fans} x50`,fans*50)+
    row(`Tips ${tips} carrots x10`,tips*10)+
    row(`Hearts left ${hearts} x100`,hearts*100)+
    row(`TOTAL${G.isBest?' NEW BEST':''}`,score,'tot');
  const rb=$('resBtns');rb.innerHTML='';
  if(EMBED)rb.appendChild(mkBtn('start','BACK TO JAK',exitToHost));
  else{rb.appendChild(mkBtn('start','NEXT CALL',()=>{const i=JOBS.indexOf(J);if(ok&&i<JOBS.length-1){sel.job=JOBS[i+1].id;ls.set('recovery-job',sel.job);}startRun();}));
    rb.appendChild(mkBtn('start quiet','RETRY',()=>startRun()));rb.appendChild(mkBtn('start quiet','MENU',toMenu));}
  try{if(typeof VehicleRecovery.onFinish==='function')VehicleRecovery.onFinish(result);}catch(e){}
  try{if(window.parent&&window.parent!==window)window.parent.postMessage(result,'*');}catch(e){}
}
function exitToHost(){try{if(typeof VehicleRecovery.onExit==='function')VehicleRecovery.onExit(G&&G.result);}catch(e){}
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'recovery:exit',result:G&&G.result},'*');}catch(e){}}

// ---------- drawing ----------
const JAK_OFF=document.createElement('canvas');JAK_OFF.width=250;JAK_OFF.height=186;
function drawJak(sx,gy,scale=JS){ // Jak faces right, toward the stuck vehicle; (sx,gy) = rear of the tracks on the ground
  const saved=ctx;ctx=JAK_OFF.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,250,186);
  try{drawJakSide(4,184,T,{door:0,dj:true});}finally{ctx=saved;}
  const w=Math.round(250*scale),h=Math.round(186*scale);
  ctx.save();ctx.translate(Math.round(sx)+w,Math.round(gy)-h);ctx.scale(-1,1);ctx.drawImage(JAK_OFF,0,0,250,186,0,0,w,h);ctx.restore();
}
function rope(ax,ay,bx,by,sag,col){const n=Math.max(2,Math.ceil(Math.hypot(bx-ax,by-ay)/1.2));for(let i=0;i<=n;i++){const u=i/n;R(ax+(bx-ax)*u,ay+(by-ay)*u+sag*4*u*(1-u),1,1,col);}}
function farPines(y,camX,col){const off=(camX*0.5)%14;for(let i=-1;i<W/14+2;i++){const wx=Math.floor(camX*0.5/14)+i,h=12+((wx*7919)>>>0)%9,x=Math.round(i*14-off);for(let r=0;r<h;r++){const w=Math.max(1,Math.round(r*0.55));R(x+7-w/2,y-h+r,w,1,col);}}}
function lodge(x,y){R(x,y-40,96,40,'#6b4423');for(let i=0;i<40;i+=4)R(x,y-40+i,96,1,'#5a3a1d');R(x-6,y-50,108,11,'#eef3ff');R(x-6,y-40,108,2,'#3a2410');
  for(let k=0;k<5;k++)R(x+7+k*18,y-32,9,8,'#ffd27a');R(x+43,y-16,10,16,'#3a2410');txt('LODGE',x+48,y-48,'#3a2410',8,'center',null);}
function drawPerson(x,y,p){
  const walk=p.st==='in'||p.st==='out'||p.st==='leave',f=walk?Math.floor((T+p.ph)/150)%2:0,face=p.face||1,cheer=G&&G.phase==='won'&&Math.floor((T+p.ph)/220)%2;
  const q=(dx,dy,w,h,c)=>R(face<0?x-dx-w:x+dx,y+dy,w,h,c);
  q(-3,-4,2,4,'#2b2b44');q(f?1:0,-4,2,4,'#2b2b44');q(-3,0,3,1,'#111');q(f?1:0,0,3,1,'#111');
  q(-3,-11,6,7,p.col);q(-3,-17,6,6,p.skin);q(-3,-18,6,2,p.hat);q(1,-15,1,1,'#222');
  if(cheer){q(-4,-21,2,6,p.col);q(3,-21,2,6,p.col);}
  else if(p.st==='watch'){q(2,-13,4,2,p.col);q(5,-17,2,3,'#222');q(5,-16,1,1,'#5fe8ff');}
  else q(f?-4:2,-10,2,5,p.col);
}
function drawScene(){
  const J=G.job,V=G.V,ph=G.phase==='done'?G.drawAs:G.phase;
  // camera
  let tx;
  if(ph==='dispatch')tx=G.xs-W*0.5;
  else if(ph==='drive')tx=G.jak.x+47-W*0.42;
  else{const p=pose(G.s),l=winchPt().x-44,r=p.x+V.L/2+10;tx=r-l<=W?(l+r)/2-W/2:Math.min(r-W,winchPt().x-20);}
  tx=Math.max(tx,-230);
  G.camX+=(tx-G.camX)*(ph==='drive'?0.12:0.06);
  const g0t=clamp(Math.min(H*0.6,OVY-J.depth-30),118,H-30);G.g0+=(g0t-G.g0)*0.1;
  const camX=Math.round(G.camX),g0=Math.round(G.g0),K=J.terrain,night=!!J.night;
  ctx.save();
  if(G.shake>0&&!reduceMotion)ctx.translate(Math.round((Math.random()-0.5)*4),Math.round((Math.random()-0.5)*4));
  // backdrop
  sky(J.sky[0],J.sky[1]);if(night)stars(T,50);
  const sy=Math.round(g0*0.42);if(!night){R(W-46,sy,14,18,'#fff6c0');R(W-48,sy+2,18,14,'#fff6c0');}else{pxCircle(44,sy+5,6,'#f4f4ff');pxCircle(48,sy+3,5,mix(J.sky[0],J.sky[1],(sy+3)/H));}
  mountains(g0-14,86,night?'#2a1a48':'#7a8ab8',night?'#6a70a8':'#f4f8ff',1.2+J.edge%7,camX*0.12);
  mountains(g0-4,52,night?'#1e1236':'#5a6a98',night?'#4a4a7a':'#e8f0ff',2.6+J.edge%5,camX*0.22);
  farPines(g0-2,camX,night?'#14301e':'#2f6b4a');
  if(J.lodge)lodge(-150-camX,g0);
  // ground

  for(let sx=0;sx<W;sx++){const wx=camX+sx,gy=Math.round(groundAt(K,wx))+g0;if(gy>=H)continue;

    if(J.ice.some(([a,b])=>wx>=a&&wx<b)){R(sx,gy,1,3,'#a8e0ff');if(((wx+Math.floor(T/90))%17)<2)R(sx,gy,1,1,'#ffffff');}}
  if(!J.flat){const e=J.edge-camX;R(e-3,g0-4,7,4,snow);R(e-2,g0-5,5,1,'#ffffff');}

  if(ph==='drive'||ph==='dispatch'){const a=minFront(),b=maxFront();if(b>a){for(let x=Math.ceil(a/6)*6;x<b;x+=6)R(x-camX,g0+1,4,2,'#3ad06a');

  const hz=ph!=='won'&&Math.floor(T/350)%2===0;

  if(J.bury){const mx=G.xs-camX+6,mh=J.bury.h;for(let r=0;r<mh;r++){const w=Math.round(J.bury.w/2*Math.sqrt(1-Math.pow(1-r/mh,2)));R(mx-w,g0-mh+r+3,w*2,1,r<2?'#ffffff':'#eef3ff');}

  // hook points while rigging
  if(ph==='rig')for(const p of V.points){const w=toWorld(P0,p.x,p.y),x=Math.round(w.x-camX),y=Math.round(w.y+g0);
    if(G.broken[p.id]){R(x-2,y-2,5,1,'#ff3b3b');R(x-2,y+2,5,1,'#ff3b3b');}
    else if(p.id===G.rig.hook){const c=Math.floor(T/200)%2?PAL.Y:'#ffffff';R(x-4,y-4,9,1,c);R(x-4,y+4,9,1,c);R(x-4,y-4,1,9,c);R(x+4,y-4,1,9,c);}

    else if(G.rig.anchor==='dead'){const dx=G.jak.x-34-camX;R(dx-9,g0,18,5,'#5a6a94');R(dx-8,g0+1,16,3,'#6b4423');rope(rp.x-camX,rp.y+g0,dx,g0+2,0,'#3ad06a');}}
  if(night){ctx.globalAlpha=0.16;for(let k=0;k<70;k++){const y0=g0-22,sp=Math.round(k*0.35);R(jx+94+k,y0-sp,1,sp*2+4,'#fff3c0');}ctx.globalAlpha=1;}
  drawJak(jx,g0+Math.round(Math.abs(G.jak.v)>4?Math.floor(T/90)%2:0));
  const op=riderCanvas(G.crew,'stand',0,false);ctx.drawImage(op,Math.round(jx+40-12),g0-23);R(jx+46,g0-12,2,3,'#222');R(jx+46,g0-13,1,1,'#ff3b3b');

  // the winch line
  if((ph==='rig'&&G.rig.hook)||ph==='pull'||ph==='won'){
    const w=winchPt(),h=hookPt(),Tn=ph==='pull'?G.P.T:0,sag=Math.max(0,9*(1-Tn/2200)),hot=Tn>Math.min(...curLimits().map(l=>l.lb))*0.85;
    const col=hot&&Math.floor(T/100)%2?'#ff3b3b':'#ff7a1a';

      R(Math.round(w.x-camX)-1,Math.round(w.y+g0)-2,3,4,PAL.K);}}
  if(G.snap){const w=winchPt(),u=Math.min(1,G.snap.t*3),ex=lerp(G.snap.x,w.x,u),ey=lerp(G.snap.y,w.y,u)-Math.sin(u*Math.PI)*24;rope(w.x-camX,w.y+g0,ex-camX,ey+g0,-6,'#ff3b3b');}

  G.parts.forEach(p=>R(p.x-camX,p.y+g0,2,2,p.col));

  if(ph==='rig'){txt('RIG THE PULL',W/2,HUDH+6,PAL.Y,8,'center');txt(G.rig.hook?'':'PICK A HOOK POINT BELOW',W/2,HUDH+18,'#ffffff',8,'center');}
  if(ph==='dispatch')drawDispatch();
  if(G.banner){const b=G.banner,u=1-b.t/b.d,pop=u<0.1?u*10:1,y=Math.round(H*0.24)+Math.round((1-pop)*-20);txt(b.text,W/2,y,b.col,16,'center');if(b.sub)txt(b.sub,W/2,y+22,'#fff',8,'center');}

function drawDispatch(){

  if(n>c&&Math.floor(T/450)%2)txt(coarse?'TAP GO TO ROLL OUT':'SPACE TO ROLL OUT',W/2,y+h+6,PAL.Y,8,'center');
}

function drawGauge(){
  const P=G.P,r=G.rig,y=HUDH+5,x0=8,w=W-16,max=11000,X=v=>x0+Math.round(w*clamp(v/max,0,1));
  const need=resist(G.s)*(P.gasT>0?1-G.V.gas:1)/r.ma,L=curLimits(),lim=L.reduce((a,b)=>b.lb<a.lb?b:a),fr=P.T/lim.lb;

  txt(`${fmt(P.T)} LB`,x0,y+12,'#ffffff',8);txt(`${Math.round(G.s*100)}% OUT`,W-8,y+12,PAL.Y,8,'right');
  txt(`MOVES ${fmt(need)}`,x0,y+24,'#ffffff',8);txt(`LIMIT ${fmt(lim.lb)} ${lim.name}`,W-8,y+24,'#ff9a4d',8,'right');

function drawMenu(){
  const j=JOB_BY[sel.job];

function drawResults(){

const TSCALE=Math.max(1,Math.min(8,Math.round(+params.get('timescale')||1))); // test hook: run the clock faster
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-(last||now))/1000));last=now;
  try{for(let i=0;i<TSCALE;i++)update(dt);
    ctx.imageSmoothingEnabled=false;
    if(mode==='menu')drawMenu();else if(mode==='results')drawResults();else if(G)drawScene();
  }catch(e){console.error(e);window.__err=(window.__err||0)+1;window.__lastErr=String(e&&e.stack||e);}
  requestAnimationFrame(frame);
}

  onFinish:null,                      // called with the result object when a job ends

  _state:()=>G,_press:press,_release:release,_gas:gas,_park:tryPark,_startPull:startPull,_clear:clearNearest,_keys:keys,
  _info:()=>G&&{minFront:minFront(),maxFront:maxFront(),front:jakFront(),tree:treeInReach(),ice:jakOnIce(),grip:jakGrip(),need:resist(G.s)/G.rig.ma,limits:curLimits()}
};

renderMenu();setMode('menu');
if(params.get('autostart')==='1')startRun();
requestAnimationFrame(frame);

})();
