<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Snowcat GP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0d0718">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Same arcade cabinet look as The Legend of Jak: 16-bit screen on top, menu or touch controls underneath. */
:root{
  --bg:#0d0718;--panel:#1b1030;--panel-edge:#3b2a63;--ink:#fff4e6;--dim:#a596c4;
  --carrot:#ff5c00;--pink:#ff4fd8;--cyan:#5fe8ff;--gold:#ffd23f;
  --font-pixel:'Press Start 2P','Courier New',monospace;--font-body:'VT323','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body[data-mode="play"]{overflow:hidden;position:fixed;inset:0;width:100%;background:#000}
button,.chip,.start{touch-action:manipulation}
[hidden]{display:none!important}
#app{box-sizing:border-box;max-width:860px;margin:0 auto;padding-block:8px 12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:10px;min-height:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-family:var(--font-pixel);font-size:10px;letter-spacing:.08em;color:var(--carrot);text-shadow:2px 2px 0 #3a1200}
.brand small{display:block;color:var(--dim);font-size:7px;margin-top:5px;letter-spacing:.12em}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:var(--font-pixel);font-size:8px;letter-spacing:.06em;background:var(--panel);color:var(--ink);border:2px solid var(--panel-edge);padding:9px 10px;cursor:pointer;box-shadow:0 3px 0 #000}
.chip:hover{border-color:var(--cyan)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.chip.on{border-color:var(--gold);color:var(--gold)}
.chip:focus-visible,.start:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{position:relative;width:min(100%, calc((100dvh - 240px) * 1.1428));min-width:min(100%,280px);aspect-ratio:256/224;max-width:100%;margin:0 auto;background:#000;border:4px solid var(--panel-edge);box-shadow:0 0 0 4px #000,0 0 40px rgba(255,92,0,.25);box-sizing:border-box}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:pointer}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:rgba(13,7,24,.86);padding:16px}
.overlay h2{font-family:var(--font-pixel);font-size:clamp(11px,3.4vw,18px);line-height:1.5;margin:0;color:var(--gold);text-shadow:3px 3px 0 #3a1200}
.overlay p{font-size:clamp(18px,4.6vw,24px);margin:0}
.under{width:min(100%, calc((100dvh - 240px) * 1.1428));min-width:min(100%,280px);max-width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border:4px solid var(--ink);box-shadow:inset 0 0 0 3px #000,0 0 0 3px #000;padding:12px 14px 14px;display:grid;gap:10px}
.lbl{font-family:var(--font-pixel);font-size:8px;color:var(--dim);letter-spacing:.08em}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.status{font-size:clamp(18px,4.4vw,22px);color:var(--dim);line-height:1.05}
.status b{color:var(--gold);font-weight:normal}
.start{font-family:var(--font-pixel);font-size:13px;letter-spacing:.1em;background:var(--carrot);color:#fff;border:4px solid #fff;box-shadow:0 0 0 3px #000,0 5px 0 3px #000;padding:14px 18px;cursor:pointer;animation:pulse 1.1s steps(2) infinite}
.start:active{transform:translateY(3px)}
.start.quiet{animation:none;background:var(--panel);font-size:10px;padding:11px 12px}
@keyframes pulse{50%{background:var(--pink)}}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:12px;min-height:120px;touch-action:none}
.controls .pad{grid-column:2;grid-row:1}
.controls #trickBtn{grid-column:3;grid-row:1;justify-self:end}
body[data-stick="left"] .controls .pad{grid-column:1;justify-self:start}
body[data-stick="right"] .controls .pad{grid-column:3;justify-self:end}
body[data-stick="right"] .controls #trickBtn{grid-column:1;justify-self:start}
/* a run fills the whole screen: the slope runs edge to edge, the stick and TRICK float over the snow */
body[data-mode="play"] #app{position:fixed;inset:0;max-width:none;margin:0;min-height:0;gap:0;padding:env(safe-area-inset-top,0px) 0 0;display:flex;flex-direction:column;align-items:center}
body[data-mode="play"] .topbar{align-self:stretch;flex:none;justify-content:flex-end;padding:4px max(8px, env(safe-area-inset-right, 0px)) 4px max(8px, env(safe-area-inset-left, 0px))}
body[data-mode="play"] .brand{display:none}
body[data-mode="play"] .topbar .btns{gap:6px;flex-wrap:nowrap}
body[data-mode="play"] .topbar .chip{padding:6px 8px;font-size:7px;box-shadow:none;opacity:.9}
body[data-mode="play"] .screen{flex:none;border:0;box-shadow:none;min-width:0;max-width:none;margin:0}
body[data-mode="play"] .under{position:fixed;left:0;right:0;bottom:0;width:auto;max-width:none;min-width:0;margin:0;z-index:5;pointer-events:none;
  padding:0 max(18px, calc(env(safe-area-inset-right, 0px) + 12px)) max(18px, calc(env(safe-area-inset-bottom, 0px) + 10px)) max(18px, calc(env(safe-area-inset-left, 0px) + 12px))}
body[data-mode="play"] .controls{pointer-events:auto;background:transparent}
body[data-mode="play"] .pad{background:radial-gradient(circle,rgba(42,26,72,.5) 0 55%,rgba(27,16,48,.5) 56%);border-color:rgba(255,255,255,.55)}
body[data-mode="play"] #trickBtn{opacity:.92}
/* sideways phone: slope in the middle at full height, stick and TRICK in the side gutters */
body[data-mode="play"].land .under{top:calc(env(safe-area-inset-top,0px) + 34px);justify-content:center;padding-bottom:max(10px, env(safe-area-inset-bottom, 0px))}
body[data-mode="play"].land .controls{width:100%}
body[data-mode="play"].land:not([data-stick="right"]) .controls .pad{grid-column:1;justify-self:start}
#fsMsg{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 48px);transform:translateX(-50%);z-index:40;width:min(86vw,320px);background:var(--panel);border:3px solid var(--gold);padding:10px;font-family:var(--font-pixel);font-size:8px;line-height:1.7;color:var(--ink);text-align:center}
#trickBtn{width:104px;height:104px;border-radius:50%;padding:0;font-size:11px;background:#1d8fb8;animation:none}
#trickBtn.air{background:var(--carrot);animation:pulse .5s steps(2) infinite}
.pad{flex:none;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,#2a1a48 0 55%,#1b1030 56%);border:4px solid var(--panel-edge);position:relative;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--carrot);border:4px solid #fff;box-shadow:0 4px 0 #000}
.hint{font-size:clamp(17px,4.2vw,21px);color:var(--dim);line-height:1.05;text-align:center}
.hint b{color:var(--gold);font-weight:normal}
.tally{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:clamp(19px,4.8vw,24px);line-height:1.05}
.tally .v{text-align:right;color:var(--ink)}
.tally .k{color:var(--dim)}
.tally .tot{color:var(--gold);font-family:var(--font-pixel);font-size:11px;padding-top:8px;border-top:2px dashed var(--panel-edge);margin-top:4px}
footer{font-family:var(--font-pixel);font-size:7px;color:var(--dim);text-align:center;letter-spacing:.1em;line-height:1.8}
body[data-mode="play"] footer{display:none}
@media (prefers-reduced-motion: reduce){.start,#trickBtn.air{animation:none}}
#trickBtn.hit{transform:translateY(3px) scale(.94)}
</style>
<div id="app">
  <div class="topbar">
    <div class="brand">DISCO CARROT<small>SNOWCAT GP &middot; JAK MINI GAME</small></div>
    <div class="btns">
      <button class="chip" id="pauseBtn" type="button" hidden>PAUSE</button>
      <button class="chip" id="quitBtn" type="button" hidden>QUIT RUN</button>
      <button class="chip" id="fsBtn" type="button" hidden>FULL SCREEN</button>
      <button class="chip" id="muteBtn" type="button">SOUND: ON</button>
    </div>
  </div>

  <div class="screen" id="screen">
    <canvas id="cv" width="256" height="224" aria-label="Snowcat GP, a 16-bit snowcat kart racing mini game"></canvas>
    <div class="overlay" id="overlay" hidden>
      <h2 id="ovTitle">PAUSED</h2>
      <p id="ovText">Tap to keep racing</p>
    </div>
  </div>

  <div class="under">
    <div class="panel" id="menu">
      <div class="lbl">DRIVER (IN JAK)</div>
      <div class="row" id="crewRow"></div>
      <div class="lbl">TRACK</div>
      <div class="row" id="runRow"></div>
      <div class="status" id="menuStatus"></div>
      <div class="row" id="stickRow"><span class="lbl">STICK</span></div>
      <div class="row"><button class="start" id="goBtn" type="button">RACE</button></div>
    </div>

    <div class="controls" id="controls" hidden>
      <button class="start" id="trickBtn" type="button">ITEM</button>
      <div class="pad" id="pad"><div class="knob" id="knob"></div></div>
    </div>
    <div class="hint" id="hint" hidden></div>

    <div class="panel" id="results" hidden>
      <div class="tally" id="tally"></div>
      <div class="row" id="resBtns"></div>
    </div>
  </div>
  <footer>THIOKOL ENTERTAINMENT &middot; MISSOULA, MONTANA &middot; MINI GAME SANDBOX</footer>
</div>

<script>
// Jak soundtrack engine: 16-bit house and techno, all synthesized. makeJakMusic(audioContext, outputNode)
function makeJakMusic(ac,out){
  'use strict';
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  // signal chain: instruments -> bus -> warm lowpass -> glue compressor -> level -> out
  const bus=ac.createGain();
  const warm=ac.createBiquadFilter();warm.type='lowpass';warm.frequency.value=8500;warm.Q.value=0.4;
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=10;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.2;
  const level=ac.createGain();level.gain.value=1.4;
  bus.connect(warm);warm.connect(comp);comp.connect(level);level.connect(out);
  const duck=ac.createGain();duck.connect(bus); // melodic parts pump against the kick
  const echo=ac.createDelay(2),fb=ac.createGain(),ehp=ac.createBiquadFilter(),wet=ac.createGain();
  ehp.type='highpass';ehp.frequency.value=700;fb.gain.value=0.33;wet.gain.value=0.4;
  echo.connect(ehp);ehp.connect(fb);fb.connect(echo);ehp.connect(wet);wet.connect(bus);
  const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const pulse=w=>{const n=48,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*w);return ac.createPeriodicWave(re,im);};
  const P25=pulse(0.25),P12=pulse(0.125);

  function vco(type,f,t,stop,det){const o=ac.createOscillator();if(type==='p25')o.setPeriodicWave(P25);else if(type==='p12')o.setPeriodicWave(P12);else o.type=type;
    o.frequency.setValueAtTime(f,t);if(det)o.detune.value=det;o.start(t);o.stop(stop);return o;}
  function vca(t,v,dur,dest,attack=0.002){const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(dest);return g;}
  function nz(t,dur,ftype,freq,v,q=0.7,dest=bus){const s=ac.createBufferSource();s.buffer=nb;const f=ac.createBiquadFilter();f.type=ftype;f.frequency.value=freq;f.Q.value=q;
    s.connect(f);f.connect(vca(t,v,dur,dest,0.001));s.start(t,Math.random()*0.3);s.stop(t+dur+0.02);return f;}

  const I={
    kick(t,v){const o=vco('sine',155,t,t+0.42);o.frequency.exponentialRampToValueAtTime(47,t+0.11);o.connect(vca(t,v,0.38,bus,0.001));nz(t,0.012,'highpass',2600,v*0.25);
      duck.gain.cancelScheduledValues(t);duck.gain.setValueAtTime(0.28,t);duck.gain.linearRampToValueAtTime(1,t+0.22);},
    clap(t,v){[0,0.011,0.022].forEach(d=>nz(t+d,0.018,'bandpass',1400,v*0.7,0.9));nz(t+0.03,0.16,'bandpass',1250,v*0.45,0.8);},
    hat(t,v,open){nz(t,open?0.17:0.035,'highpass',open?7000:8200,v);},
    crash(t,v){nz(t,1.7,'highpass',3800,v);},
    riser(t,dur,v){const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=2.5;
      f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(7000,t+dur);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+dur);g.gain.linearRampToValueAtTime(0.0001,t+dur+0.03);
      s.connect(f);f.connect(g);g.connect(bus);s.start(t);s.stop(t+dur+0.05);},
    tom(t,v){const o=vco('sine',210,t,t+0.2);o.frequency.exponentialRampToValueAtTime(85,t+0.16);o.connect(vca(t,v,0.18,bus));},
    bass(t,m,dur,o){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=o.q||1;const c=o.cut||600;
      f.frequency.setValueAtTime(Math.min(16000,c*(o.acc?3.2:1.8)),t);f.frequency.exponentialRampToValueAtTime(Math.max(70,c*0.55),t+dur);
      vco(o.type||'square',mtof(m),t,t+dur+0.03).connect(f);f.connect(vca(t,o.v||0.25,dur,duck,0.004));},
    stab(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(3400,t);f.frequency.exponentialRampToValueAtTime(800,t+dur);
      const g=vca(t,v*1.6,dur,duck,0.003);f.connect(g);ms.forEach((m,j)=>vco('p25',mtof(m),t,t+dur+0.03,j%2?7:-7).connect(f));},
    pad(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1100;const g=ac.createGain();
      g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.35);g.gain.setValueAtTime(v,t+dur*0.75);g.gain.linearRampToValueAtTime(0.0001,t+dur);
      f.connect(g);g.connect(duck);ms.forEach((m,j)=>vco('sawtooth',mtof(m),t,t+dur+0.05,j%2?9:-9).connect(f));},
    lead(t,m,dur,v){const o=vco('p12',mtof(m),t,t+dur+0.05);const g=vca(t,v,dur,bus,0.004);o.connect(g);g.connect(echo);},
    bell(t,m,dur,v){const o=vco('triangle',mtof(m),t,t+dur+0.05),o2=vco('p25',mtof(m+12),t,t+dur*0.5);const g=vca(t,v,dur,bus,0.002);o.connect(g);o2.connect(vca(t,v*0.25,dur*0.5,g));g.connect(echo);},
    tri(t,m,dur,v){vco('triangle',mtof(m),t,t+dur+0.05).connect(vca(t,v,dur,bus,0.01));},
    snare(t,v){nz(t,0.16,'bandpass',1900,v*0.7,0.7);const o=vco('triangle',200,t,t+0.1);o.frequency.exponentialRampToValueAtTime(150,t+0.08);o.connect(vca(t,v*0.5,0.09,bus));},
    saw3(t,ms,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=3600;const g=vca(t,v,dur,duck,0.004);f.connect(g);g.connect(echo);
      for(const m of ms)for(const d of [-14,0,14])vco('sawtooth',mtof(m),t,t+dur+0.03,d).connect(f);},
    wobble(t,m,dur,rate,v){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=9;f.frequency.value=650;
      const lfo=vco('sine',rate,t,t+dur+0.05),lg=ac.createGain();lg.gain.value=560;lfo.connect(lg);lg.connect(f.frequency);
      vco('sawtooth',mtof(m),t,t+dur+0.03).connect(f);vco('square',mtof(m-12),t,t+dur+0.03,5).connect(f);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.setValueAtTime(v,t+dur-0.03);g.gain.linearRampToValueAtTime(0.0001,t+dur);f.connect(g);g.connect(duck);
      vco('sine',mtof(m-12),t,t+dur+0.03).connect(vca(t,v*0.9,dur,duck,0.01));},
    reese(t,m,dur,v){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=2;f.frequency.value=520;
      vco('sawtooth',mtof(m),t,t+dur+0.03,-18).connect(f);vco('sawtooth',mtof(m),t,t+dur+0.03,18).connect(f);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.02);g.gain.setValueAtTime(v,t+dur*0.85);g.gain.linearRampToValueAtTime(0.0001,t+dur);f.connect(g);g.connect(duck);
      vco('sine',mtof(m-12),t,t+dur+0.03).connect(vca(t,v*0.8,dur,duck,0.01));},
    // house piano: bright hammer on top of a soft body
    piano(t,ms,dur,v){const g=vca(t,v,dur,duck,0.002);const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(5200,t);f.frequency.exponentialRampToValueAtTime(1400,t+dur);f.connect(g);
      ms.forEach((m,j)=>{vco('triangle',mtof(m),t,t+dur+0.03,j%2?4:-4).connect(f);vco('p25',mtof(m+12),t,t+0.09).connect(vca(t,0.5,0.08,f));});},
    // electric piano for garage and liquid: sine plus a little bell, slow tremolo
    keys(t,ms,dur,v){const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(duck);
      const tr=vco('sine',5,t,t+dur+0.05),tg=ac.createGain();tg.gain.value=v*0.35;tr.connect(tg);tg.connect(g.gain);
      ms.forEach(m=>{vco('sine',mtof(m),t,t+dur+0.03).connect(g);vco('triangle',mtof(m+12),t,t+0.25).connect(vca(t,0.25,0.22,g));});},
    sub(t,m,dur,v){const o=vco('sine',mtof(m),t,t+dur+0.03);const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.setValueAtTime(v,t+dur*0.8);g.gain.linearRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(duck);},
    cowbell(t,v){const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=800;f.Q.value=3;const g=vca(t,v,0.16,bus,0.001);f.connect(g);vco('square',540,t,t+0.2).connect(f);vco('square',800,t,t+0.2).connect(f);},
    rim(t,v){nz(t,0.02,'bandpass',3200,v,4);vco('triangle',1700,t,t+0.03).connect(vca(t,v*0.5,0.025,bus));},
    shaker(t,v){nz(t,0.05,'bandpass',9000,v,1.5);},
    snap(t,v){nz(t,0.03,'bandpass',2600,v,2);nz(t+0.004,0.05,'highpass',5000,v*0.4);},
    ride(t,v){nz(t,0.45,'bandpass',6500,v,1.2);vco('square',4100,t,t+0.4).connect(vca(t,v*0.12,0.35,bus));},
    brush(t,v,dur){nz(t,dur,'bandpass',3600,v,0.6);},

      dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,'data');dv.setUint32(40,n,true);b.fill(128,44);
      let s='';for(const x of b)s+=String.fromCharCode(x);

    }catch(e){}

  function wake(){if(!ac)return;try{if(ac.state!=='running')ac.resume();}catch(e){}try{if(silentEl&&silentEl.paused){const p=silentEl.play();if(p&&p.catch)p.catch(()=>{});}}catch(e){}}

  function tone(f,t,dur,type='square',vol=0.3,slide){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);

function rngK(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}

// ---------- building a course: road segments with curves, smooth hills, scenery and pickups ----------
function buildCourse(tr){
  const r=rngK(tr.id.length*7919+tr.legs.length*31);
  const S=[],knots=[{i:0,y:0,flat:true}],boxes=[],carrots=[],summits=[];let y=0,startI=40,finI=0;
  for(const L of tr.legs){const i0=S.length,n=L.summit||L.base||L.fin?L.n:Math.round(L.n*(tr.sc||1));
    for(let k=0;k<n;k++){const e=Math.max(0,Math.min(1,k/14,(n-1-k)/14));
      S.push({i:S.length,curve:(L.c||0)*e,forest:!!L.f,whoop:!!L.w,leg:L,decor:[],sun:!!L.f&&r()<0.13});}
    y+=(L.h||0)*HU*(tr.sc||1);const flat=!!(L.summit||L.base||L.fin);
    if(flat)knots[knots.length-1].flat=true;
    knots.push({i:S.length,y,flat});
    if(L.base)startI=i0+34;
    if(L.fin)finI=i0+10;
    if(L.summit){const i=i0+Math.floor(n/2);summits.push({i,z:i*SEG,name:L.summit,first:null});S[i].arch={text:L.summit,kind:'summit'};
      S[i-3].decor.push({k:'cairn',x:-1.7});S[i+2].decor.push({k:'flags',x:1.75});S[i-8].decor.push({k:'flags',x:-1.9});}
    if(L.box){const i=i0+Math.floor(n*0.42);for(let q=0;q<4;q++)boxes.push({z:(i+0.5)*SEG,x:-0.75+q*0.5,t:0});}
    if(L.car){const i=i0+Math.floor(n*0.68),x=r()<0.5?-0.5:0.5;for(let q=0;q<5;q++)carrots.push({z:(i+q*3+0.5)*SEG,x,t:0});}
    if(L.pad)[0.22,0.62].forEach((f,q)=>{const i=i0+Math.floor(n*f),x=(q?1:-1)*(0.3+r()*0.25);for(let j=0;j<4;j++)S[i+j].pad=x;});
    if(L.ice)[0.3,0.72].forEach(f=>{const i=i0+Math.floor(n*f),x=(r()-0.5)*1.0;for(let j=0;j<6;j++)S[i+j].ice=x;});
  }
  for(let k=0;k<280;k++)S.push({i:S.length,curve:0,decor:[],runout:true,leg:{base:1}});
  knots.push({i:S.length,y,flat:true});
  // smooth hills through the leg ends: flat at the lodge and on the summits, no steps in between
  const N=S.length,Y=new Float64Array(N+1);
  knots.forEach((K,q)=>{if(K.flat||q===0||q===knots.length-1){K.m=0;return;}const a=knots[q-1],b=knots[q+1];K.m=(b.y-a.y)/(b.i-a.i);});
  for(let q=0;q<knots.length-1;q++){const a=knots[q],b=knots[q+1],d=b.i-a.i;
    for(let i=a.i;i<=b.i;i++){const t=d?(i-a.i)/d:0,t2=t*t,t3=t2*t;Y[i]=(2*t3-3*t2+1)*a.y+(t3-2*t2+t)*d*a.m+(-2*t3+3*t2)*b.y+(t3-t2)*d*b.m;}}
  // rollers on top of the hills where a leg has them
  const YW=Float64Array.from(Y),A=HU*0.75,P=12;
  for(let i=0;i<N;i++){const s=S[i];if(!s.whoop)continue;let e=0;while(e<8&&S[i-e]&&S[i-e].whoop&&S[i+e]&&S[i+e].whoop)e++;
    YW[i]+=A*(e/8)*(1-Math.cos(2*Math.PI*i/P))/2;}
  let maxY=0;for(let i=0;i<N;i++){const s=S[i];s.y1=YW[i];s.y2=YW[i+1];s.sl=(Y[i+1]-Y[i])/SEG;if(Y[i]>maxY)maxY=Y[i];}
  // scenery
  const near=i=>{for(let d=-60;d<=60;d+=10){const s=S[i+d];if(s&&s.forest)return true;}return false;};
  for(const s of S){const L=s.leg,i=s.i,base=L.base||L.fin||s.runout;
    if(s.forest){
      if(i%3===0)s.decor.push({k:'trunk',x:-(1.3+r()*0.35)});
      if(i%3===1)s.decor.push({k:'trunk',x:1.3+r()*0.35});
      if(i%2===0){s.decor.push({k:'trunk',x:-(2.0+r()*1.8)});s.decor.push({k:'trunk',x:2.0+r()*1.8});}
      if(r()<0.55)s.decor.push({k:'tall',x:(r()<0.5?-1:1)*(2.4+r()*2.6)});
    }else if(tr.kind==='snow'){
      const lowish=Y[i]<maxY*0.62;
      if((lowish||near(i))&&r()<(base?0.12:0.3))s.decor.push({k:'pine',x:(r()<0.5?-1:1)*(1.7+r()*3.2)});
      else if(!lowish&&r()<0.1)s.decor.push({k:'rock',x:(r()<0.5?-1:1)*(1.7+r()*2.8)});
    }else if(tr.kind==='sand'){
      if(r()<0.07)s.decor.push({k:'cactus',x:(r()<0.5?-1:1)*(1.7+r()*3)});
    }else if(r()<0.14)s.decor.push({k:'rock',x:(r()<0.5?-1:1)*(1.6+r()*3)});
  }
  // the lodge at the start, the Disco Carrot stage at the finish, and the banners over the road
  S[startI-8].decor.push({k:'lodge',x:-3.3});S[startI+6].decor.push({k:'pine',x:2.4});
  S[finI+4].decor.push({k:'stage',x:2.9});S[finI+14].decor.push({k:'lodge',x:-3.4});
  S[startI].arch={text:'START',kind:'start'};S[finI].arch={text:'FINISH',kind:'fin'};
  // the course profile for the menu and the HUD: height from start to finish, 0 to 1
  const prof=[];for(let q=0;q<=96;q++){const i=Math.round(startI+(finI-startI)*q/96);prof.push(Y[i]/(maxY||1));}
  return{S,N,boxes,carrots,summits,ftPer:(tr.vert||2500)/(maxY||1),startZ:startI*SEG,finZ:finI*SEG,len:(finI-startI)*SEG,maxY,prof,col:COLS[tr.kind],kind:tr.kind};
}
function segAt(TK,z){return TK.S[clamp(Math.floor(z/SEG),0,TK.N-1)];}
function roadY(TK,z){const s=segAt(TK,z),f=clamp(z/SEG-s.i,0,1);return s.y1+(s.y2-s.y1)*f;}

  k.spd+=(top-k.spd)*Math.min(1,dt*rate);

    else k.x+=steer*dx*0.35;
    if(ice&&k.spd>3000&&!(G.iceT>0)){G.iceT=2;floatText('ICY!','#9ad8ff');}
  }else k.x+=clamp(k.lane-k.x,-dt*1.3,dt*1.3);
  k.lean+=(steer-k.lean)*Math.min(1,dt*8);
  k.x=clamp(k.x,-2.4,2.4);
  // trees, rocks and the lodge
  if(k.hitT>0)k.hitT-=dt;
  if(!k.air&&!(k.hitT>0)){
    if(s.forest&&Math.abs(k.x)>1.2){k.hitT=0.6;k.spd*=k.star>0?0.8:0.3;k.x=Math.sign(k.x)*1.05;
      if(k.me){sfx.bump();G.shake=0.35;floatText('TIMBER!','#ff9a4d');puff(W/2+Math.sign(k.x)*30,150,16,'#ffffff',60);puff(W/2,20,14,'#ffffff',200);}}
    else if(Math.abs(k.x)>1.05)for(const d of s.decor){const D=DECOR[d.k];if(D&&D.hit&&Math.abs(d.x-k.x)<D.hit){k.hitT=0.6;k.spd*=0.35;k.x+=(k.x>d.x?1:-1)*0.3;
      if(k.me){sfx.bump();G.shake=0.3;floatText('BONK!','#ff6b6b');puff(W/2,170,10,'#ffffff');}break;}}
  }
  // move, then stick to the snow or fly off the top of a roller
  k.z+=k.spd*dt;
  const ry=roadY(TK,k.z),g=tr.kind==='moon'?3600:11000;
  if(k.air){k.vy-=g*dt;k.yw+=k.vy*dt;if(k.yw<=ry){k.air=false;if(k.me&&k.vy<-900){sfx.land();G.shake=0.15;puff(W/2,200,10,tr.kind==='sand'?'#e8c070':tr.kind==='moon'?'#9a9aa8':'#ffffff');}k.yw=ry;k.pvy=s.sl*k.spd;}}

  for(const c of TK.carrots){if(c.t>0)continue;if(Math.abs(k.z-c.z)<KL&&Math.abs(k.x-c.x)<0.3&&k.h<300){c.t=6;if(k.carrots<10)k.carrots++;if(k.me){sfx.chomp();G.carrotsGot++;}}}
  for(const p of G.patches)if(p.age>0.4&&!k.air&&Math.abs(k.z-p.z)<KL*0.8&&Math.abs(k.x-p.x)<0.32)spinOut(k,'ICE PATCH!');

function update(dt){
  T+=dt*1000;
  if(mode==='menu'||!G)return;
  G.sp=G.sp.filter(p=>(p.life-=dt)>0);G.sp.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;});
  G.floats=G.floats.filter(f=>(f.t-=dt)>0);
  if(G.banner&&(G.banner.t-=dt)<=0)G.banner=null;
  if(G.shake>0)G.shake-=dt;if(G.iceT>0)G.iceT-=dt;
  if(mode!=='play'||paused)return;
  const TK=G.TK,tr=G.tr,inp=G.auto&&G.phase==='race'?autoInput():readInput(dt);
  if(G.phase==='count'){const c0=Math.ceil(G.countT);G.countT-=dt;const c1=Math.ceil(G.countT);
    if(c1!==c0&&c1>0&&c1<=3){sfx.count(false);setBanner(String(c1),'','#ffffff',0.8);}
    if(G.countT<=0){G.phase='race';sfx.count(true);setBanner('GO!',TK.summits.length>1?`${TK.summits.length} SUMMITS, THEN THE BASE`:'TO THE SUMMIT!','#3ad06a',1.4);AudioK.setSong(tr.song);
      if(inp.iy<-0.4||keys.ArrowUp)G.me.boost=0.8;}
    return;}
  if(G.phase==='race'||G.phase==='finish')G.time+=dt;
  for(const k of G.karts)stepKart(k,dt,inp.ix,inp.iy>0.45);
  // snowcats bump each other; the disco ball spins anyone it touches
  const ks=G.karts;for(let i=0;i<ks.length;i++)for(let j=i+1;j<ks.length;j++){const a=ks[i],b=ks[j];if(Math.abs(a.z-b.z)>KL||Math.abs(a.x-b.x)>0.36||Math.abs(a.h-b.h)>250)continue;
    if(a.star>0)spinOut(b,'DISCO BALLED!');else if(b.star>0)spinOut(a,'DISCO BALLED!');
    else{const push=(0.36-Math.abs(a.x-b.x))/2*(a.x<=b.x?1:-1);a.x-=push;b.x+=push;const back=a.z<b.z?a:b,front=back===a?b:a;back.spd=Math.min(back.spd,front.spd*0.97);if((a.me||b.me)&&Math.random()<0.15)sfx.bump();}}
  // snowballs, lasers, ice and clouds
  for(const s of G.shots){s.t-=dt;
    if(s.laser){if(s.t<=0)spinOut(s.tgt,'ZAPPED!');continue;}
    s.z+=s.spd*dt;
    for(const k of G.karts){if(k===s.from&&s.t>2.2)continue;if(Math.abs(k.z-s.z)<KL&&Math.abs(k.x-s.x)<0.32&&k.h<400){spinOut(k,'SNOWBALLED!');s.t=0;}}}
  G.shots=G.shots.filter(s=>s.t>0);G.patches.forEach(p=>{p.t-=dt;p.age+=dt;});G.patches=G.patches.filter(p=>p.t>0);G.clouds.forEach(c=>c.t-=dt);G.clouds=G.clouds.filter(c=>c.t>0);
  TK.boxes.forEach(b=>{if(b.t>0)b.t-=dt;});TK.carrots.forEach(c=>{if(c.t>0)c.t-=dt;});
  if(G.roulette>0)G.roulette-=dt;
  // the mountains slide across the sky as the road bends
  {const s=segAt(TK,G.me.z);G.skyX+=s.curve*(G.me.spd/VMAX)*dt*26;}
  if(G.phase==='finish'){G.finT+=dt;if(G.finT>3.6)finishRun(false);}
}

// ---------- results ----------
function finishRun(quit){
  if(G.phase==='done')return;
  const p=G.myPlace||placeOf(G.me),ps=places(),pts=[15,12,10,8,6,4,2,1][p-1]||0;
  const result={type:'kart:result',crew:G.crew,track:G.tr.id,place:p,points:pts,time:Math.round(G.time*10)/10,bestLap:0,summits:G.komGot,carrots:G.carrotsGot,quit:!!quit,
    shopPoints:G.carrotsGot+Math.max(0,9-p)*2+G.komGot*3,order:ps.map(k=>k.me?'YOU':k.name)};
  const b=bests();if(!quit&&(!b[G.tr.id]||p<parseInt(b[G.tr.id]))){b[G.tr.id]=ord(p);ls.set('kart-best',JSON.stringify(b));}
  G.result=result;G.phase='done';
  setMode('results');AudioK.setSong(p<=3?'house':'map');AudioK.setHype(false);
  const row=(a,v,cls='')=>`<div class="k ${cls}">${a}</div><div class="v ${cls}">${v}</div>`;
  $('tally').innerHTML=ps.map((k,i)=>row(`${ord(i+1)} ${k.me?'YOU ('+CREW_BY[G.crew].name+' IN JAK)':k.name}`,k.done?k.fin.toFixed(1)+'s':'')).join('')+
    row(`King of the Mountain (${G.TK.summits.length} ${G.TK.summits.length>1?'summits':'summit'})`,G.komGot)+row('Carrots grabbed',G.carrotsGot)+row(`FINISHED ${ord(p)}`,`${pts} PTS`,'tot');
  const rb=$('resBtns');rb.innerHTML='';
  if(EMBED)rb.appendChild(mkBtn('start','BACK TO JAK',exitToHost));
  else{rb.appendChild(mkBtn('start','RACE AGAIN',()=>startRun()));rb.appendChild(mkBtn('start quiet','CHANGE TRACK',toMenu));}
  try{if(typeof SnowcatGP.onFinish==='function')SnowcatGP.onFinish(result);}catch(e){}
  try{if(window.parent&&window.parent!==window)window.parent.postMessage(result,'*');}catch(e){}
}
function exitToHost(){try{if(typeof SnowcatGP.onExit==='function')SnowcatGP.onExit(G&&G.result);}catch(e){}
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'kart:exit',result:G&&G.result},'*');}catch(e){}}

// ---------- drawing: sky, then the road and everything on it from far to near ----------
const FOGC={};
function fc(col,f){const l=Math.min(12,Math.round(f*12));if(!l)return col;const k=col+l+G.tr.sky[1];return FOGC[k]||(FOGC[k]=mix(col,G.tr.sky[1],l/12*0.6));}
function poly(x1,y1,w1,x2,y2,w2,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x1-w1,y1);ctx.lineTo(x2-w2,y2);ctx.lineTo(x2+w2,y2);ctx.lineTo(x1+w1,y1);ctx.closePath();ctx.fill();}
function band(p1,p2,xc,hw,col){poly(p1.x+xc*p1.w,p1.y,hw*p1.w,p2.x+xc*p2.w,p2.y,hw*p2.w,col);}
function drawSky(alt){const tr=G.tr;sky(tr.sky[0],tr.sky[1]);
  const off=G.skyX*6;
  if(tr.kind==='moon'){stars(T,60);const ex=Math.round(((-off*0.5)%W+W*2)%W);R(ex-9,14,18,18,'#1d6fd0');R(ex-7,16,8,6,'#3ad06a');R(ex+1,24,6,4,'#3ad06a');R(ex-9,14,18,2,'#ffffff');}
  else if(tr.kind==='sand')R(Math.round(((-off*0.5)%W+W*2)%W),16,16,16,'#fff2b0');
  // from up high the far ranges sit lower against the sky
  const by=HC+6+alt*22;mountains(by,34,tr.mtn[0],tr.mtn[1],tr.id.length,off);mountains(by+4,20,mix(tr.mtn[0],'#140b22',0.3),tr.mtn[1],tr.id.length+3,off*1.6);
  R(0,Math.round(by+4),W,H,mix(tr.mtn[0],'#140b22',0.3));}
function drawSeg(s,p1,p2,f){const C=G.TK.col,alt=Math.floor(s.i/3)%2;
  const gc=s.forest?(s.sun?C.gs:alt?C.gf1:C.gf2):alt?C.g1:C.g2;
  ctx.fillStyle=fc(gc,f);ctx.fillRect(0,Math.floor(p2.y),W,Math.ceil(p1.y)-Math.floor(p2.y)+1);
  poly(p1.x,p1.y,p1.w*1.13,p2.x,p2.y,p2.w*1.13,fc(alt?C.e1:C.e2,f));
  poly(p1.x,p1.y,p1.w,p2.x,p2.y,p2.w,fc(s.forest?(s.sun?C.rs:alt?C.rf1:C.rf2):alt?C.r1:C.r2,f));
  // groomer lines (corduroy) on the snow, tire tracks in the sand and dust
  if(!alt&&p1.w>6){const lc=fc(s.forest?C.lnf:C.ln,f);for(const xc of [-0.66,-0.22,0.22,0.66])band(p1,p2,xc,0.018,lc);}
  if(s.pad!==undefined){band(p1,p2,s.pad,0.22,fc(s.i%2?'#ff5c00':'#ffd23f',f));}
  if(s.ice!==undefined){band(p1,p2,s.ice,0.38,fc('#d8f4ff',f));if(s.i%2)band(p1,p2,s.ice-0.1,0.1,fc('#ffffff',f));}

}
// sprite helpers: draw an image standing on the ground at (x, y), sized from world units
function stand(img,x,y,ww,wh,sc,f){const w=ww*sc,h=wh*sc;if(w<1||x+w/2<0||x-w/2>W||y<0)return;if(f>0.2)ctx.globalAlpha=1-(f-0.2)*0.7;

function drawSegSprites(s,p1,p2,f,objs,n){const sc=p1.s*W/2;

    if(d.k==='trunk'){const w=Math.max(1,150*sc),h=(1700)*sc;if(x+w<0||x-w>W)continue;R(x-w/2,p1.y-h,w,h,fc('#3e2614',f));if(w>3)R(x-w/2,p1.y-h,Math.max(1,w*0.3),h,fc('#6b4423',f));continue;}
    const D=DECOR[d.k];stand(decorImg(d.k),x,p1.y,D.w,D.h,sc,f);}
  if(s.forest){const img=canopySprite(s.i%4),dw=8.8*p1.w,dh=1650*sc,y=p1.y-(1550+1650)*sc;

    else if(o.kind==='shot'){const rr=Math.max(1,110*sc2);ctx.fillStyle=PAL.K;ctx.beginPath();ctx.arc(x,y0-rr*3,rr+1,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(x,y0-rr*3,rr,0,Math.PI*2);ctx.fill();}
    else if(o.kind==='kart')drawKart(o.o,x,y0,sc2);}
}
function drawKart(k,x,y0,sc){const w=KW*sc,h=w*44/48;if(w<2||x+w<0||x-w>W)return;
  const lean=k.spin>0?(Math.floor(k.roll*2)%3)-1:clamp(Math.round(k.me?k.lean*1.3:(k.lane-k.x)*3),-1,1);

function drawRoad(){
  const TK=G.TK,me=G.me,camZ=me.z-PZ,ry=roadY(TK,me.z),camY=ry+CAMH+me.h*0.5,camX=me.x*RW;
  drawSky(clamp(ry/(TK.maxY||1),0,1));

  const objs={},add=(z,kind,x,o)=>{const i=Math.floor(z/SEG);(objs[i]||(objs[i]=[])).push({z,kind,x,o});};
  for(const k of G.karts){k.scr=null;if(!k.me)add(k.z,'kart',k.x,k);}
  TK.boxes.forEach(b=>{if(b.t<=0)add(b.z,'box',b.x);});TK.carrots.forEach(c=>{if(c.t<=0)add(c.z,'carrot',c.x);});
  G.patches.forEach(p=>add(p.z,'patch',p.x));G.clouds.forEach(c=>add(c.z,'cloud',c.x,c));G.shots.forEach(s=>{if(!s.laser)add(s.z,'shot',s.x);});

// the course profile: the mountain from start to finish with the summits flagged
function drawProfile(TK,x,y,w,h,col,dots){const pr=TK.prof,n=pr.length-1;
  for(let i=0;i<w;i++){const v=pr[Math.round(i/(w-1)*n)],hh=Math.max(1,Math.round(v*(h-4)));R(x+i,y+h-hh,1,hh,col);R(x+i,y+h-hh,1,1,'#ffffff');}
  TK.summits.forEach(su=>{const u=(su.z-TK.startZ)/TK.len,px=x+Math.round(u*(w-1)),py=y+h-Math.round(pr[Math.round(u*n)]*(h-4));R(px,py-7,1,7,'#ffffff');R(px+1,py-7,4,3,su.first&&dots&&su.first.me?PAL.Y:'#ff4fd8');});
  if(!dots)return;
  G.karts.slice().sort((a,b)=>a.me-b.me).forEach(k=>{const u=clamp((k.z-TK.startZ)/TK.len,0,1),px=x+Math.round(u*(w-1)),py=y+h-Math.round(pr[Math.round(u*n)]*(h-4));
    R(px-1,py-2,k.me?4:3,k.me?4:3,k.me?'#ff5c00':RACERS[k.rid].col);});}

function drawGame(){

const PORT_X0=14,PORT_Y=70,MENU_TK={};

function drawResults(){drawGame();const r=G.result;if(!r)return;
  R(0,22,W,62,'rgba(13,7,24,0.82)');txt(r.place===1?'WINNER!':'FINISHED',128,28,r.place===1?PAL.Y:'#ffffff',8,'center');txt(ord(r.place),128,42,'#fff',16,'center');txt(`${r.points} POINTS`,128,64,'#5fe8ff',8,'center');}
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-(last||now))/1000));last=now;
  try{update(dt);ctx.imageSmoothingEnabled=false;
    if(mode==='menu')drawMenu();else if(mode==='results')drawResults();else if(G)drawGame();
  }catch(e){console.error(e);window.__err=(window.__err||0)+1;window.__lastErr=String(e&&e.stack||e);}
  requestAnimationFrame(frame);
}
